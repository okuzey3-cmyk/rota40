   {q:"Bir kanun teklifinin TBMM’de kabulünde genel kural olarak hangi çoğunluk esastır?", options:["Toplantıya katılanların salt çoğunluğu","Üye tam sayısının 2/3’ü","Üye tam sayısının 3/5’i","Oy birliği"], answer:0, exp:"Kanunların kabulünde genel kural, toplantıya katılanların salt çoğunluğudur; toplantı yeter sayısı ise üye tam sayısının en az 1/3’üdür."}
 ]},
{id:'va4', subject:'vatandaslik', title:'Yürütme ve Yargı',
 analogy:"Yürütme, alınan kararları hayata geçiren operasyon ekibi gibidir; yargı ise anlaşmazlıkları çözen hakemdir.",
 lessonSteps:[
   {title:"1. Sıfırdan Başlayalım", body:"Yürütme, alınan kararları hayata geçiren, günlük devlet işlerini yöneten organdır. Türkiye’de Cumhurbaşkanlığı hükümet sisteminde bu yetki Cumhurbaşkanına aittir — Cumhurbaşkanı hem devletin başı hem de yürütmenin başıdır."},
   {title:"2. Şimdi Genişletelim", body:"Yargı ise anlaşmazlıkları çözen, kanunun doğru uygulanıp uygulanmadığını denetleyen bağımsız bir organdır — sanki tarafsız bir hakem gibi düşünebilirsin. Yargının bağımsız olması çok önemlidir, çünkü hâkimler siyasi baskı altında kalmadan adil karar verebilmelidir."},
   {title:"3. Son Bir Adım", body:"Türkiye’de birkaç önemli yüksek mahkeme vardır, her birinin ayrı bir görevi var: Anayasa Mahkemesi, bir kanunun Anayasa’ya uygun olup olmadığını denetler; Yargıtay, normal mahkemelerin (adli yargının) en üst mercisidir; Danıştay ise devlet işlemlerine (idari yargıya) bakan en üst mercidir. Hâkimlerin atama ve terfi gibi özlük işlerine ise Hâkimler ve Savcılar Kurulu bakar."}
 ],
 strategy:"Hangi yüksek mahkemenin hangi işi yaptığını net ayır: Anayasa Mahkemesi=anayasaya uygunluk, Yargıtay=adli, Danıştay=idari.",
 worked:{q:"Kanunların Anayasa’ya uygunluğunu denetleyen yüksek mahkeme hangisidir?", steps:["Yüksek mahkemelerin görev alanlarını ayır: adli, idari, anayasal denetim.","“Kanunun anayasaya uygunluğu” ifadesi anayasal denetimi işaret eder.","Bu denetimi yapan özel bir mahkeme vardır.","Cevap: Anayasa Mahkemesi."]},
 questions:[
   {q:"Kanunların Anayasa’ya uygunluğunu denetleyen yüksek mahkeme hangisidir?", options:["Anayasa Mahkemesi","Yargıtay","Danıştay","Sayıştay"], answer:0},
   {q:"Adli yargının en üst mercii hangisidir?", options:["Yargıtay","Danıştay","Anayasa Mahkemesi","Hâkimler ve Savcılar Kurulu"], answer:0},
   {q:"Cumhurbaşkanlığı hükümet sisteminde yürütme yetkisi kime aittir?", options:["Cumhurbaşkanına","TBMM Başkanına","Başbakana","Anayasa Mahkemesi Başkanına"], answer:0},
   {q:"Cumhurbaşkanı seçilme yaşı kaçtır?", options:["40","35","30","25"], answer:0},
   {q:"Hâkimler ve savcıların özlük işlerine (atama, terfi vb.) bakan kurul hangisidir?", options:["Hâkimler ve Savcılar Kurulu (HSK)","Yargıtay Genel Kurulu","Danıştay Genel Kurulu","Adalet Bakanlığı Teftiş Kurulu"], answer:0}
 ]},
{id:'va5', subject:'vatandaslik', title:'Temel Hak ve Özgürlükler',
 analogy:"Temel haklar, her vatandaşa doğuştan verilen kişisel donanım gibidir — devlet bu donanımı korumak ve gerektiğinde sınırlarını belirlemekle yükümlüdür.",
 lessonSteps:[
   {title:"1. Sıfırdan Başlayalım", body:"Her insanın, sadece insan olduğu için sahip olduğu bazı temel haklar vardır — yaşama hakkı, düşünce özgürlüğü, mülkiyet hakkı gibi. Devletin görevi bu hakları korumaktır, kısıtlamak değil."},
   {title:"2. Şimdi Genişletelim", body:"Ama bazen bu hakların sınırlandırılması gerekebilir (örneğin kamu düzenini veya başkalarının haklarını korumak için). Anayasa, bu sınırlamanın keyfi yapılamayacağını, ancak KANUNLA yapılabileceğini söyler — yani bir yönetmelik veya genelgeyle temel bir hak kısıtlanamaz, bunun için TBMM’nin çıkardığı bir kanun gerekir."},
   {title:"3. Son Bir Adım", body:"Temel haklar üç ana gruba ayrılır: kişi hakları (yaşama hakkı, kişi dokunulmazlığı gibi doğuştan gelen haklar), sosyal ve ekonomik haklar (eğitim hakkı, sağlık hakkı, çalışma hakkı gibi devletin sağlamakla yükümlü olduğu haklar) ve siyasi haklar (seçme-seçilme hakkı, dilekçe hakkı gibi vatandaşın yönetime katılma hakları). Yaşama hakkı gibi bazı temel haklara olağanüstü hâllerde bile dokunulamaz."}
 ],
 strategy:"Bir hakkın hangi kategoriye girdiğini belirle; sınırlamanın ancak kanunla yapılabileceğini unutma.",
 worked:{q:"Temel hak ve özgürlükler ancak neyle sınırlandırılabilir?", steps:["Temel hakların keyfi olarak sınırlanamayacağını, bir güvenceye bağlı olduğunu hatırla.","Anayasa bu güvenceyi tek bir yasama işlemine bağlamıştır.","Yönetmelik veya genelge ile sınırlama yapılamaz, sadece kanunla yapılabilir.","Cevap: Kanunla."]},
 questions:[
   {q:"Temel hak ve özgürlükler ancak neyle sınırlandırılabilir?", options:["Kanunla","Yönetmelikle","Genelgeyle","Cumhurbaşkanlığı kararnamesiyle"], answer:0},
   {q:"Seçme ve seçilme hakkı hangi hak kategorisine girer?", options:["Siyasi haklar","Sosyal haklar","Kişi hakları","Ekonomik haklar"], answer:0},
   {q:"Eğitim hakkı hangi hak kategorisine girer?", options:["Sosyal ve ekonomik haklar","Siyasi haklar","Kişi hakları","Yargı hakları"], answer:0, exp:"Eğitim hakkı, Anayasa’da sosyal ve ekonomik haklar başlığı altında düzenlenmiştir."},
   {q:"Dilekçe hakkı hangi hak kategorisine girer?", options:["Siyasi haklar","Sosyal haklar","Kişi hakları","Ekonomik haklar"], answer:0, exp:"Dilekçe hakkı, vatandaşların devlet organlarına başvurma hakkı olup siyasi haklar kategorisinde değerlendirilir."},
   {q:"Olağanüstü hâllerde bile dokunulamayacak temel bir hak aşağıdakilerden hangisidir?", options:["Yaşama hakkı","Seyahat özgürlüğü","Toplantı hakkı","Basın özgürlüğü"], answer:0}

/* ---------- Plan üretimi ---------- */
function buildDayTypes(){
  const flexDays = 38; // gün 1-38 arası (39=deneme, 40=final sabit) — artık soğuk test günü yok
  const lessonSlotsTarget = Math.min(TOPICS.length, flexDays - 3); // en az 3 tekrar günü kalsın
  const reviewDays = flexDays - lessonSlotsTarget;
  const interval = Math.max(2, Math.floor(flexDays / (reviewDays + 1)));
  const types = [];
  let contentIndex = 0, reviewsPlaced = 0;
  for(let d=1; d<=40; d++){
    if(d===40){ types.push({day:d, type:'final'}); continue; }
    if(d===39){ types.push({day:d, type:'deneme'}); continue; }
    contentIndex++;
    const isReviewSlot = (contentIndex % interval === 0) && reviewsPlaced < reviewDays;
    if(isReviewSlot){ types.push({day:d, type:'review'}); reviewsPlaced++; }
    else { types.push({day:d, type:'lesson'}); }
  }
  return types;
}

function assignTopicsToSlots(slotCount){
  const bySubject = {};
  SUBJECTS.forEach(s=> bySubject[s.id] = TOPICS.filter(t=>t.subject===s.id));
  const order = SUBJECTS.map(s=>s.id);
  const ptr = {}; order.forEach(id=> ptr[id]=0);
  const result = [];
  let idx = 0, guard = 0;
  while(result.length < slotCount && guard < 2000){
    guard++;
    const sid = order[idx % order.length]; idx++;
    if(ptr[sid] < bySubject[sid].length){
      result.push({topic: bySubject[sid][ptr[sid]], isReview:false});
      ptr[sid]++;
    }
    if(order.every(id => ptr[id] >= bySubject[id].length)) break;
  }
  if(result.length < slotCount){
    const weightOrder = SUBJECTS.slice().sort((a,b)=>b.weight-a.weight).map(s=>s.id);
    const extraPtr = {}; weightOrder.forEach(id=> extraPtr[id]=0);
    let wi = 0, g2 = 0;
    while(result.length < slotCount && g2 < 2000){
      g2++;
      const sid = weightOrder[wi % weightOrder.length]; wi++;
      const arr = bySubject[sid];
      if(!arr.length) continue;
      result.push({topic: arr[extraPtr[sid] % arr.length], isReview:true});
      extraPtr[sid]++;
    }
  }
  return result;
}

function buildFullPlan(){
  const dayTypes = buildDayTypes();
  const lessonSlots = dayTypes.filter(d=>d.type==='lesson');
  const assignments = assignTopicsToSlots(lessonSlots.length);
  let ai = 0;
  const plan = [];
  let sinceReview = [];
  dayTypes.forEach(d=>{
    if(d.type==='lesson'){
      const a = assignments[ai++];
      plan.push({day:d.day, type:'lesson', topicId:a.topic.id, isReview:a.isReview});
      sinceReview.push(a.topic.id);
    } else if(d.type==='review'){
      plan.push({day:d.day, type:'review', topicIds: sinceReview.slice()});
      sinceReview = [];
    } else if(d.type==='deneme'){
      plan.push({day:d.day, type:'deneme', topicIds: TOPICS.map(t=>t.id)});
    } else if(d.type==='final'){
      plan.push({day:d.day, type:'final'});
    }
  });
  return plan;
}

/* ---------- Depolama ---------- */
const LS_PLAN='rota40_plan', LS_START='rota40_start', LS_PROGRESS='rota40_progress';

function loadOrCreatePlan(){
  let raw = localStorage.getItem(LS_PLAN);
  if(raw){
    try{
      const parsed = JSON.parse(raw);
      const validTypes = ['lesson','review','deneme','final'];
      const lessonCount = parsed.filter(p=>p.type==='lesson').length;
      const allTypesValid = Array.isArray(parsed) && parsed.every(p=>validTypes.includes(p.type));
      // Kayıtlı plan güncel motorla (gün sayısı, tip isimleri, konu sayısı) uyuşuyorsa kullan;
      // uyuşmuyorsa (eski bir sürümden kalmışsa) sessizce yeniden oluştur.
      if(parsed.length===40 && allTypesValid && lessonCount===TOPICS.length){
        return parsed;
      }
    }catch(e){}
  }
  const fresh = buildFullPlan();
  localStorage.setItem(LS_PLAN, JSON.stringify(fresh));
  return fresh;
}
function getStartDate(){
  let s = localStorage.getItem(LS_START);
  if(!s){ s = new Date().toISOString(); localStorage.setItem(LS_START, s); }
  return new Date(s);
}
function loadProgress(){
  let p = localStorage.getItem(LS_PROGRESS);
  if(p){ try{ return JSON.parse(p); }catch(e){} }
  return {days:{}, bySubject:{}};
}
function saveProgress(p){ localStorage.setItem(LS_PROGRESS, JSON.stringify(p)); }

let PLAN = loadOrCreatePlan();
let PROGRESS = loadProgress();
const START_DATE = getStartDate();

function todayIndex(){
  const diff = Math.floor((Date.now() - START_DATE.getTime()) / 86400000);
  return Math.min(Math.max(diff+1, 1), 40);
}
function daysUntilExam(){
  const diff = Math.ceil((EXAM_DATE.getTime() - Date.now()) / 86400000);
  return Math.max(diff, 0);
}
function planFor(day){ return PLAN.find(p=>p.day===day); }
function coachLine(day){ return COACH_LINES[day % COACH_LINES.length]; }

function recordResult(day, correct, total, subjectTally, elapsedSeconds){
  PROGRESS.days[day] = {done:true, correct, total, ts: Date.now(), elapsed: elapsedSeconds||0};
  Object.keys(subjectTally).forEach(sid=>{
    if(!PROGRESS.bySubject[sid]) PROGRESS.bySubject[sid] = {correct:0, total:0};
    PROGRESS.bySubject[sid].correct += subjectTally[sid].correct;
    PROGRESS.bySubject[sid].total += subjectTally[sid].total;
  });
  saveProgress(PROGRESS);
}

function streakCount(){
  let s = 0;
  let d = todayIndex();
  // bugün henüz yapılmadıysa dünden say
  if(!PROGRESS.days[d] || !PROGRESS.days[d].done) d -= 1;
  while(d >= 1 && PROGRESS.days[d] && PROGRESS.days[d].done){ s++; d--; }
  return s;
}

/* ---------- Soru havuzu yardımcıları ---------- */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function questionsFromTopics(topicIds, cap){
  let pool = [];
  topicIds.forEach(tid=>{
    const t = topicOf(tid);
    if(!t) return;
    t.questions.forEach(q=> pool.push(Object.assign({}, q, {subject:t.subject, topicTitle:t.title})));
  });
  pool = shuffle(pool);
  return cap ? pool.slice(0, cap) : pool;
}

function renderQuizList(questions, containerId, onFinish){
  const c = document.getElementById(containerId);
  let html = '<div class="quiz-timer" id="quizTimer">00:00</div>';
  questions.forEach((q, i)=>{
    html += '<div class="qblock" data-qi="'+i+'">';
    html += '<div class="qnum">SORU '+(i+1)+' / '+questions.length+ (q.topicTitle? ' · '+esc(q.topicTitle):'') +'</div>';
    html += '<div class="qtext">'+esc(q.q)+'</div>';
    const letters=['A','B','C','D'];
    q.options.forEach((opt, oi)=>{
      html += '<div class="opt" data-oi="'+oi+'"><span class="letter">'+letters[oi]+'</span><span>'+esc(opt)+'</span></div>';
    });
    if(q.exp) html += '<div class="qexp">'+esc(q.exp)+'</div>';
    html += '</div>';
  });
  html += '<button class="btn btn-primary" id="quizSubmitBtn" disabled>Önce tüm soruları cevapla</button>';
  c.innerHTML = html;

  const quizStart = Date.now();
  const timerEl = document.getElementById('quizTimer');
  const timerInterval = setInterval(()=>{
    const s = Math.floor((Date.now()-quizStart)/1000);
    const mm = String(Math.floor(s/60)).padStart(2,'0');
    const ss = String(s%60).padStart(2,'0');
    if(timerEl) timerEl.textContent = mm+':'+ss;
  }, 1000);

  const answers = new Array(questions.length).fill(null);
  c.querySelectorAll('.qblock').forEach(block=>{
    const qi = parseInt(block.getAttribute('data-qi'),10);
    block.querySelectorAll('.opt').forEach(optEl=>{
      optEl.addEventListener('click', ()=>{
        if(answers[qi] !== null) return;
        const oi = parseInt(optEl.getAttribute('data-oi'),10);
        answers[qi] = oi;
        block.querySelectorAll('.opt').forEach(o=>o.classList.add('selected-lock'));
        optEl.classList.add('selected');
        const allAnswered = answers.every(a=>a!==null);
        const btn = document.getElementById('quizSubmitBtn');
        if(allAnswered){ btn.disabled=false; btn.textContent='Sonuçları Gör'; }
        else { btn.disabled=true; btn.textContent='Kalan soru: '+answers.filter(a=>a===null).length; }
      });
    });
  });

  document.getElementById('quizSubmitBtn').addEventListener('click', ()=>{
    let correct = 0;
    const subjectTally = {};
    questions.forEach((q,qi)=>{
      const block = c.querySelector('.qblock[data-qi="'+qi+'"]');
      const opts = block.querySelectorAll('.opt');
      opts.forEach((optEl,oi)=>{
        optEl.classList.add('disabled');
        if(oi===q.answer) optEl.classList.add('correct');
        else if(oi===answers[qi]) optEl.classList.add('wrong');
      });
      const exp = block.querySelector('.qexp');
      if(exp) exp.classList.add('show');
      if(answers[qi]===q.answer) correct++;
      if(!subjectTally[q.subject]) subjectTally[q.subject]={correct:0,total:0};
      subjectTally[q.subject].total++;
      if(answers[qi]===q.answer) subjectTally[q.subject].correct++;
    });
    clearInterval(timerInterval);
    const elapsedSeconds = Math.floor((Date.now()-quizStart)/1000);
    document.getElementById('quizSubmitBtn').style.display='none';
    const doneBtn = document.createElement('button');
    doneBtn.className='btn btn-secondary';
    doneBtn.textContent='Bitir ve Kaydet';
    doneBtn.style.marginTop='16px';
    c.appendChild(doneBtn);
    doneBtn.addEventListener('click', ()=> onFinish(correct, questions.length, subjectTally, elapsedSeconds));
    c.scrollIntoView({behavior:'smooth', block:'start'});
  });
}

          '<li><span class="ck">✓</span> Sınav merkezine erken çıkmayı planla, saat 10.00’dan sonra binaya alınmıyorsun.</li>'+
          '<li><span class="ck">✓</span> Kurşun kalem, silgi, kalemtıraş yanında olsun.</li>'+
          '<li><span class="ck">✓</span> Zorlandığın soruda takılma, işaretleyip geç; sonda dön.</li>'+
          '<li><span class="ck">✓</span> Optik formu işaretlemeyi soru çözerken değil, düzenli aralıklarla yap.</li>'+
          '<li><span class="ck">✓</span> Bu gece erken yat — son gece çalışmak yerine dinlenmek daha fazla puan getirir.</li>'+

function startDaySession(day, plan, body){
  let questions;
  if(plan.type==='lesson') questions = questionsFromTopics([plan.topicId]);
  else if(plan.type==='review') questions = questionsFromTopics(plan.topicIds, 8);
  else if(plan.type==='deneme') questions = questionsFromTopics(plan.topicIds, 20);
  body.innerHTML = '<div id="quizArea"></div>';
  renderQuizList(questions, 'quizArea', (correct, total, subjectTally, elapsedSeconds)=>{
    recordResult(day, correct, total, subjectTally, elapsedSeconds);
    renderScoreScreen(body, day, correct, total, elapsedSeconds);
    renderTopBar();
  });
}

function renderWeakestTip(container){
  const entries = Object.keys(PROGRESS.bySubject)
    .filter(sid=> PROGRESS.bySubject[sid].total >= 6)
    .map(sid=>({ sid, acc: PROGRESS.bySubject[sid].correct/PROGRESS.bySubject[sid].total }));
  if(!entries.length) return;
  entries.sort((a,b)=>a.acc-b.acc);
  const weakest = entries[0];
  const el = document.createElement('div');
  el.className='card';
  el.innerHTML = '<div class="kicker">SON DAKİKA ODAK</div><p>En düşük başarı oranın <b>'+esc(subjectOf(weakest.sid).name)+'</b> konusunda (%'+Math.round(weakest.acc*100)+'). Sınav öncesi son taramanı bu dersten yap.</p>';
  container.appendChild(el);
}

    '<p>40 gün; Türkçe ve Matematik en yüksek soru ağırlığına sahip olduğu için en sık, Tarih-Coğrafya-Vatandaşlık dengeli aralıklarla programa yerleştirildi. Konu sayısı arttıkça tekrar günleri arasındaki aralık kendini otomatik ayarlar; 39. gün genel deneme, 40. gün dinlenme ve strateji günüdür.</p></div>'+
    '<div class="card"><h3>Sınav</h3><p>2026-KPSS Ortaöğretim — 25 Ekim 2026 Pazar, 10.15</p></div>'+
    '<button class="btn btn-secondary" id="resetBtn">Rotayı Sıfırla</button>'+
    '<p style="color:var(--text-muted);font-size:11.5px;text-align:center;margin-top:24px;">Rota40 — tüm verilerin sadece bu cihazda saklanır.</p>';
  document.getElementById('resetBtn').addEventListener('click', ()=>{
    if(confirm('Tüm ilerlemen ve plan sıfırlanacak. Emin misin?')){
      localStorage.removeItem(LS_PLAN);
      localStorage.removeItem(LS_START);
      localStorage.removeItem(LS_PROGRESS);
      location.reload();
    }
  });
}

/* ---------- Sekme geçişi ---------- */
function switchTab(tab){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.navbtn').forEach(b=>b.classList.remove('active'));
  document.getElementById('screen-'+tab).classList.add('active');
  document.querySelector('.navbtn[data-tab="'+tab+'"]').classList.add('active');
  if(tab==='today') showDay(todayIndex());
  if(tab==='cal') renderCalendar();
  if(tab==='progress') renderProgress();
  if(tab==='settings') renderSettings();
}

document.querySelectorAll('.navbtn').forEach(btn=>{
  btn.addEventListener('click', ()=> switchTab(btn.getAttribute('data-tab')));
});

renderTopBar();
switchTab('today');
</script>
