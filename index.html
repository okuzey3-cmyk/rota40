<style>
:root{
  --bg:#14171C;
  --bg-elev:#1B1F26;
  --bg-elev-2:#20242C;
  --line:#2B303A;
  --text:#F2F1ED;
  --text-muted:#8B909B;
  --accent:#FF4D2E;
  --accent-ink:#1A0904;
  --success:#2EE6A6;
  --danger:#FF5C7A;
  --matematik:#2EE6A6;
  --turkce:#5B8CFF;
  --tarih:#F0C24B;
  --cografya:#2FC1D6;
  --vatandaslik:#C792EA;
  --radius:3px;
  --font-display:'Oswald',sans-serif;
  --font-body:'IBM Plex Sans',sans-serif;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#14171C; --bg-elev:#1B1F26; --bg-elev-2:#20242C; --text:#F2F1ED; --text-muted:#8B909B; --line:#2B303A;
  }
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  justify-content:center;
}
#app{
  width:100%;
  max-width:480px;
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  position:relative;
  border-left:1px solid var(--line);
  border-right:1px solid var(--line);
}
a{color:inherit;}
button{font-family:inherit;}

/* ---------- Top bar ---------- */
.topbar{
  position:sticky; top:0; z-index:20;
  background:var(--bg);
  border-bottom:1px solid var(--line);

.worked-card .kicker{color:var(--accent);}

 ],
 strategy:"Üslü ifadelerde tabanı eşitlemeye çalış; köklü ifadelerde kök içini asal çarpanlarına ayırıp tam kareleri dışarı çıkar.",
 worked:{q:"2³ × 2⁴ işlemini yapın.", steps:["Taban aynı (2) olduğu için üsler toplanır kuralı uygulanır: aᵐ×aⁿ=aᵐ⁺ⁿ.","3+4=7, yani sonuç 2⁷ olur.","2⁷ = 128.","Cevap: 128."]},
 questions:[
   {q:"2³ × 2⁴ işleminin sonucu kaçtır?", options:["128","64","2¹²","16"], answer:0, exp:"Taban aynı olduğunda üsler toplanır: 2³×2⁴=2⁷=128."},
   {q:"√48 ifadesinin en sade hâli nedir?", options:["4√3","2√12","16√3","6√2"], answer:0, exp:"48=16×3 olduğundan √48=√16×√3=4√3."},
   {q:"5⁻² ifadesinin değeri kaçtır?", options:["1/25","-25","25","-1/25"], answer:0, exp:"Negatif üs, sayının pozitif üssünün çarpmaya göre tersidir: 5⁻²=1/5²=1/25."},
   {q:"(3²)³ ifadesinin değeri kaçtır?", options:["729","81","243","512"], answer:0, exp:"Üssün üssü alınırken üsler çarpılır: (3²)³=3⁶=729."},
   {q:"√75 ifadesinin en sade hâli nedir?", options:["5√3","3√25","25√3","15√5"], answer:0, exp:"75=25×3 olduğundan √75=√25×√3=5√3."}
 ]},
{id:'mt4', subject:'matematik', title:'Çarpanlara Ayırma ve Özdeşlikler',
 analogy:"Çarpanlara ayırmak, bir ifadeyi Lego parçalarına ayırıp hangi parçalardan oluştuğunu görmektir.",
 lessonSteps:[
   {title:"1. Sıfırdan Başlayalım", body:"Çarpanlara ayırmak, bir toplama işlemini çarpma işlemine dönüştürmektir. 6+9 sayısına bak: hem 6 hem 9, 3’ün katıdır (6=3×2, 9=3×3). Bu yüzden 6+9 yerine 3×(2+3) yazabiliriz — ikisi de aynı sonucu verir (15) ama ikinci yazım ortak çarpanı (3) dışarı çıkarmış olur. Harfli ifadelerde de aynı mantık işler: 3x+3y = 3(x+y)."},
   {title:"2. Şimdi Genişletelim", body:"Bazı özel toplama-çıkarma kalıpları sürekli karşımıza çıktığı için bunları tanımak işini kolaylaştırır. En önemlisi “iki kare farkı”: a²-b² her zaman (a-b)(a+b) şeklinde çarpanlarına ayrılır. Basit bir sayıyla dene: 5²-3² = 25-9 = 16. Aynı zamanda (5-3)(5+3) = 2×8 = 16 — iki yoldan da aynı cevaba ulaşıyorsun, ama ikinci yol harfli ifadelerde çok işine yarayacak."},
   {title:"3. Son Bir Adım", body:"Bir diğer önemli kalıp “tam kare özdeşliği”: (a+b)² her zaman a²+2ab+b²’ye eşittir, çıkarma versiyonu (a-b)²=a²-2ab+b²’dir. Küçük bir sayıyla kontrol edip inan: (2+3)²=5²=25. Aynı zamanda 2²+2×2×3+3² = 4+12+9 = 25 — tutuyor. Sınavda bu kalıpları tanıyıp doğrudan uygulaman, uzun uzun açıp toplamandan çok daha hızlıdır."}
 ],
 strategy:"İfadede kare veya çarpım kalıbı ara; hangi özdeşliğe uyduğunu belirleyip doğrudan aç ya da çarpanlarına ayır.",
 worked:{q:"x²-49 ifadesini çarpanlarına ayırın.", steps:["49 = 7² olduğu için ifade a²-b² kalıbındadır (a=x, b=7).","İki kare farkı özdeşliği: a²-b²=(a-b)(a+b).","Yerine koyarsak: (x-7)(x+7).","Cevap: (x-7)(x+7)."]},
 questions:[
   {q:"x²-49 ifadesinin çarpanları nedir?", options:["(x-7)(x+7)","(x-49)(x+1)","(x-7)²","(x+7)²"], answer:0, exp:"İki kare farkı özdeşliği: a²-b²=(a-b)(a+b), burada 49=7²."},
   {q:"(x+3)² ifadesinin açılımı nedir?", options:["x²+6x+9","x²+9","x²+3x+9","x²+6x+6"], answer:0, exp:"Tam kare özdeşliği: (a+b)²=a²+2ab+b² → x²+6x+9."},
   {q:"12x+18y ifadesinin en sade (ortak çarpanı en büyük) parantez hâli nedir?", options:["6(2x+3y)","3(4x+6y)","2(6x+9y)","6(2x+18y)"], answer:0, exp:"12 ve 18’in EBOB’u 6 olduğundan en sade biçim 6(2x+3y)’dir."},
   {q:"a²-2ab+b² ifadesi hangi özdeşliğin açılımıdır?", options:["(a-b)²","(a+b)²","a²-b²","(a-b)(a+b)"], answer:0, exp:"Tam kare özdeşliği: (a-b)²=a²-2ab+b²."},
   {q:"x²+10x+25 ifadesinin çarpanlarına ayrılmış hâli nedir?", options:["(x+5)²","(x+5)(x-5)","(x+10)(x+2,5)","(x-5)²"], answer:0, exp:"Tam kare özdeşliği: a²+2ab+b²=(a+b)², burada a=x, b=5."}
 ]},
{id:'mt5', subject:'matematik', title:'Oran-Orantı',
 analogy:"Oran-orantı, bir tarif için pasta malzemelerini iki katına çıkarmak gibidir — oran sabit kaldığı sürece büyüklükler birlikte değişir.",
 lessonSteps:[
   {title:"1. Sıfırdan Başlayalım", body:"Oran, iki şeyi karşılaştırmanın bir yoludur. Bir sınıfta 10 kız 15 erkek öğrenci varsa, kız-erkek oranı 10:15’tir, sadeleştirirsek 2:3 olur — yani her 2 kıza karşılık 3 erkek var demektir. Oran, sayıların kendisinden çok birbirine göre büyüklüğünü gösterir."},
   {title:"2. Şimdi Genişletelim", body:"Doğru orantı, bir şey artınca diğerinin de aynı oranda arttığı durumdur. 1 ekmek 10 TL ise 3 ekmek 30 TL’dir — ekmek sayısı 3 katına çıktı, fiyat da 3 katına çıktı. Bunu bir formülle gösterirsek: a/b = c/d, yani iki oranın birbirine eşit olması. İç çarpım dış çarpım eşitliğiyle çözülür: a×d = b×c."},
   {title:"3. Son Bir Adım", body:"Ters orantı ise tam tersi: bir şey artınca diğeri AZALIR. Bir işi bitirmek için kaç işçi çalıştığını düşün — işçi sayısı artarsa işin bitme süresi azalır (iş aynı kalır ama daha çok el birlikte çalışır). Ters orantıda iki büyüklüğün çarpımı sabit kalır: a×b = c×d. 3 işçi bir işi 12 günde bitiriyorsa (3×12=36 birim iş), 6 işçi bu işi 6 günde bitirir (6×6=36, aynı iş miktarı, daha kısa sürede)."}
 ],
 strategy:"Önce doğru mu ters mi orantı olduğuna karar ver, sonra iç çarpım-dış çarpım eşitliğini kur.",
 worked:{q:"3 işçi bir işi 12 günde bitiriyorsa, 6 işçi kaç günde bitirir?", steps:["İşçi sayısı arttıkça süre azalır, bu yüzden ters orantı kurulur.","Ters orantıda çarpımlar eşitlenir: 3×12 = 6×x.","36 = 6x → x = 6.","Cevap: 6 gün."]},
 questions:[
   {q:"3 işçi bir işi 12 günde bitiriyorsa, 6 işçi aynı işi kaç günde bitirir?", options:["6","24","18","4"], answer:0, exp:"İşçi sayısı ile süre ters orantılıdır: 3×12=6×x → x=6 gün."},
   {q:"240 TL, 3:5 oranında iki kişi arasında paylaştırılıyor. Küçük pay kaç TL’dir?", options:["90","150","80","120"], answer:0, exp:"Oranlar toplamı 3+5=8, birim pay 240/8=30 TL; küçük pay 3×30=90 TL."},
   {q:"Bir haritada 2 cm, gerçekte 50 km’yi gösteriyorsa haritada 7 cm gerçekte kaç km’yi gösterir?", options:["175 km","150 km","200 km","100 km"], answer:0, exp:"Doğru orantı: 2/50=7/x → x=175 km."},
   {q:"Bir depoyu dolduran 4 musluktan her biri eşit debiyle akarsa depo 10 saatte doluyor. Aynı depoyu 2 musluk kaç saatte doldurur?", options:["20","5","8","40"], answer:0, exp:"Musluk sayısı ile süre ters orantılıdır: 4×10=2×x → x=20 saat."},
   {q:"Bir sınıftaki kız ve erkek öğrenci sayısı oranı 4:5’tir. Sınıfta toplam 36 öğrenci varsa kız öğrenci sayısı kaçtır?", options:["16","20","18","14"], answer:0, exp:"Oranlar toplamı 4+5=9, birim pay 36/9=4; kız öğrenci sayısı 4×4=16."}
 ]},
{id:'mt6', subject:'matematik', title:'Problemler: Sayı, Yaş ve Kesir',
 analogy:"Yaş ve sayı problemleri bir hikâyeyi denklemle anlatmak gibidir; cümledeki her ilişkiyi bir harfle (x) ifade edip denklem kurarsın.",
 lessonSteps:[
   {title:"1. Sıfırdan Başlayalım", body:"Bu tip sorularda amaç, günlük dilde anlatılan bir durumu matematik diline (denkleme) çevirmektir. Bilinmeyen sayıya bir harf verelim, genelde x kullanılır. “Bir sayının 5 fazlası 12’dir” cümlesini düşün: bilinmeyen sayı x, “5 fazlası” demek x+5, “dir” demek eşittir. Yani cümle x+5=12 denklemine dönüşür. Bunu çözersek x=7 bulunur."},
   {title:"2. Şimdi Genişletelim", body:"Ardışık sayı problemlerinde sayılar birbirini takip eder. Ardışık tam sayılar (1,2,3 gibi) x, x+1, x+2 şeklinde yazılır. Ardışık ÇİFT sayılar (2,4,6 gibi) ise aralarında 2 fark olduğu için x, x+2, x+4 şeklinde yazılır. Basit bir örnekle dene: iki ardışık çift sayı 4 ve 6 ise, bunları x=4 ve x+2=6 olarak da yazabilirsin — aynı şey."},
   {title:"3. Son Bir Adım", body:"Yaş problemlerinde en önemli kural şu: zaman ilerledikçe HERKESİN yaşı aynı miktarda artar. Baba bugün 40, oğlu 10 yaşında olsun. 5 yıl sonra baba 45, oğlu 15 olur — ikisine de aynı 5 eklendi. Sınav sorularında genelde “kaç yıl sonra babanın yaşı oğlunun yaşının katı olur” gibi sorulur; bunun için her iki yaşa da aynı bilinmeyeni (t) ekleyip denklem kurarsın: 40+t = 3×(10+t)."}
 ],
 strategy:"Bilinmeyeni x koy, cümledeki her ilişkiyi ayrı bir denklem parçasına çevir, sonra çöz.",
 worked:{q:"İki ardışık çift sayının toplamı 46 ise büyük sayı kaçtır?", steps:["Küçük sayıyı x, büyük sayıyı x+2 olarak yazarız (ardışık çift sayılar 2 farklıdır).","Denklemi kurarız: x + (x+2) = 46.","2x + 2 = 46 → 2x = 44 → x = 22.","Cevap: Büyük sayı x+2 = 24."]},
 questions:[
   {q:"İki ardışık çift sayının toplamı 46 ise büyük sayı kaçtır?", options:["24","22","26","23"], answer:0, exp:"x ve x+2 ardışık çift sayılardır: x+(x+2)=46 → x=22, büyük sayı 24."},
   {q:"Bir baba bugün 40, oğlu 10 yaşındadır. Kaç yıl sonra babanın yaşı oğlunun yaşının 3 katı olur?", options:["5","4","6","10"], answer:0, exp:"40+t=3(10+t) denklemi çözülünce t=5 yıl bulunur."},
   {q:"Bir sayının 2/5’i 30 ise bu sayı kaçtır?", options:["75","60","50","90"], answer:0, exp:"(2/5)x=30 → x=75."},
   {q:"Üç ardışık tam sayının toplamı 84 ise en büyük sayı kaçtır?", options:["29","28","27","30"], answer:0, exp:"Ardışık üç sayı x-1, x, x+1 ile gösterilir: 3x=84 → x=28, en büyüğü 29."},
   {q:"Bir sayının 3 katının 7 fazlası 40 ise bu sayı kaçtır?", options:["11","10","33","13"], answer:0, exp:"3x+7=40 → 3x=33 → x=11."}
 ]},
{id:'mt7', subject:'matematik', title:'Problemler: Hareket, İşçi-Havuz, Yüzde-Kâr/Zarar',
 analogy:"Hareket problemleri bir yol filmi gibidir: Yol=Hız×Zaman formülü sahne sahne ilerler. Yüzde problemleri ise indirim etiketlerini okumaktır.",
 lessonSteps:[
   {title:"1. Sıfırdan Başlayalım", body:"Hareket problemlerinin temeli çok basit bir formüldür: Yol = Hız × Zaman. Saatte 60 km giden bir araç 2 saatte ne kadar yol alır? 60×2=120 km. Bu formülü aklında tut, hareket sorularının hepsi bunun bir varyasyonudur."},
   {title:"2. Şimdi Genişletelim", body:"İki araç birbirine doğru (zıt yönde) hareket ediyorsa, aralarındaki mesafe İKİ aracın hızının toplamı kadar hızla kapanır — sanki tek bir hızlı araç varmış gibi düşünebilirsin. 100 km uzaklıktaki iki araçtan biri 30, diğeri 20 km/sa hızla birbirine yaklaşıyorsa, aralarındaki mesafe saatte 30+20=50 km kapanır, yani 2 saatte buluşurlar (100÷50=2)."},
   {title:"3. Son Bir Adım", body:"Yüzde demek, “100’de kaç tane” demektir — %25 demek 100’de 25, yani 1/4 demektir. Bir üründe %25 indirim varsa, fiyatın 1/4’ü düşer. 800 TL’lik bir üründe %25 kâr edilmek isteniyorsa, önce kârı bulursun (800×0,25=200 TL), sonra alış fiyatına eklersin (800+200=1000 TL) — satış fiyatı budur."}
 ],
 strategy:"Hareket sorularında önce yönü (aynı/zıt) belirle; işçi-havuz sorularında “1 günlük iş” oranı üzerinden düşün.",
 worked:{q:"Aralarında 300 km olan iki şehirden karşılıklı yola çıkan iki araç 60 km/sa ve 40 km/sa hızla gidiyorsa kaç saat sonra karşılaşır?", steps:["Araçlar zıt yönde hareket ettiği için hızları toplanır: 60+40=100 km/sa.","Karşılaşma süresi = toplam mesafe ÷ toplam hız.","300 ÷ 100 = 3.","Cevap: 3 saat sonra karşılaşırlar."]},
 questions:[
   {q:"Aralarında 300 km olan iki şehirden aynı anda karşılıklı yola çıkan iki araç, biri 60 km/sa diğeri 40 km/sa hızla gidiyorsa kaç saat sonra karşılaşırlar?", options:["3","5","2","4"], answer:0, exp:"Zıt yönde hareket edenlerin hızları toplanır: 300/(60+40)=3 saat."},
   {q:"Bir işi Ali 6 günde, Veli 12 günde tek başına bitiriyor. Birlikte çalışırlarsa işi kaç günde bitirirler?", options:["4","3","9","18"], answer:0, exp:"Günlük iş oranları toplanır: 1/6+1/12=3/12=1/4 → iş 4 günde biter."},
   {q:"800 TL’ye alınan bir ürün %25 kârla satılırsa satış fiyatı kaç TL olur?", options:["1000","900","1050","1200"], answer:0, exp:"Kâr tutarı 800×0,25=200 TL; satış fiyatı 800+200=1000 TL."},
   {q:"120 km yolu 2 saatte alan bir aracın ortalama hızı kaç km/sa’dir?", options:["60","50","70","80"], answer:0, exp:"Hız=Yol/Zaman=120/2=60 km/sa."},
   {q:"1200 TL’ye alınan bir ürün %10 zararla satılırsa satış fiyatı kaç TL olur?", options:["1080","1100","1320","1000"], answer:0, exp:"Zarar tutarı 1200×0,10=120 TL; satış fiyatı 1200-120=1080 TL."}
 ]},
{id:'mt8', subject:'matematik', title:'Geometri: Temel Kavramlar ve Üçgenler',
 analogy:"Üçgenler geometri sorularının iskeletidir — üç kenar, bir masa ayağı gibi açılarla birbirine bağlanır.",
 lessonSteps:[
   {title:"1. Sıfırdan Başlayalım", body:"Bir üçgenin üç iç açısını topladığında sonuç HER ZAMAN 180 derecedir — üçgenin şekli, büyüklüğü ne olursa olsun bu hiç değişmez. Yani iki açıyı biliyorsan, üçüncüsünü 180’den çıkararak direkt bulabilirsin: açılar 60° ve 70° ise, üçüncüsü 180-60-70=50°’dir."},
   {title:"2. Şimdi Genişletelim", body:"İkizkenar üçgen, iki kenarı birbirine eşit olan üçgendir — ve bu eşit kenarların karşısındaki açılar da birbirine eşittir (buna taban açıları denir). Tepe açısı 40° olan ikizkenar bir üçgende, geriye kalan 140° (180-40), iki eşit taban açısına paylaştırılır: 140÷2=70° her biri."},
   {title:"3. Son Bir Adım", body:"Dik üçgende (bir açısı tam 90° olan üçgen) özel bir kural vardır: Pisagor bağıntısı. İki dik kenarın karelerinin toplamı, en uzun kenarın (hipotenüs) karesine eşittir: a²+b²=c². Dik kenarları 3 ve 4 olan bir üçgende hipotenüs kaçtır? 3²+4²=9+16=25, √25=5. Bu 3-4-5 üçlüsü çok sık çıkar, ezberlemen işine yarar."}
 ],
 strategy:"Şekilli sorularda önce bilinen açı/kenarları işaretle, sonra iç açılar toplamı ya da Pisagor bağıntısıyla eksik değeri bul.",
 worked:{q:"Bir üçgenin iç açılarından ikisi 50° ve 70° ise üçüncü açı kaç derecedir?", steps:["Bir üçgenin iç açıları toplamı her zaman 180°’dir.","Bilinen iki açı toplanır: 50+70=120°.","Üçüncü açı = 180 - 120.","Cevap: 60°."]},
 questions:[
   {q:"Bir üçgenin iç açılarından ikisi 50° ve 70° ise üçüncü açı kaç derecedir?", options:["60°","50°","70°","65°"], answer:0, exp:"İç açılar toplamı 180°’dir: 180-(50+70)=60°."},
   {q:"Dik kenarları 6 cm ve 8 cm olan dik üçgenin hipotenüsü kaç cm’dir?", options:["10","14","7","12"], answer:0, exp:"Pisagor bağıntısı: 6²+8²=36+64=100, hipotenüs=√100=10 cm."},
   {q:"İkizkenar bir üçgende tepe açısı 40° ise taban açılarından biri kaç derecedir?", options:["70°","80°","60°","50°"], answer:0, exp:"Taban açıları eşittir: (180-40)/2=70°."},
   {q:"Bir üçgenin dış açılarından biri 110° ise bu dış açıya komşu olmayan iki iç açının toplamı kaç derecedir?", options:["110°","70°","55°","220°"], answer:0, exp:"Bir dış açı, kendisine komşu olmayan iki iç açının toplamına eşittir."},
   {q:"Kenar uzunlukları 5 cm, 5 cm ve 6 cm olan üçgen ne tür bir üçgendir?", options:["İkizkenar üçgen","Eşkenar üçgen","Çeşitkenar üçgen","Dik üçgen"], answer:0, exp:"İki kenarı eşit (5 cm, 5 cm) olduğu için ikizkenar üçgendir."}
 ]},
{id:'mt9', subject:'matematik', title:'Permütasyon, Kombinasyon ve Olasılık',
 analogy:"Permütasyon ve kombinasyon, bir grubu farklı şekillerde sıraya dizmenin ya da aralarından seçim yapmanın kaç yolu olduğunu sayan bir yöntemdir; olasılık ise bir olayın gerçekleşme şansını ölçer.",
 lessonSteps:[
   {title:"1. Sıfırdan Başlayalım", body:"Permütasyon ve kombinasyonun ortak noktası, “kaç farklı şekilde olabilir” sorusuna cevap aramalarıdır. Aralarındaki fark şu: SIRALAMA önemli mi değil mi? 3 kişiyi (Ali, Veli, Ayşe) bir sıraya dizmek istiyorsan (kim önce, kim sonra) sıralama önemlidir — bu permütasyon. Ama bu 3 kişiden sadece 2’sini bir komiteye seçmek istiyorsan (kim başkan kim üye ayrımı yok), sıralama önemsizdir — bu kombinasyon."},
   {title:"2. Şimdi Genişletelim", body:"n tane farklı nesneyi yan yana dizmenin kaç farklı yolu vardır? Cevap n! (n faktöriyel) — yani n’den 1’e kadar bütün sayıların çarpımı. 3 kişiyi sıraya dizmenin yolu 3!=3×2×1=6’dır. Elle de sayabilirsin: Ali-Veli-Ayşe, Ali-Ayşe-Veli, Veli-Ali-Ayşe, Veli-Ayşe-Ali, Ayşe-Ali-Veli, Ayşe-Veli-Ali — tam 6 farklı sıralama."},
   {title:"3. Son Bir Adım", body:"Olasılık, bir şeyin gerçekleşme şansını sayıyla ifade eder ve formülü çok basittir: istenen durum sayısı bölü mümkün tüm durum sayısı. Bir zar attığında 6 gelme olasılığı nedir? Mümkün durumlar 6 tane (1,2,3,4,5,6), istenen durum sadece 1 tane (6 gelmesi) — olasılık 1/6’dır. Aynı zarda çift sayı gelme olasılığı ise istenen durumlar 3 tane olduğu için (2,4,6) 3/6=1/2’dir."}
 ],
 strategy:"Soruda sıralamanın (kimin önce, hangi görevde) önemli olup olmadığına bak: önemliyse permütasyon, önemsizse kombinasyon kullan.",
 worked:{q:"5 farklı kitap bir rafa yan yana kaç farklı şekilde dizilebilir?", steps:["Sıralamanın önemli olduğu, n farklı nesnenin dizilişi problemi bu.","n farklı nesnenin dizilişi n! (n faktöriyel) ile bulunur.","5! = 5×4×3×2×1 = 120.","Cevap: 120."]},
 questions:[
   {q:"5 farklı kitap bir rafa yan yana kaç farklı şekilde dizilebilir?", options:["120","20","25","60"], answer:0, exp:"5 farklı nesnenin sıralanışı 5!=120’dir."},
   {q:"8 kişilik bir gruptan başkan ve yardımcısı (2 farklı görev) kaç farklı şekilde seçilebilir?", options:["56","28","64","16"], answer:0, exp:"Görevler farklı olduğu için sıralama önemlidir: 8P2=8×7=56."},
   {q:"10 kişilik bir gruptan 3 kişilik bir komite (görev ayrımı yok) kaç farklı şekilde seçilebilir?", options:["120","720","30","1000"], answer:0, exp:"Komite üyeleri arasında görev farkı olmadığı için sıralama önemsizdir: 10C3=10!/(3!×7!)=120."},
   {q:"Bir zar bir kez atıldığında üste 4’ten büyük bir sayı gelme olasılığı kaçtır?", options:["1/3","1/2","2/3","1/6"], answer:0, exp:"Mümkün 6 durumdan 2 tanesi (5,6) istenen durumdur: 2/6=1/3."},
   {q:"Bir torbada 4 kırmızı, 6 mavi top vardır. Rastgele çekilen bir topun kırmızı olma olasılığı kaçtır?", options:["2/5","3/5","1/4","4/6"], answer:0, exp:"Toplam top sayısı 10, kırmızı top sayısı 4: 4/10=2/5."}
 ]},

{id:'tr1', subject:'turkce', title:'Ses Bilgisi',
 analogy:"Türkçedeki ünlüler bir orkestra gibi çalışır: kalın sesler (a,ı,o,u) ile ince sesler (e,i,ö,ü) bir kelime içinde karışmaz.",
 lessonSteps:[
   {title:"1. Sıfırdan Başlayalım", body:"Türkçedeki sesli harfleri (ünlüleri) iki gruba ayırabiliriz: kalın ünlüler (a, ı, o, u) ve ince ünlüler (e, i, ö, ü). Bunu ağzının nasıl açıldığına bakarak da hissedebilirsin — “a” derken ağzın daha geniş açılır, “e” derken daha öndedir. Bu ayrım, Türkçenin ses uyumu kurallarının temelidir."},
   {title:"2. Şimdi Genişletelim", body:"Büyük ünlü uyumu şunu söyler: bir kelimenin ilk hecesi kalınsa, ondan sonraki bütün heceler de kalın ünlü taşır; ilk hece inceyse sonrakiler de ince olur. Türkçe kökenli “ev-ler-imiz-de” kelimesine bakarsak: e,e,i,e hepsi ince, uyum var. Ama “kalem” gibi yabancı kökenli bazı kelimeler (a kalın, e ince) bu kurala aykırıdır — bunlar istisnadır."},
   {title:"3. Son Bir Adım", body:"İki ses olayı daha var, ikisi de ünlüyle başlayan ek geldiğinde ortaya çıkar. Kaynaştırma: ünlüyle BİTEN bir kelimeye ünlüyle başlayan bir ek gelirse, iki ünlünün yan yana gelmemesi için araya “y, ş, s, n” harflerinden biri girer — “araba” ünlüyle bittiği için “araba-s-ı” olur (araya “s” girdi). Ünsüz yumuşaması ise “p, ç, t, k” ile biten kelimeler için geçerlidir — bu son harfler ünlüyle başlayan ek aldığında yumuşar (p→b, ç→c, t→d, k→ğ): “kitap” + “-ı” = “kitab-ı”."}
 ],
 strategy:"Kelimeyi hecelere ayırıp ünlüleri tek tek kontrol et; yabancı kökenli bazı kelimeler (kalem gibi) kurala aykırı istisnadır.",
 worked:{q:"Aşağıdakilerden hangisi büyük ünlü uyumuna aykırıdır: kitaplık, radyo, hediye, kalemlik?", steps:["Her kelimenin ünlülerini tek tek kalın (a,ı,o,u) / ince (e,i,ö,ü) olarak işaretle.","kitaplık: ı,ı kalın-kalın uyumlu. radyo: a,o kalın-kalın uyumlu. hediye: e,i,e ince-ince-ince uyumlu.","kalemlik: a(kalın)-e(ince)-i(ince) karışık — “kalem” kökü zaten yabancı kökenli bir istisnadır.","Cevap: kalemlik, büyük ünlü uyumuna aykırıdır."]},
 questions:[
   {q:"Aşağıdakilerden hangisi büyük ünlü uyumuna aykırıdır?", options:["kitaplık","radyo","hediye","kalemlik"], answer:3, exp:"“Kalem” Arapça kökenlidir ve tek başına büyük ünlü uyumuna aykırıdır (a kalın, e ince); aldığı ekler kurala uysa da kelime bütünüyle aykırı sayılır."},
   {q:"“Arabasını çok sever.” cümlesinde “araba” sözcüğüne getirilen iyelik ekinde hangi kaynaştırma harfi kullanılmıştır?", options:["y","ş","s","n"], answer:2, exp:"“Araba” ünlüyle bitiyor, iyelik eki “-ı” ünlüyle başladığı için araya kaynaştırma harfi “s” girer: araba-s-ı."},
   {q:"“Kitap” sözcüğüne ünlüyle başlayan bir ek getirildiğinde sondaki “p” sesinde nasıl bir değişiklik olur?", options:["p, ç’ye dönüşür","p, b’ye dönüşür","değişmez","p, f’ye dönüşür"], answer:1, exp:"Sert ünsüzle biten kelimeler ünlüyle başlayan ek aldığında yumuşar: kitap-ı değil kitab-ı."},
   {q:"Küçük ünlü uyumuna göre, bir hecede düz ünlü (a, e, ı, i) varsa sonraki hecede hangi tür ünlü gelemez?", options:["Yuvarlak ünlü (o, ö, u, ü)","Düz ünlü (a, e, ı, i)","Kalın ünlü","İnce ünlü"], answer:0, exp:"Küçük ünlü uyumunda bir hecedeki düz ünlüden sonra yuvarlak ünlü gelmez."},
   {q:"“Kitap” sözcüğüne “-cı” meslek eki getirildiğinde neden “kitapçı” biçiminde yazılır (c, ç’ye dönüşür)?", options:["Sert ünsüzden (p) sonra yumuşak ünsüz (c) sertleşerek ç’ye dönüşür (ünsüz benzeşmesi)","Büyük ünlü uyumu gereği","Kaynaştırma harfi kullanıldığı için","Ünlü daralması olduğu için"], answer:0, exp:"Ünsüz benzeşmesi (sertleşme) kuralına göre sert ünsüzle biten kelimelere c,d,g ile başlayan ek gelirse bu sesler sertleşerek ç,t,k’ye dönüşür: kitap+cı → kitapçı."}
 ]},
{id:'tr2', subject:'turkce', title:'Yapı Bilgisi (Ekler)',
 analogy:"Ekler, bir kelimeye takılan lego parçaları gibidir; yapım ekleri kelimenin türünü değiştirir, çekim ekleri sadece cümledeki görevini belirtir.",
 lessonSteps:[
   {title:"1. Sıfırdan Başlayalım", body:"Türkçede kelimeler genelde bir kök (asıl anlamı taşıyan kısım) ve bu köke eklenen eklerden oluşur. “Göz” kelimesi tek başına bir köktür. Ona “-lük” ekini eklersek “gözlük” oluşur — yepyeni bir kelime, yepyeni bir anlam (bir eşya adı) ortaya çıktı."},
   {title:"2. Şimdi Genişletelim", body:"Ekleri iki gruba ayırabiliriz. Yapım ekleri, kelimenin anlamını veya türünü tamamen değiştirir, sanki yeni bir kelime doğurur: “göz” (organ) + “lük” = “gözlük” (eşya). Çekim ekleri ise kelimenin temel anlamını değiştirmez, sadece cümledeki görevini belirtir: “göz-ler” (çoğul yaptı ama hâlâ göz demek), “göz-e” (yöneldiği yeri gösterdi ama hâlâ göz demek)."},
   {title:"3. Son Bir Adım", body:"Bunu ayırt etmenin kolay yolu şu: eki çıkardığında hâlâ aynı “tür”den bir kelime mi kalıyor, yoksa tamamen farklı bir kelimeye mi dönüşüyor? “Oku-ma” kelimesine bak: “oku-” bir eylemdir (fiil), ama “-ma” eklenince “okuma” bir isim oldu (okumayı seviyorum). Tür değişti, demek ki bu yapım ekiydi. Ama “oku-yor” da hâlâ bir eylem, sadece zaman bilgisi eklendi — bu da çekim ekiydi."}
 ],
 strategy:"“Yeni bir kelime mi oluştu yoksa sadece görev mi değişti” diye sor — yeni kelime oluştuysa yapım eki, sadece görev değiştiyse çekim ekidir.",
 worked:{q:"“Göz-lük-çü-lük” kelimesinde kaç tane yapım eki vardır?", steps:["Kelimeyi köküne ve eklerine ayır: göz + lük + çü + lük.","Her ekin yeni bir kelime/tür oluşturup oluşturmadığına bak.","+lük (eşya), +çü (meslek), +lük (meslek alanı) — üçü de yeni anlam/tür kattığı için yapım ekidir.","Cevap: 3 yapım eki vardır."]},
 questions:[
   {q:"“Göz-lük-çü-lük” kelimesinde kaç tane yapım eki vardır?", options:["3","2","1","4"], answer:0, exp:"göz+lük, +çü, +lük eklerinin üçü de yeni kelime/tür oluşturduğu için yapım ekidir."},
   {q:"Aşağıdaki eklerden hangisi bir çekim ekidir?", options:["Çoğul eki (-ler/-lar)","Meslek adı yapan “-çı/-ci”","Küçültme eki “-cik”","İsimden fiil yapan “-le”"], answer:0, exp:"Çoğul eki kelimenin türünü değiştirmez, sadece sayı bilgisi ekler; bu yüzden çekim ekidir."},
   {q:"“Oku-ma” kelimesinde “-ma” eki hangi tür ektir?", options:["Yapım eki (fiilden isim yapar)","Çekim eki (zaman eki)","Çekim eki (çoğul eki)","Yapım eki (isimden fiil yapar)"], answer:0, exp:"“-ma/-me” eki fiile eklenerek isim yapar (okuma, yazma); bu yüzden yapım ekidir."},
   {q:"“Sevgi-li” kelimesindeki “-li” eki hangi tür ektir?", options:["Yapım eki (isimden isim/sıfat yapar)","Çekim eki (hâl eki)","Çekim eki (iyelik eki)","Çekim eki (çoğul eki)"], answer:0, exp:"“-li” eki isme eklenerek yeni bir sıfat/isim oluşturur (sevgi→sevgili), bu yüzden yapım ekidir."},
   {q:"Aşağıdaki kelimelerden hangisinde bir zaman eki (çekim eki) vardır?", options:["Gel-di","Gel-mek","Gel-en","Gel-iş"], answer:0, exp:"“-di” görülen geçmiş zaman ekidir ve bir çekim ekidir; “-mek, -en, -iş” ekleri fiilden isim yapan yapım ekleridir."}
 ]},
{id:'tr3', subject:'turkce', title:'Sözcükte Anlam',
 analogy:"Kelimeler bazen tek anlamlı bir valizle, bazen çok gözlü bir çantayla gezer; bağlama göre hangi gözünü açtığını anlarsın.",
 lessonSteps:[
   {title:"1. Sıfırdan Başlayalım", body:"Bir kelimenin gerçek (temel) anlamı, o kelimeyi ilk duyduğunda aklına gelen, sözlükteki asıl anlamıdır. “Taş” dediğinde aklına yerden aldığın sert cisim gelir — bu gerçek anlamdır."},
   {title:"2. Şimdi Genişletelim", body:"Ama bazen kelimeleri gerçek anlamlarından uzaklaşıp başka bir şeyi anlatmak için kullanırız, buna mecaz anlam denir. “Bu adamın kalbi taş gibi” dediğinde, adamın göğsünde gerçekten taş olduğunu kastetmiyorsun — onun duygusuz, katı biri olduğunu anlatıyorsun. “Taş” burada gerçek anlamından çıkıp mecaz anlam kazandı."},
   {title:"3. Son Bir Adım", body:"İki kelime aynı şeyi anlatıyorsa “eş anlamlı” (güzel-hoş gibi), birbirinin tam karşıtını anlatıyorsa “zıt anlamlı” (karanlık-aydınlık gibi) denir — bunu anlamak için iki kelimeyi bir cümlede birbirinin yerine koyup anlamın aynı mı yoksa tam tersi mi olduğuna bakabilirsin. Deyimler ise birden fazla kelimenin bir araya gelip kalıplaşmış, genelde mecazlı yeni bir anlam kazanmasıdır. “Ağzı kulaklarına varmak” dediğinde, kimsenin ağzının gerçekten kulağına kadar uzadığını düşünmezsin — bu “çok sevinmek” demektir. Deyimleri kalıp olarak ezberlemek en pratik yoldur."}
 ],
 strategy:"Cümledeki kelimenin somut/nesnel bir durumu mu yoksa soyutlaşmış bir durumu mu anlattığına bak.",
 worked:{q:"“Bu haberi duyunca yüreği dağlandı.” cümlesindeki altı çizili söz hangi anlamda kullanılmıştır?", steps:["Sözün gerçek/somut bir olayı mı, yoksa soyut bir duyguyu mu anlattığına bak.","“Yürek dağlanmak” gerçekte bir yanma/dağlanma değildir.","Bu ifade üzüntü, acı duyma durumunu anlatan kalıplaşmış bir söz (deyim)dir.","Cevap: Mecaz anlamda kullanılmıştır."]},
 questions:[
   {q:"“Bu haberi duyunca yüreği dağlandı.” cümlesindeki altı çizili söz için ne söylenebilir?", options:["Mecaz anlamda kullanılmıştır","Gerçek anlamda kullanılmıştır","Terim anlamda kullanılmıştır","Yan anlamda kullanılmıştır"], answer:0, exp:"“Yürek dağlanmak” gerçek bir yanma değil, üzüntü duymayı ifade eden mecazlı bir deyimdir."},
   {q:"Aşağıdaki kelime çiftlerinden hangisi zıt (karşıt) anlamlıdır?", options:["Karanlık - Aydınlık","Güzel - Hoş","Akıllı - Zeki","Ev - Konut"], answer:0, exp:"Diğer çiftler eş/yakın anlamlıyken karanlık-aydınlık birbirinin karşıtıdır."},
   {q:"“Ağzı kulaklarına varmak” deyiminin anlamı nedir?", options:["Çok sevinmek","Çok üzülmek","Çok konuşmak","Çok şaşırmak"], answer:0},
   {q:"“Bardağın suyu taştı.” cümlesindeki “su” sözcüğü hangi anlamda kullanılmıştır?", options:["Gerçek anlamda","Mecaz anlamda","Terim anlamda","Yan anlamda"], answer:0},
   {q:"“Eli açık” deyiminin anlamı nedir?", options:["Cömert","Cimri","Çalışkan","Tembel"], answer:0}
 ]},
{id:'tr4', subject:'turkce', title:'Cümlede Anlam',
 analogy:"Bir cümle, bir haber sunucusu (nesnel: sadece olguyu aktarır) ya da bir yorumcu (öznel: kendi görüşünü katar) gibi konuşabilir.",
 lessonSteps:[
   {title:"1. Sıfırdan Başlayalım", body:"Bir cümlenin nesnel mi öznel mi olduğunu ayırt etmek için şu soruyu sor: bu bilgiyi herkes aynı şekilde doğrulayabilir mi, yoksa bu sadece birinin kişisel görüşü mü? “Bu masa 1 metre uzunluğundadır” — bunu ölçüp herkes doğrulayabilir, bu nesnel bir bilgidir."},
   {title:"2. Şimdi Genişletelim", body:"“Bu masa çok güzel” cümlesine bak — güzellik ölçülebilen bir şey değil, kişiden kişiye değişir. Biri güzel bulur, biri bulmaz. Bu tür, kişinin kendi görüşünü yansıtan cümlelere öznel (subjektif) denir. Bir cümlede “bence, göre, en, bana kalırsa” gibi kelimeler görürsen, büyük ihtimalle öznel bir yargıyla karşı karşıyasındır."},
   {title:"3. Son Bir Adım", body:"Cümleler arasında farklı mantık ilişkileri de olabilir. “Yağmur yağdığı için maç ertelendi” cümlesinde, yağmur SEBEP, maçın ertelenmesi SONUÇ’tur — buna neden-sonuç ilişkisi denir. “Eğer erken kalkarsan, treni yakalarsın” cümlesinde ise erken kalkmak bir ŞART’tır — buna koşul (şart) ilişkisi denir. “Bu elbise şu elbiseden daha güzel” cümlesinde ise iki şey kıyaslanıyor — buna karşılaştırma denir. Bu üçünü ayırt etmenin yolu: sebep-sonuç mu, “eğer... ise” gibi bir şart mı, yoksa iki şeyin kıyaslanması mı, ona bakmak."}
 ],
 strategy:"Cümlede “bence, göre, en güzel, bana kalırsa” gibi ifadeler varsa öznel; sayı, tarih, somut olgu varsa nesneldir.",
 worked:{q:"“Roman, 300 sayfadan oluşmaktadır.” cümlesi için ne söylenebilir?", steps:["Cümlede kişisel bir görüş mü yoksa ölçülebilir bir bilgi mi var, ona bak.","Sayfa sayısı kişiden kişiye değişmeyen, kontrol edilebilir bir bilgidir.","Bu tür bilgiler nesnel (objektif) yargı olarak adlandırılır.","Cevap: Nesnel bir yargıdır."]},
 questions:[
   {q:"“Roman, 300 sayfadan oluşmaktadır.” cümlesi için ne söylenebilir?", options:["Nesnel bir yargıdır","Öznel bir yargıdır","Hem nesnel hem öznel bir yargıdır","Varsayıma dayalı bir yargıdır"], answer:0},
   {q:"“Bence bu romanın en etkileyici yanı sonundaki sürpriz bitiştir.” cümlesi için ne söylenebilir?", options:["Öznel bir yargıdır","Nesnel bir yargıdır","Kanıtlanabilir bir yargıdır","Sayısal veri içeren bir yargıdır"], answer:0},
   {q:"“Yağmur yağdığı için maç ertelendi.” cümlesinde hangi anlam ilişkisi vardır?", options:["Neden-sonuç","Amaç-sonuç","Karşılaştırma","Koşul"], answer:0},
   {q:"“Eğer erken kalkarsan trene yetişirsin.” cümlesinde hangi anlam ilişkisi vardır?", options:["Koşul (şart)","Neden-sonuç","Amaç-sonuç","Karşılaştırma"], answer:0},
   {q:"“Bu elbise şu elbiseden daha güzel.” cümlesinde hangi anlam ilişkisi vardır?", options:["Karşılaştırma","Koşul","Neden-sonuç","Amaç-sonuç"], answer:0}
 ]},
{id:'tr5', subject:'turkce', title:'Paragraf',
 analogy:"Bir paragraf, bir ana yolun etrafında ilerleyen yan sokaklar gibidir — ana düşünce, tüm cümlelerin birleştiği yerdir.",
 lessonSteps:[
   {title:"1. Sıfırdan Başlayalım", body:"Bir paragraf, aslında birbirine bağlı birkaç cümleden oluşan küçük bir hikâyedir; ama bu hikâyenin anlatmak istediği TEK bir ana fikir vardır, geri kalan cümleler bu fikri desteklemek içindir. Kısa bir paragraf düşün: “Ali sabah erken kalktı. Kahvaltısını yaptı. Sonra okula gitti.” Bu üç cümlenin anlattığı ana fikir: Ali’nin sabah rutini."},
   {title:"2. Şimdi Genişletelim", body:"Konu ile ana düşünceyi karıştırma: konu, paragrafın NEDEN BAHSETTİĞİdir (örneğin “kahve”), ana düşünce ise yazarın bu konu HAKKINDA NE SÖYLEMEK İSTEDİĞİdir (örneğin “kahve, doğru miktarda tüketildiğinde faydalıdır”). Yani konu tek kelimelik bir başlık gibidir, ana düşünce ise tam bir cümle, bir iddiadır."},
   {title:"3. Son Bir Adım", body:"Sınavda en sık çıkan paragraf soru tipi “bu parçadan çıkarılabilecek en kapsamlı yargı nedir” sorusudur — burada aranan cevap, paragrafın TAMAMINI kapsayan, hiçbir detayı dışarıda bırakmayan seçenektir. Bir diğer sık çıkan tip “aşağıdakilerden hangisine değinilmemiştir” sorusudur — burada her seçeneği paragrafla tek tek karşılaştırıp, paragrafta hiç geçmeyen bilgiyi ararsın."}
 ],
 strategy:"Paragrafı hızlıca oku, ilk ve son cümlelere özellikle dikkat et, sonra soruyu tekrar okuyup parçaya dön.",
 worked:{q:"Bir paragrafta anlatılmak istenen temel fikre ne ad verilir?", steps:["Paragraftaki cümleleri ayır: bazıları örnek/açıklama (yardımcı düşünce), biri de bütünü özetleyen temel fikir.","Yardımcı düşünceler bu temel fikri destekler, tek başına paragrafın özünü vermez.","Paragrafın anlatmak istediği bu temel fikre “ana düşünce” denir.","Cevap: Ana düşünce."]},
 questions:[
   {q:"Bir paragrafta anlatılmak istenen temel fikre ne ad verilir?", options:["Ana düşünce","Yardımcı düşünce","Konu","Bakış açısı"], answer:0},
   {q:"Paragraf sorularında “Bu parçada aşağıdakilerden hangisine değinilmemiştir?” tarzı bir soruda nasıl bir strateji izlenmelidir?", options:["Şıklar parçayla tek tek karşılaştırılıp parçada geçmeyen bulunmalıdır","Sadece ilk cümleye bakılmalıdır","Paragrafın konusu tahmin edilip şıklara bakılmadan cevaplanmalıdır","Sadece son cümleye bakılmalıdır"], answer:0},
   {q:"“Konu” ile “ana düşünce” arasındaki temel fark nedir?", options:["Konu neyden bahsedildiğidir, ana düşünce yazarın bu konu hakkında söylemek istediğidir","Konu ve ana düşünce her zaman aynı şeydir","Ana düşünce paragrafın ilk cümlesidir, konu son cümlesidir","Konu sadece başlıkta bulunur"], answer:0},
   {q:"Bir paragrafın giriş cümlesi genellikle neyi tanıtır?", options:["Paragrafın konusunu","Yazarın kişisel bilgilerini","Paragrafın kaynakçasını","Yardımcı düşüncelerin sırasını"], answer:0},
   {q:"Paragraf tamamlama sorularında en önemli ölçüt nedir?", options:["Anlam ve anlatım akışının bozulmaması","Cümlenin en uzun şık olması","Şıkta özel isim geçmesi","Cümlenin soru cümlesi olması"], answer:0}
 ]},
{id:'tr6', subject:'turkce', title:'Yazım Kuralları ve Noktalama',
 analogy:"Yazım kuralları ve noktalama işaretleri, bir metnin trafik işaretleri gibidir — nerede duracağını, nerede vurgu yapacağını gösterir.",
 lessonSteps:[
   {title:"1. Sıfırdan Başlayalım", body:"“De/da” kelimesini doğru yazmanın en pratik yolu, onu cümleden çıkarıp denemektir. “Ali de geldi” cümlesinden “de”yi çıkar: “Ali geldi” — hâlâ anlamlı bir cümle. Anlam bozulmadığı için bu “de”, ayrı yazılan bir bağlaçtır."},
   {title:"2. Şimdi Genişletelim", body:"Şimdi farklı bir örneğe bak: “Bahçede oturuyordu.” Buradaki “de”yi çıkarmaya çalış: “Bahçe oturuyordu” — bu cümle anlamsız oldu! Çünkü bu “de”, bir bağlaç değil, kelimeye yapışık bir ek (bulunma hâli eki), yani “bahçe-de” bitişik yazılır. Aynı test “ki” için de geçerlidir: çıkarınca anlam bozuluyorsa bitişik, bozulmuyorsa ayrı yazılır."},
   {title:"3. Son Bir Adım", body:"Noktalama işaretlerinin her birinin bir görevi vardır. Virgül, sıralı kelimeleri veya cümlecikleri birbirinden ayırır (“elma, armut ve muz aldım”). İki nokta, bir açıklama yapılacağını haber verir (“sevdiği meyveler şunlardı: elma, armut, muz”). Tırnak işareti, birinin söylediği sözü olduğu gibi aktardığını gösterir, ve tırnak içindeki söz her zaman büyük harfle başlar."}
 ],
 strategy:"“de/da” ve “ki” sorularında kelimeyi cümleden çıkar; anlam bozulmuyorsa bağlaçtır (ayrı), bozuluyorsa ektir (bitişik).",
 worked:{q:"“Ali de sınava girecek.” cümlesindeki “de” neden ayrı yazılmıştır?", steps:["“de/da” bağlaç mı yoksa bulunma hâli eki mi, anlamak için kelimeyi cümleden çıkar.","“Ali sınava girecek” — cümle hâlâ anlamlı, anlam bozulmadı.","Anlam bozulmadığı için bu bir bağlaçtır, bağlaçlar her zaman ayrı yazılır.","Cevap: Bağlaç olduğu ve cümleden çıkarılabildiği için ayrı yazılır."]},
 questions:[
   {q:"“Ali de sınava girecek.” cümlesindeki “de” neden ayrı yazılmıştır?", options:["Bağlaç olduğu ve cümleden çıkarılabildiği için","Bulunma hâli eki olduğu için","Özel isimden sonra geldiği için","Cümlenin sonunda olduğu için"], answer:0, exp:"“de” çıkarılınca anlam bozulmaz (Ali sınava girecek), bu yüzden ayrı yazılır."},
   {q:"Açıklama yapılacağı zaman hangi noktalama işareti kullanılır?", options:["İki nokta (:)","Noktalı virgül (;)","Ünlem (!)","Kesme işareti (')"], answer:0},
   {q:"“Sabahki” kelimesinde “ki” neden bitişik yazılmıştır?", options:["İlgi eki olduğu için","Bağlaç olduğu için","Cümleden çıkarılabildiği için","Özel isim olduğu için"], answer:0},
   {q:"Sıralı cümleleri veya eş görevli sözcükleri birbirinden ayırmak için hangi noktalama işareti kullanılır?", options:["Virgül (,)","Nokta (.)","Ünlem (!)","Soru işareti (?)"], answer:0},
   {q:"“Öğretmenimiz, ‘Yarın sınav var.’ dedi.” cümlesinde tırnak içindeki ifade neden büyük harfle başlamıştır?", options:["Tırnak içinde aktarılan söz bir cümle olduğu ve cümleler büyük harfle başladığı için","Her tırnak içi ifade büyük harfle başlar kuralı olduğu için","Özel isim olduğu için","Yazım hatası, küçük harfle başlamalıydı"], answer:0}
 ]},

{id:'ta1', subject:'tarih', title:'İslamiyet Öncesi Türk Tarihi',
 analogy:"İlk Türk devletlerini bir aile soyağacı gibi düşün — her biri bir öncekinden gelen gelenekleri (kurultay, ordu-millet anlayışı) miras almıştır.",
 lessonSteps:[
   {title:"1. Sıfırdan Başlayalım", body:"Tarihte bilgi verdiğimiz ilk Türk devleti Asya Hun Devleti’dir — yani Türklerin devlet kurma geleneği çok eskiye, MÖ dönemlere kadar uzanır. Bu devletin en güçlü ve en bilinen hükümdarı Mete Han’dır, onun döneminde devlet çok geniş topraklara yayılmıştır."},
   {title:"2. Şimdi Genişletelim", body:"Eski Türklerde devlet yönetimi bugünkünden farklıydı: hükümdar tek başına karar vermezdi, “kurultay” denen bir meclis toplanır, devletin ileri gelenleri önemli kararları birlikte görüşürdü. Ayrıca eski Türkler, hükümdarlık yetkisinin Gök Tanrı tarafından verildiğine inanırlardı — bu inanışa “kut” denir."},
   {title:"3. Son Bir Adım", body:"Zamanla farklı Türk devletleri kuruldu, her biri ayrı bir “ilk”e sahip: Göktürkler, kendi alfabelerini kullanan ve Türk adını devlet adında resmen kullanan ilk devlettir — Orhun Yazıtları onlara aittir. Uygurlar ise göçebe hayatı bırakıp yerleşik hayata geçen, hatta matbaayı kullanan ilk Türk devletidir. Bu “ilk”leri birbirine karıştırmamak sınavda çok işine yarar."}
 ],
 strategy:"“İlk” ifadesi geçen sorularda hangi devletin hangi konuda öncü olduğunu eşleştir.",
 worked:{q:"Orhun Yazıtları hangi Türk devletine aittir?", steps:["Orhun Yazıtları’nın özelliğini hatırla: Türk adının geçtiği ilk yazılı belgedir.","Bu yazıtları hangi devletin diktiğini eşleştir.","Göktürkler, kendi alfabeleriyle bu yazıtları oluşturmuştur.","Cevap: Göktürkler."]},
 questions:[
   {q:"Orhun Yazıtları hangi Türk devletine aittir?", options:["Göktürkler","Uygurlar","Asya Hun Devleti","Avarlar"], answer:0, exp:"Türk adının geçtiği ilk yazılı belge olan Orhun Yazıtları, Göktürkler dönemine aittir."},
   {q:"Yerleşik hayata geçen ve matbaayı kullanan ilk Türk devleti hangisidir?", options:["Uygurlar","Göktürkler","Hazarlar","Kırgızlar"], answer:0},
   {q:"Eski Türk devletlerinde hükümdarın önemli kararları görüştüğü danışma meclisine ne ad verilir?", options:["Kurultay","Divan","Meclis-i Mebusan","Şura"], answer:0},
   {q:"Mete Han hangi Türk devletinin hükümdarıdır ve bu devleti en güçlü dönemine taşımıştır?", options:["Asya Hun Devleti","Göktürk Devleti","Uygur Devleti","Avar Devleti"], answer:0},
   {q:"Eski Türklerde hükümdarlık yetkisinin Gök Tanrı tarafından verildiğine inanılan, hükümdara yönetme hakkı tanıyan anlayışa ne ad verilir?", options:["Kut","Töre","Yarlığ","Turan"], answer:0, exp:"Eski Türklerde hükümdarlık yetkisinin Gök Tanrı tarafından verildiğine inanılırdı; bu anlayışa “kut” denir."}
 ]},
{id:'ta2', subject:'tarih', title:'İlk Türk-İslam Devletleri',
 analogy:"Türklerin İslamiyet’i kabulü, eski alışkanlıkların yeni bir kültürle harmanlanması gibidir — devlet gelenekleri korunurken İslami kurumlar da benimsenmiştir.",
 lessonSteps:[
   {title:"1. Sıfırdan Başlayalım", body:"Türkler, İslamiyet’le 8. yüzyıldan itibaren tanışmaya başladı. 751 yılında Talas Savaşı’nda Türkler, Çinlilere karşı Müslüman Araplara yardım etti — bu olay, Türklerin İslamiyet’e yakınlaşmasında önemli bir dönüm noktası oldu."},
   {title:"2. Şimdi Genişletelim", body:"Zamanla bazı Türk boyları toplu hâlde İslamiyet’i kabul etti. Bunu ilk yapan devlet Karahanlılar’dır. Sonra Gazneliler kuruldu — bu devlet, Türk-İslam dünyasında ilk kez “sultan” unvanını kullanan devlettir."},
   {title:"3. Son Bir Adım", body:"En önemli Türk-İslam devletlerinden biri Büyük Selçuklu Devleti’dir, kurucusu Tuğrul Bey’dir. Selçukluların en bilinen başarısı 1071 Malazgirt Zaferi’dir — bu savaşı Sultan Alparslan, Bizans’a karşı kazanmış ve bu zafer sayesinde Anadolu’nun kapıları Türklere açılmıştır. Bu tarihten sonra Türkler kalıcı olarak Anadolu’ya yerleşmeye başlamıştır."}
 ],
 strategy:"Bu dönemde hangi devletin “ilk” olduğuna dikkat et; dönüm noktası olayların tarih ve sonuçlarını eşleştir.",
 worked:{q:"İslamiyet’i kabul eden ilk Türk devleti hangisidir?", steps:["Türk-İslam devletleri arasında “ilk” unvanını taşıyan devleti hatırla.","Karahanlılar, Türkler arasında İslamiyet’i resmi olarak kabul eden ilk devlettir.","Gazneliler ve Selçuklular bu tarihten sonra kurulmuştur.","Cevap: Karahanlılar."]},
 questions:[
   {q:"İslamiyet’i kabul eden ilk Türk devleti hangisidir?", options:["Karahanlılar","Gazneliler","Büyük Selçuklu","Harzemşahlar"], answer:0},
   {q:"Malazgirt Savaşı hangi yıl ve kimin komutasında kazanılmıştır?", options:["1071, Alparslan","1176, I. Kılıçarslan","1243, Kösedağ","1048, Tuğrul Bey"], answer:0, exp:"1071 Malazgirt Zaferi, Sultan Alparslan komutasında kazanılmış ve Anadolu’nun Türk yurdu olmasının önünü açmıştır."},
   {q:"Türk-İslam devletleri arasında “sultan” unvanını ilk kullanan hükümdar kimdir?", options:["Gazneli Mahmut","Alparslan","Tuğrul Bey","Melikşah"], answer:0},
   {q:"751 yılında yapılan ve Türklerin Müslüman Araplara yardım ederek Çinlilere karşı savaştığı, Türklerin İslamiyet’e yakınlaşmasında önemli bir dönüm noktası olan savaş hangisidir?", options:["Talas Savaşı","Malazgirt Savaşı","Kösedağ Savaşı","Ankara Savaşı"], answer:0, exp:"751 Talas Savaşı’nda Türkler, Çinlilere karşı Müslüman Araplarla iş birliği yapmış; bu olay Türklerin İslamiyet’e yakınlaşmasında önemli bir dönüm noktası olmuştur."},
   {q:"Büyük Selçuklu Devleti’nin kurucusu kimdir?", options:["Tuğrul Bey","Alparslan","Melikşah","Çağrı Bey"], answer:0}
 ]},
{id:'ta3', subject:'tarih', title:'Osmanlı Kuruluş ve Yükselme Dönemi',
 analogy:"Osmanlı’nın kuruluşu küçük bir beylikten imparatorluğa uzanan bir büyüme hikâyesidir — her padişah devlete yeni bir toprak katmıştır.",
 lessonSteps:[
   {title:"1. Sıfırdan Başlayalım", body:"Osmanlı Devleti, 1299 yılında Osman Bey tarafından küçük bir beylik olarak kuruldu — yani başlangıçta büyük bir imparatorluk değil, Anadolu’daki birçok beylikten sadece biriydi. Zamanla, akıllı fetih politikaları ve güçlü ordusuyla büyüdü."},
   {title:"2. Şimdi Genişletelim", body:"Osmanlı tarihinde en önemli dönüm noktalarından biri 1453’te İstanbul’un fethidir. Bunu gerçekleştiren padişah II. Mehmet’tir, ve bu başarısından dolayı ona “Fatih” (fetheden) unvanı verilmiştir. Bu fetih o kadar önemlidir ki, tarihçiler Orta Çağ’ın bitip Yeni Çağ’ın bu olayla başladığını kabul eder."},
   {title:"3. Son Bir Adım", body:"Yükselme sürecinde başka önemli gelişmeler de oldu: Yavuz Sultan Selim döneminde (1517) Mısır’ın fethiyle halifelik unvanı Osmanlı hanedanına geçti; Barbaros Hayreddin Paşa’nın 1538’de kazandığı Preveze Deniz Savaşı ile Osmanlı Akdeniz’de güçlü bir deniz gücü hâline geldi. Osmanlı’nın en geniş sınırlara ulaştığı, gücünün zirvesinde olduğu dönem ise Kanuni Sultan Süleyman dönemidir — bu yüzden “yükselme dönemi” denince akla ilk Kanuni gelir."}
 ],
 strategy:"Padişah-olay eşleştirmelerine odaklan; fetih tarihlerini kronolojik sırayla akılda tut.",
 worked:{q:"İstanbul’un fethi hangi padişah döneminde gerçekleşmiştir?", steps:["1453 tarihini ve bu fethi gerçekleştiren padişahın lakabını hatırla.","Bu padişah, fetihten sonra “Fatih” unvanını almıştır.","Fatih unvanı II. Mehmet’e aittir.","Cevap: II. Mehmet (Fatih)."]},
 questions:[
   {q:"İstanbul’un fethi hangi padişah döneminde gerçekleşmiştir?", options:["II. Mehmet (Fatih)","I. Bayezid","II. Bayezid","Yavuz Sultan Selim"], answer:0},
   {q:"Osmanlı Devleti’nin sınırlarının en geniş olduğu dönem hangi padişaha aittir?", options:["Kanuni Sultan Süleyman","Fatih Sultan Mehmet","Yavuz Sultan Selim","I. Ahmet"], answer:0},
   {q:"Osmanlı Devleti hangi yılda ve kim tarafından kurulmuştur?", options:["1299, Osman Bey","1326, Orhan Bey","1453, Fatih Sultan Mehmet","1071, Alparslan"], answer:0},
   {q:"Halifelik unvanı hangi padişah döneminde Osmanlı hanedanına geçmiştir?", options:["Yavuz Sultan Selim","Kanuni Sultan Süleyman","Fatih Sultan Mehmet","II. Bayezid"], answer:0, exp:"1517’de Mısır’ın fethiyle halifelik unvanı Yavuz Sultan Selim ile Osmanlı hanedanına geçmiştir."},
   {q:"Barbaros Hayreddin Paşa’nın kazandığı ve Osmanlı’yı Akdeniz’de güçlü bir deniz gücü hâline getiren savaş hangisidir?", options:["Preveze Deniz Savaşı","İnebahtı Deniz Savaşı","Çeşme Deniz Savaşı","Navarin Deniz Savaşı"], answer:0}
 ]},
{id:'ta4', subject:'tarih', title:'Osmanlı Duraklama-Gerileme-Dağılma',
 analogy:"Bu dönem, büyümüş bir kurumun rakiplerine karşı avantajını kaybetmesi gibidir — Avrupa ilerlerken Osmanlı eski yöntemlerde ısrar etmiştir.",
 lessonSteps:[
   {title:"1. Sıfırdan Başlayalım", body:"Osmanlı, yükselişinin ardından zamanla Avrupa karşısında eski üstünlüğünü kaybetmeye başladı. Bunun somut bir işareti 1699 Karlofça Antlaşması’dır — Osmanlı’nın toprak kaybettiği İLK büyük antlaşma budur, ve bu yüzden gerileme döneminin başlangıcı olarak kabul edilir."},
   {title:"2. Şimdi Genişletelim", body:"Osmanlı devlet adamları bu gerilemeyi fark edip çözüm aramaya başladı. III. Selim döneminde “Nizam-ı Cedit” adıyla bilinen yenileşme hareketleri başladı — bu, Osmanlı’nın Batı’yı örnek alarak kendini yenileme çabalarının ilk ciddi adımıdır (özellikle orduda)."},
   {title:"3. Son Bir Adım", body:"Bu yenileşme çabaları zamanla devam etti. 1683’teki II. Viyana Kuşatması’nın başarısızlıkla sonuçlanması da gerileme sürecini hızlandıran önemli bir olaydır. Lale Devri’nde (III. Ahmet, 1718-1730) ise ilk kez daimi elçilikler açılıp Batı’yı tanıma çabaları yoğunlaştı. 1856’da ilan edilen Islahat Fermanı da, gayrimüslim azınlıklara Müslüman vatandaşlarla eşit haklar tanıyarak bu değişim sürecine devam etti."}
 ],
 strategy:"“İlk toprak kaybı”, “gerilemenin başlangıcı” gibi dönüm noktası olayları birbirine karıştırma.",
 worked:{q:"Osmanlı’nın toprak kaybettiği ilk büyük antlaşma ve gerileme döneminin başlangıcı sayılan antlaşma hangisidir?", steps:["“İlk toprak kaybı” ve “gerilemenin başlangıcı” ifadelerini birlikte hatırla.","1699 tarihli bir antlaşma bu iki özelliği birden taşır.","Bu antlaşma Karlofça Antlaşması’dır.","Cevap: Karlofça Antlaşması (1699)."]},
 questions:[
   {q:"Osmanlı Devleti’nin toprak kaybettiği ilk antlaşma olarak kabul edilen ve gerileme döneminin başlangıcı sayılan antlaşma hangisidir?", options:["Karlofça Antlaşması (1699)","Küçük Kaynarca Antlaşması (1774)","Kasr-ı Şirin Antlaşması","Zitvatorok Antlaşması"], answer:0},
   {q:"Nizam-ı Cedit yenileşme hareketleri hangi padişah döneminde başlamıştır?", options:["III. Selim","II. Mahmut","I. Abdülhamit","III. Ahmet"], answer:0},
   {q:"Gayrimüslim azınlıklara Müslümanlarla eşit haklar tanıyan ferman hangisidir?", options:["Islahat Fermanı (1856)","Tanzimat Fermanı (1839)","Kanun-i Esasi (1876)","Sened-i İttifak (1808)"], answer:0},
   {q:"Osmanlı Devleti’nin Avrupa karşısında büyük bir yenilgi aldığı ve gerileme sürecini hızlandıran 1683 tarihli kuşatma hangisidir?", options:["II. Viyana Kuşatması","I. Viyana Kuşatması (1529)","Belgrad Kuşatması","Estergon Kuşatması"], answer:0, exp:"1683 II. Viyana Kuşatması’nın başarısızlıkla sonuçlanması, Karlofça Antlaşması’na giden süreci başlatan dönüm noktalarından biridir."},
   {q:"Osmanlı’da ilk kez daimi elçiliklerin açılması ve Batı’yı tanıma çabalarının yoğunlaştığı dönem hangisidir?", options:["Lale Devri","Tanzimat Dönemi","Meşrutiyet Dönemi","Fetret Devri"], answer:0}
 ]},
{id:'ta5', subject:'tarih', title:'Milli Mücadele ve TBMM',
 analogy:"Milli Mücadele, dağınık direniş ateşlerinin (Kuvâ-yi Milliye) tek bir meşaleye — düzenli ordu ve TBMM’ye — dönüşme hikâyesidir.",
 lessonSteps:[
   {title:"1. Sıfırdan Başlayalım", body:"I. Dünya Savaşı’ndan yenik çıkan Osmanlı toprakları işgal edilmeye başlayınca, Mustafa Kemal 19 Mayıs 1919’da Samsun’a çıktı — bu tarih, Milli Mücadele’nin (Kurtuluş Savaşı’nın) resmi başlangıcı olarak kabul edilir."},
   {title:"2. Şimdi Genişletelim", body:"Mustafa Kemal, dağınık direniş güçlerini tek bir çatı altında toplamak istedi. Bunun için önce Amasya Genelgesi’ni yayınladı (“milletin bağımsızlığını yine milletin kendi gücü kurtaracaktır” fikri), sonra da 23 Nisan 1920’de Ankara’da TBMM’yi (Türkiye Büyük Millet Meclisi) açtı — artık ulusun kendi temsilcileri kendi kararlarını alıyordu."},
   {title:"3. Son Bir Adım", body:"Doğu Cephesi’nde Kâzım Karabekir Paşa'nın Ermenilere karşı yürüttüğü mücadele Gümrü Antlaşması’yla sonuçlandı. Mücadele, 1922’deki Büyük Taarruz ile düşman kuvvetlerinin Anadolu’dan atılmasıyla askeri olarak kazanıldı. Bundan önce 1920’de imzalanan ama TBMM tarafından tanınmayan Sevr Antlaşması yürürlüğe hiç girmemişti; savaş, 1923’teki Lozan Antlaşması ile diplomatik olarak sona erdi ve yeni Türk devleti dünya tarafından resmen tanındı."}
 ],
 strategy:"Genelge-kongre-antlaşma sıralamasını kronolojik olarak ezberle; her birinin “ilk kez” özelliğine dikkat et.",
 worked:{q:"Mustafa Kemal, Milli Mücadele’yi başlatmak amacıyla hangi tarihte Samsun’a çıkmıştır?", steps:["Milli Mücadele’nin başlangıç tarihi olarak kabul edilen olayı hatırla.","Bu, Mustafa Kemal’in Samsun’a resmi görevle çıkışıdır.","Tarih: 19 Mayıs 1919.","Cevap: 19 Mayıs 1919."]},
 questions:[
   {q:"Mustafa Kemal, Milli Mücadele’yi başlatmak amacıyla hangi tarihte Samsun’a çıkmıştır?", options:["19 Mayıs 1919","23 Nisan 1920","22 Haziran 1919","30 Ağustos 1922"], answer:0},
   {q:"TBMM hangi tarihte açılmıştır?", options:["23 Nisan 1920","19 Mayıs 1919","29 Ekim 1923","24 Temmuz 1923"], answer:0},
   {q:"Kurtuluş Savaşı’nı diplomatik olarak sonuçlandıran ve yeni Türk devletinin tanındığı antlaşma hangisidir?", options:["Lozan Antlaşması (1923)","Mudanya Ateşkesi (1922)","Sevr Antlaşması (1920)","Moskova Antlaşması (1921)"], answer:0},
   {q:"Kurtuluş Savaşı’nda Doğu Cephesi’nde Ermenilere karşı mücadele eden ve Gümrü Antlaşması ile sonuçlanan cepheyi kim yönetmiştir?", options:["Kâzım Karabekir Paşa","İsmet Paşa","Refet Bele","Fahrettin Altay"], answer:0},
   {q:"Sevr Antlaşması hangi yıl imzalanmış, ancak TBMM tarafından tanınmadığı için yürürlüğe girmemiştir?", options:["1920","1918","1923","1922"], answer:0}
 ]},
{id:'ta6', subject:'tarih', title:'Cumhuriyet Dönemi İnkılapları ve Atatürk İlkeleri',
 analogy:"İnkılaplar, eski bir evi yıkıp yerine modern bir ev inşa etmek gibidir — siyasi, hukuki, eğitim ve toplumsal alanlarda yeni bir yapı kurulmuştur.",
 lessonSteps:[
   {title:"1. Sıfırdan Başlayalım", body:"Lozan Antlaşması’ndan kısa süre sonra, 29 Ekim 1923’te Cumhuriyet ilan edildi — Türkiye artık bir padişah tarafından değil, halkın seçtiği temsilciler tarafından yönetilen bir devlet oldu."},
   {title:"2. Şimdi Genişletelim", body:"Cumhuriyetin ilanından sonra ülkeyi modernleştirmek için birbiri ardına inkılaplar (köklü değişimler) yapıldı. Tevhid-i Tedrisat Kanunu (1924) ile bütün okullar tek bir çatı altında (devletin kontrolünde) birleştirildi; 1928’de Harf İnkılabı ile Arap alfabesinden Latin alfabesine geçildi; 1934’te kadınlara milletvekili seçme-seçilme hakkı tanındı."},
   {title:"3. Son Bir Adım", body:"Bütün bu değişimlerin arkasındaki fikirler, Atatürk’ün altı temel ilkesinde özetlenir: Cumhuriyetçilik (yönetim halkın seçtikleriyle olur), Milliyetçilik, Halkçılık, Devletçilik, Laiklik (din ve devlet işlerinin ayrılması) ve İnkılapçılık (sürekli yenileşme). Bu altı ilkeyi ezberlemek, sınavda “hangisi ilke değildir” tarzı sorularda işine yarar."}
 ],
 strategy:"İnkılapların hangi alanda ve hangi yılda gerçekleştiğini eşleştirerek çalış.",
 worked:{q:"Türkiye Cumhuriyeti hangi tarihte ilan edilmiştir?", steps:["TBMM’nin cumhuriyeti resmen ilan ettiği tarihi hatırla.","Bu, Milli Mücadele’nin ve Lozan’ın ardından gerçekleşen anayasal bir dönüm noktasıdır.","Tarih: 29 Ekim 1923.","Cevap: 29 Ekim 1923."]},
 questions:[
   {q:"Türkiye Cumhuriyeti hangi tarihte ilan edilmiştir?", options:["29 Ekim 1923","23 Nisan 1920","3 Mart 1924","30 Ağustos 1922"], answer:0},
   {q:"Öğretimi millileştiren ve dinî-laik eğitim ikiliğine son veren kanun hangisidir?", options:["Tevhid-i Tedrisat Kanunu (1924)","Medeni Kanun (1926)","Harf İnkılabı (1928)","Kabotaj Kanunu (1926)"], answer:0},
   {q:"Aşağıdakilerden hangisi Atatürk ilkelerinden biri değildir?", options:["Meşrutiyetçilik","Halkçılık","Laiklik","Devletçilik"], answer:0, exp:"Atatürk’ün altı ilkesi Cumhuriyetçilik, Milliyetçilik, Halkçılık, Devletçilik, Laiklik ve İnkılapçılık’tır; “Meşrutiyetçilik” bu ilkeler arasında yer almaz."},
   {q:"Kadınlara milletvekili seçme ve seçilme hakkı hangi yıl tanınmıştır?", options:["1934","1930","1926","1923"], answer:0, exp:"1930’da kadınlara belediye seçimlerinde, 1934’te ise milletvekili seçme-seçilme hakkı tanınmıştır."},
   {q:"Harf İnkılabı (Latin alfabesine geçiş) hangi yıl gerçekleştirilmiştir?", options:["1928","1924","1930","1934"], answer:0}
 ]},
{id:'ta7', subject:'tarih', title:'Çağdaş Türk ve Dünya Tarihi',
 analogy:"Bu dönem, genç Türkiye Cumhuriyeti’nin dünyadaki büyük fırtınalar (dünya savaşları, Soğuk Savaş) arasında ayakta kalma ve yerini sağlamlaştırma hikâyesidir.",
 lessonSteps:[
   {title:"1. Sıfırdan Başlayalım", body:"Türkiye Cumhuriyeti kurulduktan sonra, dünyada iki büyük savaş yaşandı (I. ve II. Dünya Savaşları). Genç Türkiye Cumhuriyeti’nin en büyük önceliği, henüz yaralarını sarmamışken yeni bir savaşa girmemekti."},
   {title:"2. Şimdi Genişletelim", body:"Bu yüzden Türkiye, II. Dünya Savaşı (1939-1945) boyunca büyük ölçüde tarafsız kaldı — hiçbir tarafla resmi olarak savaşa girmedi. Savaş bitince, dünya barışını korumak amacıyla kurulan Birleşmiş Milletler’e 1945’te kurucu üye olarak katıldı."},
   {title:"3. Son Bir Adım", body:"Savaştan sonra dünya iki büyük bloğa ayrıldı: Amerika önderliğindeki Batı bloğu ve Sovyetler Birliği önderliğindeki Doğu bloğu (buna “Soğuk Savaş” denir). Türkiye, kuzey komşusu Sovyetler Birliği’nden gelen tehdit nedeniyle Batı bloğuna yakınlaştı ve 1952’de NATO’ya üye oldu. Daha sonra, 1974’te Kıbrıs Barış Harekâtı gerçekleştirildi."}
 ],
 strategy:"Türkiye’nin uluslararası kuruluşlara üyelik tarihlerini (BM 1945, NATO 1952) ve II. Dünya Savaşı’ndaki tarafsızlık politikasını net biçimde ayırt et.",
 worked:{q:"Türkiye II. Dünya Savaşı’nda nasıl bir politika izlemiştir?", steps:["Türkiye’nin bu dönemdeki dış politika önceliğini hatırla: yeni kurulan devleti savaşın yıkımından korumak.","Türkiye, savaşan taraflardan biriyle ittifaka girmemiştir.","Savaşın büyük bölümünde tarafsızlığını korumuştur.","Cevap: Savaşın sonuna kadar büyük ölçüde tarafsız kalmıştır."]},
 questions:[
   {q:"Türkiye, II. Dünya Savaşı’nda nasıl bir politika izlemiştir?", options:["Savaşın sonuna kadar büyük ölçüde tarafsız kalmıştır","Almanya’nın yanında savaşa girmiştir","Müttefiklerin yanında baştan itibaren savaşmıştır","Savaşın başından itibaren fiilen çatışmaya girmiştir"], answer:0},
   {q:"Türkiye, Birleşmiş Milletler’e hangi yıl kurucu üye olarak katılmıştır?", options:["1945","1952","1923","1960"], answer:0},
   {q:"Türkiye NATO’ya hangi yıl üye olmuştur?", options:["1952","1945","1960","1974"], answer:0},
   {q:"Kıbrıs Barış Harekâtı hangi yıl gerçekleştirilmiştir?", options:["1974","1960","1980","1964"], answer:0},
   {q:"Soğuk Savaş döneminde Türkiye, Sovyet tehdidine karşı hangi blokla yakınlaşmıştır?", options:["Batı bloğu (ABD ve müttefikleri)","Doğu bloğu (Sovyetler Birliği)","Bağlantısızlar Hareketi","Üçüncü Dünya ülkeleri"], answer:0}
 ]},

{id:'cg1', subject:'cografya', title:"Türkiye'nin Coğrafi Konumu",
 analogy:"Türkiye’nin konumu, üç kıtanın kesiştiği bir kavşakta duran bir şehir merkezi gibidir — bu kavşak konumu hem avantaj hem çeşitlilik getirir.",
 lessonSteps:[
   {title:"1. Sıfırdan Başlayalım", body:"Bir yerin “konumu” derken iki farklı şeyden bahsedebiliriz. Matematik konum, o yerin küre üzerindeki tam yerini (enlem-boylam) anlatır — sanki bir haritada koordinat vermek gibi. Türkiye, 36-42° kuzey enlemleri ile 26-45° doğu boylamları arasında yer alır."},
   {title:"2. Şimdi Genişletelim", body:"Özel konum ise, o yerin komşularıyla, denizlerle, ticaret yollarıyla ilişkisini anlatır — yani “nerede” değil “kimin yanında, neye yakın” sorusuna cevap verir. Türkiye’nin üç tarafının denizlerle çevrili olması, Asya ile Avrupa arasında köprü olması, önemli boğazlara (İstanbul, Çanakkale) sahip olması hep özel konumun sonuçlarıdır."},
   {title:"3. Son Bir Adım", body:"Bir soruda bahsedilen özelliğin matematik mi özel mi konumdan kaynaklandığını ayırt etmek için şunu sor: bu, enlem-boylamla mı ilgili (o zaman matematik konum), yoksa komşuluk-denizlerle mi ilgili (o zaman özel konum)? Mesela “doğu ile batı arasında saat farkı olması” boylamla ilgilidir, yani matematik konumun sonucudur. Özel konumun somut bir sonucu: Türkiye’nin Yunanistan, Bulgaristan, Gürcistan, Ermenistan, Nahçıvan (Azerbaycan), İran, Irak ve Suriye olmak üzere 8 kara komşusu vardır."}
 ],
 strategy:"Bir sonucun matematik konum mu yoksa özel konum mu kaynaklı olduğunu ayırt et: enlem/boylamla ilgiliyse matematik, komşuluk/denizlerle ilgiliyse özel konumdur.",
 worked:{q:"Türkiye’nin doğusu ile batısı arasında yerel saat farkının olması hangi konumun sonucudur?", steps:["Yerel saat farkı enlem-boylam (matematik konum) ile mi, yoksa komşuluk (özel konum) ile mi ilgili, ona bak.","Saat farkı doğrudan boylam farkından kaynaklanır.","Boylam, matematik konumun bir parçasıdır.","Cevap: Matematik konum."]},
 questions:[
   {q:"Türkiye’nin doğusu ile batısı arasında yerel saat farkının olması hangi konumun sonucudur?", options:["Matematik konum","Özel konum","Coğrafi bölge konumu","İklim konumu"], answer:0},
   {q:"Türkiye’nin üç kıtanın kesişim noktasında yer alması ve önemli ticaret yolları üzerinde bulunması hangi konumun sonucudur?", options:["Özel konum","Matematik konum","Astronomik konum","Yerel konum"], answer:0},
   {q:"Türkiye hangi enlemler arasında yer alır?", options:["36°-42° kuzey","26°-45° kuzey","0°-23° kuzey","42°-50° kuzey"], answer:0},
   {q:"Türkiye’nin batısı ile doğusu arasındaki yerel saat farkı yaklaşık ne kadardır?", options:["Yaklaşık 76 dakika (1 saat 16 dk)","Yaklaşık 30 dakika","Yaklaşık 2 saat","Fark yoktur"], answer:0},
   {q:"Türkiye’nin kara komşusu sayısı kaçtır?", options:["8","6","10","7"], answer:0, exp:"Türkiye’nin Yunanistan, Bulgaristan, Gürcistan, Ermenistan, Nahçıvan (Azerbaycan), İran, Irak ve Suriye olmak üzere 8 komşusu vardır."}
 ]},
{id:'cg2', subject:'cografya', title:"Türkiye'nin İklimi",
 analogy:"Türkiye’nin iklim çeşitliliği, aynı anda farklı gardıraplardan kıyafet seçmek zorunda kalmak gibidir — kıyıda mayo, İç Anadolu’da kalın mont gerekebilir.",
 lessonSteps:[
   {title:"1. Sıfırdan Başlayalım", body:"İklim, bir yerde uzun yıllar boyunca tekrarlayan sıcaklık ve yağış düzenidir. Türkiye tek bir iklime sahip değil — kıyı bölgeleri ile iç kesimler çok farklı iklimler yaşar, çünkü denize yakınlık ve yükselti iklimi doğrudan etkiler."},
   {title:"2. Şimdi Genişletelim", body:"Karadeniz kıyısında her mevsim yağış görülür, yazlar serin kışlar ılık geçer — çünkü deniz sıcaklığı dengeler ve nemli hava sürekli yağış getirir. Akdeniz ve Ege kıyılarında ise yazlar sıcak ve kurak, kışlar ılık ve yağışlı geçer — yani yağış yaz yerine kışa toplanır; bu iklimin tipik bitki örtüsü, kurak yazlara dayanıklı çalılıklardan oluşan “maki”dir."},
   {title:"3. Son Bir Adım", body:"İç kesimlere gidildikçe (deniz etkisinden uzaklaştıkça) iklim “karasallaşır” — bu, yaz ile kış arasındaki sıcaklık farkının büyümesi ve yağışın azalması demektir. İç Anadolu’da yazlar sıcak-kurak, kışlar soğuk ve karlı geçer, yıllık yağış azdır; doğal bitki örtüsü de bu kuraklığa uygun bozkırdır (step). Doğu Anadolu’da ise yükselti daha fazla olduğu için karasallık daha da sertleşir."}
 ],
 strategy:"Tarif edilen sıcaklık-yağış özelliklerinden hangi bölgenin iklimi olduğunu çıkar; “her mevsim yağışlı” ifadesi hep Karadeniz’i işaret eder.",
 worked:{q:"Her mevsim yağışlı, yazı serin kışı ılık geçen iklim tipi hangi bölgemizde görülür?", steps:["“Her mevsim yağışlı” ifadesi hep aynı bölgeyi işaret eder, bunu ezberden hatırla.","Bu özellik Türkiye’de sadece bir bölgede belirgindir.","Nem ve yağışın kaynağı, bölgeyi çevreleyen deniz ve dağların konumudur.","Cevap: Karadeniz."]},
 questions:[
   {q:"Her mevsim yağışlı, yazı serin kışı ılık geçen iklim tipi hangi bölgemizde görülür?", options:["Karadeniz","İç Anadolu","Akdeniz","Doğu Anadolu"], answer:0},
   {q:"Yazları sıcak-kurak, kışları soğuk-kar yağışlı geçen, yıllık yağışı düşük iklim tipi nerede görülür?", options:["İç Anadolu","Karadeniz","Ege","Marmara"], answer:0, exp:"Bu özellikler karasal iklimin tanımıdır ve en belirgin biçimde İç Anadolu’da görülür."},
   {q:"Bir yerin denizden uzaklaşması ve yükseltisinin artması genellikle neye yol açar?", options:["Karasallığın artmasına","Yağışın artmasına","Nemin artmasına","Kışların ılımanlaşmasına"], answer:0},
   {q:"Akdeniz iklimine sahip bir bölgede yetişen tipik doğal bitki örtüsü hangisidir?", options:["Maki","Bozkır (step)","Tundra","İğne yapraklı orman (tayga)"], answer:0},
   {q:"İç Anadolu’da doğal bitki örtüsü olarak hangisi görülür?", options:["Bozkır (step)","Maki","Gür ormanlar","Tayga"], answer:0}
 ]},
{id:'cg3', subject:'cografya', title:'Yerşekilleri',
 analogy:"Türkiye’nin yerşekilleri farklı jeolojik dönemlerin izlerini taşıyan bir maket gibidir — genç kıvrım dağlar, geniş platolar, derin vadiler.",
 lessonSteps:[
   {title:"1. Sıfırdan Başlayalım", body:"Türkiye’nin altında bulunduğu toprak, dünyanın en hareketli bölgelerinden birinde yer alır — buna “Alp-Himalaya kıvrım kuşağı” denir. Bu kuşakta yer almak, dağların hâlâ “genç” (oluşum süreci tamamlanmamış) ve diri olması, yani deprem riskinin yüksek olması demektir."},
   {title:"2. Şimdi Genişletelim", body:"Türkiye’de dağlar genelde kıyıya paralel uzanır — kuzeyde Kuzey Anadolu Dağları, güneyde Toros Dağları. Ülkenin ortalama yükseltisi de batıdan doğuya doğru artar; bu yüzden Doğu Anadolu, Türkiye’nin en yüksek ve en engebeli bölgesidir."},
   {title:"3. Son Bir Adım", body:"Dağlık ve engebeli arazi, akarsuların kısa mesafede hızlıca denize ulaşmasına yol açar — Türkiye’deki akarsular genelde kısa boylu ama hızlı akışlıdır. Bu durumun iki sonucu vardır: hızlı akan su büyük bir enerji potansiyeli taşır (hidroelektrik santraller için idealdir), ama aynı zamanda gemi taşımacılığına elverişli değildir (sığ ve hızlı akan sularda büyük gemiler güvenle seyredemez). Türkiye’nin en yüksek dağı Ağrı Dağı (5137 m), en uzun akarsuyu ise Kızılırmak’tır."}
 ],
 strategy:"“Genç-diri, deprem riski” ifadeleri hep Alp-Himalaya kuşağıyla, “kısa boylu hızlı akarsu” ifadesi hidroelektrik potansiyeliyle ilişkilendirilir.",
 worked:{q:"Türkiye’de dağların genç ve diri olmasının, deprem riskinin yüksek olmasının temel nedeni nedir?", steps:["Türkiye’nin hangi büyük kıvrım/deprem kuşağında yer aldığını hatırla.","Genç, diri dağlar aktif yer hareketlerinin göstergesidir.","Türkiye, Alp-Himalaya kıvrım kuşağında yer alır.","Cevap: Alp-Himalaya kıvrım kuşağında yer alması."]},
 questions:[
   {q:"Türkiye’de dağların genç ve diri olmasının, deprem riskinin yüksek olmasının temel nedeni nedir?", options:["Alp-Himalaya kıvrım kuşağında yer alması","Üç tarafının denizlerle çevrili olması","Ilıman iklim kuşağında bulunması","Yüzölçümünün büyük olması"], answer:0},
   {q:"Türkiye’de akarsuların boylarının kısa, akış hızlarının fazla olmasının temel sonucu nedir?", options:["Hidroelektrik enerji potansiyelinin yüksek, ulaşıma elverişsiz olması","Ulaşıma çok elverişli olmaları","Taşımacılıkta yoğun kullanılmaları","Tuzluluk oranlarının artması"], answer:0},
   {q:"Türkiye’nin ortalama yükseltisi hangi yönde artış gösterir?", options:["Batıdan doğuya","Kuzeyden güneye","Doğudan batıya","Güneyden kuzeye"], answer:0},
   {q:"Türkiye’nin en yüksek dağı hangisidir?", options:["Ağrı Dağı","Erciyes Dağı","Uludağ","Kaçkar Dağı"], answer:0, exp:"5137 m yüksekliğiyle Ağrı Dağı, Türkiye’nin en yüksek dağıdır."},
   {q:"Türkiye’nin en uzun akarsuyu hangisidir?", options:["Kızılırmak","Fırat","Sakarya Nehri","Yeşilırmak"], answer:0}
 ]},
{id:'cg4', subject:'cografya', title:'Nüfus ve Yerleşme',
 analogy:"Nüfus dağılımı, kalabalık bir cadde ile boş bir ara sokak farkı gibidir — iklim, yeryüzü şekli ve ekonomik fırsatlar insanları belirli yerlere çeker.",
 lessonSteps:[
   {title:"1. Sıfırdan Başlayalım", body:"Bir bölgede çok insan yaşıyorsa “nüfus yoğunluğu yüksek” deriz; az insan yaşıyorsa “düşük” deriz. Bunu etkileyen iki tür faktör var: doğal faktörler (iklim, yerşekli) ve beşeri/insani faktörler (sanayi, ticaret, ulaşım)."},
   {title:"2. Şimdi Genişletelim", body:"İklimi elverişli, düz ve tarıma uygun ovalarda, ayrıca sanayinin ve ticaretin yoğun olduğu yerlerde nüfus daha kalabalık olur — çünkü insanlar iş imkânı ve yaşam kolaylığı olan yerlere yönelir. Bu yüzden Türkiye’de Marmara Bölgesi en yoğun nüfuslu bölgedir, buna karşılık engebeli ve soğuk iklimli Doğu Anadolu en seyrek nüfuslu bölgelerden biridir."},
   {title:"3. Son Bir Adım", body:"İnsanlar, daha iyi yaşam koşulları bulacaklarını düşündükleri yerlere göç ederler. Türkiye’de kırsal alanlarda (köylerde) tarımla geçinen insanlar, kentlerde sanayi ve hizmet sektöründe daha fazla iş imkânı olduğu için şehirlere göç etmiştir — buna “kırdan kente göç” denir. Genel bir kural olarak, bir ülkede doğan insan sayısı ölen insan sayısından fazlaysa, o ülkenin nüfusu artar."}
 ],
 strategy:"Nüfusu artıran/azaltan etkenleri beşeri (sanayi, ticaret) ve doğal (iklim, yerşekli) olarak ayır.",
 worked:{q:"Türkiye’de kırdan kente göçün temel nedeni aşağıdakilerden hangisidir?", steps:["Göçün “çekici” (kentte ne var) ve “itici” (kırda ne eksik) nedenlerini ayır.","Soru en güçlü çekici nedeni soruyor.","Kentlerde iş ve gelir imkânı sunan sektörler sanayi ve hizmettir.","Cevap: Sanayi ve hizmet sektörünün kentlerde yoğunlaşması."]},
 questions:[
   {q:"Türkiye’de nüfusun en yoğun olduğu bölge hangisidir?", options:["Marmara","Doğu Anadolu","Güneydoğu Anadolu","Karadeniz"], answer:0},
   {q:"Aşağıdakilerden hangisi bir bölgede nüfus yoğunluğunu artıran etkenlerden biridir?", options:["Sanayileşme","Engebeli arazi","Şiddetli iklim koşulları","Ulaşım imkânlarının yetersizliği"], answer:0},
   {q:"Türkiye’de kırdan kente göçün temel nedeni aşağıdakilerden hangisidir?", options:["Sanayi ve hizmet sektörünün kentlerde yoğunlaşması","Kırsal alanda iklimin çok elverişli olması","Kentlerde tarım arazisinin bol olması","Kırsalda ulaşımın çok gelişmiş olması"], answer:0},
   {q:"Türkiye’de nüfus yoğunluğunun en düşük olduğu bölgelerden biri hangisidir?", options:["Doğu Anadolu","Marmara","Ege","Akdeniz"], answer:0},
   {q:"Bir ülkede doğum oranının ölüm oranından yüksek olması nüfusun hangi yönde değişmesine yol açar?", options:["Artmasına","Azalmasına","Sabit kalmasına","Yaşlanmasına"], answer:0}
 ]},
{id:'cg5', subject:'cografya', title:'Ekonomik Coğrafya',
 analogy:"Türkiye ekonomisi, her bölgenin kendi uzmanlık alanına sahip olduğu bir atölyeler zinciri gibidir.",
 lessonSteps:[
   {title:"1. Sıfırdan Başlayalım", body:"Türkiye’nin her bölgesi, kendi iklim ve toprak özelliklerine göre farklı ürünlerde uzmanlaşmıştır — yani her bölge kendi “markasını” yaratmıştır. Bunun nedeni basit: bir bitki, sadece kendisine uygun iklim ve toprakta iyi yetişir."},
   {title:"2. Şimdi Genişletelim", body:"Karadeniz’in nemli ve ılıman iklimi fındık ve çay için idealdir; Ege’nin kurak-sıcak yazları zeytin ve üzüm için; Çukurova’nın sıcak iklimi ve verimli ovaları pamuk ve narenciye için uygundur. Bir bölgenin hangi üründe öne çıktığını, o bölgenin iklimini düşünerek de tahmin edebilirsin."},
   {title:"3. Son Bir Adım", body:"Sanayi, tarımdan farklı olarak iklime değil, ulaşım kolaylığına, pazara (büyük şehirlere) yakınlığa ve iş gücüne ihtiyaç duyar — bu yüzden Marmara Bölgesi, limanları ve büyük şehirleriyle Türkiye’nin sanayi merkezidir. Turizm ise ikiye ayrılır: kıyı (deniz-kum-güneş) turizmi Akdeniz ve Ege’de, kültür turizmi ise tarihi eserlerin yoğun olduğu bölgelerde yoğunlaşır."}
 ],
 strategy:"Bir ürünün/sektörün hangi bölgeyle özdeşleştiğini eşleştir; sınavda sıkça “hangi bölge hangi ürünle öne çıkar” sorulur.",

{id:'cg6', subject:'cografya', title:"Türkiye'nin Coğrafi Bölgeleri",
 analogy:"Türkiye’nin 7 coğrafi bölgesi, her biri kendi iklimi, tarımı ve yaşam tarzıyla ayrı bir mahalle gibidir; bölgeler iklim ve bitki örtüsü benzerliğine göre belirlenmiştir.",
 lessonSteps:[
   {title:"1. Sıfırdan Başlayalım", body:"Türkiye, benzer iklim ve bitki örtüsüne sahip alanların bir araya getirilmesiyle 7 coğrafi bölgeye ayrılmıştır: Marmara, Ege, Akdeniz, İç Anadolu, Karadeniz, Doğu Anadolu, Güneydoğu Anadolu. Her bölgenin kendine özgü bir “kimliği” vardır."},
   {title:"2. Şimdi Genişletelim", body:"Bölgeleri karşılaştırırken şunu unutma: yüzölçümü büyük olan bölge, en kalabalık bölge olmak zorunda değil. Doğu Anadolu, yüzölçümü en büyük bölgedir ama engebeli ve soğuk olduğu için nüfusu azdır. Marmara ise yüzölçümü en küçük bölgelerden biri olmasına rağmen, sanayi ve iş imkânı bol olduğu için nüfusu ve nüfus yoğunluğu en fazla olan bölgedir."},
   {title:"3. Son Bir Adım", body:"Her bölgenin öne çıkan bir özelliği vardır, bunları eşleştirerek çalışmak işine yarar: İç Anadolu’da başkent Ankara ve tahıl tarımı, Güneydoğu Anadolu’da GAP projesi ve pamuk tarımı, Akdeniz’de turizm ve narenciye, Karadeniz’de fındık-çay ve engebeli arazi öne çıkar."}
 ],
 strategy:"Her bölgenin “birinci” olduğu bir özelliği (yüzölçümü en büyük/en küçük, nüfusu en yoğun/en seyrek, öne çıkan proje/ürün) net biçimde birbirinden ayır.",
 worked:{q:"Yüzölçümü bakımından Türkiye’nin en büyük coğrafi bölgesi hangisidir?", steps:["Bölgelerin yüzölçümü sıralamasını, nüfus yoğunluğuyla karıştırmadan hatırla.","En büyük yüzölçümüne sahip bölge, en kalabalık bölge değildir.","Doğu Anadolu, geniş ve engebeli arazisiyle yüzölçümü en büyük bölgedir.","Cevap: Doğu Anadolu."]},

 ]},

{id:'va1', subject:'vatandaslik', title:'Hukukun Temel Kavramları',
 analogy:"Hukuk kuralları bir oyunun kuralları gibidir — herkes uymalıdır ve uyulmadığında bir yaptırım devreye girer; ahlak kurallarında yaptırım ise vicdanidir.",
 lessonSteps:[
   {title:"1. Sıfırdan Başlayalım", body:"Toplumda insanların birbirleriyle ilişkilerini düzenleyen birçok kural var — ahlak kuralları, din kuralları, görgü kuralları ve hukuk kuralları. Bunların hepsi “böyle davran” der, ama aralarında önemli bir fark var: kurala uyulmazsa ne olur?"},
   {title:"2. Şimdi Genişletelim", body:"Ahlak kuralına uymazsan (mesela yalan söylersen), toplum seni ayıplar, vicdanın seni rahatsız eder — ama devlet seni cezalandırmaz. Hukuk kuralına uymazsan (mesela hırsızlık yaparsan) devlet, polis-mahkeme gibi resmi güçleriyle seni cezalandırır — buna “yaptırım” ya da “müeyyide” denir. İşte hukuku diğer kurallardan ayıran temel özellik budur: devlet gücüyle desteklenen somut bir yaptırıma sahip olması."},
   {title:"3. Son Bir Adım", body:"Hukuk kuralları da kendi içinde ikiye ayrılır. Kamu hukuku, devlet ile birey arasındaki ilişkileri düzenler (örneğin anayasa hukuku, ceza hukuku). Özel hukuk ise bireylerin kendi aralarındaki ilişkileri düzenler (örneğin biri diğerine borç verdiğinde uygulanan borçlar hukuku, ya da miras paylaşımını düzenleyen medeni hukuk)."}
 ],
 strategy:"“Hangisi özel/kamu hukuku dalıdır” sorularında ilişkinin taraflarına bak: devlet-birey ise kamu, birey-birey ise özel hukuktur.",
 worked:{q:"Hukuk kurallarını ahlak kurallarından ayıran temel özellik nedir?", steps:["İki kural türünün de var olduğunu ama yaptırımlarının farklı olduğunu düşün.","Ahlak kurallarına uyulmamasının yaptırımı vicdani/toplumsaldır, devlet zoru yoktur.","Hukuk kurallarının arkasında devlet gücüyle desteklenen somut bir yaptırım vardır.","Cevap: Devlet gücüyle desteklenen maddi yaptırıma sahip olması."]},
 questions:[
   {q:"Hukuk kurallarını ahlak kurallarından ayıran temel özellik nedir?", options:["Devlet gücüyle desteklenen maddi yaptırıma sahip olması","Yazılı olması","Herkesi bağlaması","Zamanla değişebilmesi"], answer:0},
   {q:"Aşağıdakilerden hangisi özel hukuk dallarından biridir?", options:["Medeni Hukuk","Anayasa Hukuku","Ceza Hukuku","İdare Hukuku"], answer:0},
   {q:"Devlet ile birey arasındaki ilişkileri düzenleyen hukuk dalına ne ad verilir?", options:["Kamu hukuku","Özel hukuk","Medeni hukuk","Ticaret hukuku"], answer:0},
   {q:"Bir hukuk kuralına uyulmaması durumunda karşılaşılan yaptırıma ne ad verilir?", options:["Müeyyide (yaptırım)","Örf","Teamül","İçtihat"], answer:0},
   {q:"Kanunların, tüzüklerin ve yönetmeliklerin hazırlanışını ve yürürlüğe giriş şeklini düzenleyen temel kurallar hangi hukuk dalında yer alır?", options:["Anayasa hukuku","Borçlar hukuku","Ticaret hukuku","Medeni hukuk"], answer:0}
 ]},
{id:'va2', subject:'vatandaslik', title:'Türk Anayasal Gelişimi',
 analogy:"Anayasalar, bir ülkenin kurum kültürü el kitabı gibidir — her yeni anayasa dönemin ihtiyaçlarına göre bu el kitabını günceller.",
 lessonSteps:[
   {title:"1. Sıfırdan Başlayalım", body:"Anayasa, bir devletin en temel kurallarını, yönetim şeklini ve vatandaşların haklarını belirleyen en üst kanundur — sanki devletin “ana kural kitabı” gibi düşünebilirsin. Türk tarihinde ilk yazılı anayasa 1876’da ilan edilen Kanun-i Esasi’dir."},
   {title:"2. Şimdi Genişletelim", body:"Milli Mücadele sırasında, henüz Cumhuriyet ilan edilmeden önce, TBMM kendi anayasasını yaptı: 1921 Teşkilat-ı Esasiye Kanunu. Cumhuriyet ilan edildikten sonra ise 1924’te yeni ve daha kapsamlı bir anayasa hazırlandı — bu, Cumhuriyetin ilk anayasasıdır."},
   {title:"3. Son Bir Adım", body:"Türkiye tarihinde askeri müdahaleler de yeni anayasalara yol açmıştır. 1961 Anayasası, 27 Mayıs 1960 askeri müdahalesinin ardından hazırlanmıştır. Şu anda yürürlükte olan 1982 Anayasası ise 12 Eylül 1980 askeri müdahalesinin ardından hazırlanmıştır."}
 ],
 strategy:"Hangi anayasanın “ilk” olduğuna (Osmanlı’nın / Cumhuriyet’in / TBMM döneminin ilk anayasası) dikkat ederek ayırt et.",
 worked:{q:"Türk tarihinin ilk yazılı anayasası hangisidir?", steps:["“İlk” ifadesi geçtiği için en eski tarihli anayasayı ara.","Osmanlı döneminde I. Meşrutiyet ile ilan edilen anayasayı hatırla.","Bu anayasa 1876 tarihli Kanun-i Esasi’dir.","Cevap: 1876 Kanun-i Esasi."]},
 questions:[
   {q:"Türk tarihinin ilk yazılı anayasası hangisidir?", options:["1876 Kanun-i Esasi","1921 Teşkilat-ı Esasiye Kanunu","1924 Anayasası","1982 Anayasası"], answer:0},
   {q:"Şu anda yürürlükte olan Türkiye Cumhuriyeti Anayasası hangi yıla aittir?", options:["1982","1961","1924","1921"], answer:0},

   {q:"1961 Anayasası hangi olayın ardından hazırlanmıştır?", options:["27 Mayıs 1960 askeri müdahalesi","12 Eylül 1980 askeri müdahalesi","Milli Mücadele","II. Meşrutiyet’in ilanı"], answer:0},
   {q:"1982 Anayasası hangi olayın ardından hazırlanmıştır?", options:["12 Eylül 1980 askeri müdahalesi","27 Mayıs 1960 askeri müdahalesi","28 Şubat süreci","Balkan Savaşları"], answer:0}
 ]},
{id:'va3', subject:'vatandaslik', title:'Yasama (TBMM)',
 analogy:"TBMM, ülkenin kurallar fabrikasıdır — kanunlar burada tasarlanır, tartışılır ve üretilir.",
 lessonSteps:[
   {title:"1. Sıfırdan Başlayalım", body:"Bir devletin işleyişini üç temel görev üzerinden düşünebilirsin: kanun yapmak (yasama), bu kanunları uygulamak (yürütme), ve anlaşmazlıkları çözmek (yargı). Türkiye’de kanun yapma yetkisi, yani yasama, TBMM’ye (Türkiye Büyük Millet Meclisi) aittir."},
   {title:"2. Şimdi Genişletelim", body:"TBMM, halkın seçtiği 600 milletvekilinden oluşur. Milletvekili seçilebilmek için 18 yaşını doldurmuş olmak yeterlidir (bu yaş sınırı 2017’de değiştirilmiştir, eskiden daha yüksekti)."},
   {title:"3. Son Bir Adım", body:"TBMM’nin sadece kanun yapmak değil, başka önemli görevleri de vardır: devletin bütçesini (gelir-gider planını) görüşüp onaylamak, yürütmeyi (hükümeti) denetlemek gibi. Bir kanun teklifinin kabul edilmesi için genelde toplantıya katılanların salt çoğunluğunun (yarıdan fazlasının) evet demesi yeterlidir."}
 ],
 strategy:"Yasama-yürütme-yargı görev ayrımını net tut; kanun yapma yetkisi her zaman yasama (TBMM) ile ilişkilendirilir.",

 questions:[
   {q:"Türkiye’de yasama yetkisi hangi organa aittir?", options:["TBMM","Cumhurbaşkanlığı","Anayasa Mahkemesi","Danıştay"], answer:0},
   {q:"TBMM kaç milletvekilinden oluşur?", options:["600","550","500","450"], answer:0},
   {q:"Türkiye’de milletvekili seçilme yaşı kaçtır?", options:["18","25","30","21"], answer:0},
