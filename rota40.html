<style>
:root{
  --bg:#14171C;
  --bg-elev:#1B1F26;
  --bg-elev-2:#20242C;
  --line:#2B303A;
  --text:#F2F1ED;
  --text-muted:#8B909B;
  --accent:#FF4D2E;
  --accent-ink:#1A0904;
  --success:#2EE6A6;
  --danger:#FF5C7A;
  --matematik:#2EE6A6;
  --turkce:#5B8CFF;
  --tarih:#F0C24B;
  --cografya:#2FC1D6;
  --vatandaslik:#C792EA;
  --radius:3px;
  --font-display:'Oswald',sans-serif;
  --font-body:'IBM Plex Sans',sans-serif;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#14171C; --bg-elev:#1B1F26; --bg-elev-2:#20242C; --text:#F2F1ED; --text-muted:#8B909B; --line:#2B303A;
  }
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  justify-content:center;
}
#app{
  width:100%;
  max-width:480px;
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  position:relative;
  border-left:1px solid var(--line);
  border-right:1px solid var(--line);
}
a{color:inherit;}
button{font-family:inherit;}

/* ---------- Top bar ---------- */
.topbar{
  position:sticky; top:0; z-index:20;
  background:var(--bg);
  border-bottom:1px solid var(--line);
  padding:14px 16px 12px;
  display:flex; align-items:flex-end; justify-content:space-between;
}
.wordmark{
  font-family:var(--font-display);
  font-size:20px;
  font-weight:600;
  letter-spacing:0.5px;
  display:flex; align-items:center; gap:6px;
}
.wordmark .dot{color:var(--accent);}
.countdown-badge{
  text-align:right;
  line-height:1;
}
.countdown-badge .num{
  font-family:var(--font-display);
  font-size:30px;
  font-weight:600;
  color:var(--accent);
  display:block;
}
.countdown-badge .label{
  font-size:10.5px;
  color:var(--text-muted);
  display:block;
  margin-top:3px;
}

/* ---------- Main content ---------- */
main{
  flex:1;
  padding:18px 16px 100px;
  overflow-y:auto;
}
.screen{display:none;}
.screen.active{display:block;}

.hero-row{
  display:flex; align-items:baseline; justify-content:space-between;
  margin-bottom:14px;
}
.hero-day{
  font-family:var(--font-display);
  font-size:15px;
  color:var(--text-muted);
}
.hero-day b{color:var(--text); font-weight:600;}
.subject-chip{
  display:inline-flex; align-items:center; gap:6px;
  font-size:12.5px;
  color:var(--text-muted);
  padding:4px 9px;
  border:1px solid var(--line);
  border-radius:20px;
}
.subject-chip .sw{width:8px;height:8px;border-radius:50%;display:inline-block;}

.coach-line{
  font-family:var(--font-display);
  font-size:19px;
  line-height:1.28;
  font-weight:500;
  padding:14px 0 18px;
  border-bottom:1px solid var(--line);
  margin-bottom:18px;
}
.coach-line .accent{color:var(--accent);}

.card{
  background:var(--bg-elev);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:16px;
  margin-bottom:12px;
}
.card h3{
  margin:0 0 8px;
  font-family:var(--font-display);
  font-size:16px;
  font-weight:600;
}
.card p{margin:0 0 10px; font-size:14.5px; line-height:1.55; color:var(--text);}
.card p:last-child{margin-bottom:0;}
.card .kicker{
  font-size:11px;
  color:var(--text-muted);
  margin-bottom:6px;
}
.topic-title{
  font-family:var(--font-display);
  font-size:23px;
  font-weight:600;
  margin:2px 0 16px;
  line-height:1.2;
}

.btn{
  display:block;
  width:100%;
  text-align:center;
  padding:14px 16px;
  border-radius:var(--radius);
  border:none;
  font-family:var(--font-display);
  font-size:15.5px;
  font-weight:600;
  letter-spacing:0.3px;
  cursor:pointer;
  margin-top:6px;
}
.btn-primary{background:var(--accent); color:#fff;}
.btn-secondary{background:transparent; color:var(--text); border:1px solid var(--line);}
.btn:active{opacity:0.85;}
.btn:disabled{opacity:0.4; cursor:default;}

/* ---------- Quiz ---------- */
.quiz-timer{
  display:inline-block;
  font-family:var(--font-display);
  font-size:13px;
  color:var(--text-muted);
  border:1px solid var(--line);
  border-radius:20px;
  padding:4px 12px;
  margin-bottom:16px;
  letter-spacing:0.5px;
}
.qblock{
  margin-bottom:20px;
  padding-bottom:18px;
  border-bottom:1px solid var(--line);
}
.qblock:last-of-type{border-bottom:none;}
.qnum{
  font-family:var(--font-display);
  font-size:11.5px;
  color:var(--text-muted);
  margin-bottom:6px;
}
.qtext{font-size:15px; line-height:1.5; margin-bottom:12px; font-weight:500;}
.opt{
  display:flex; align-items:flex-start; gap:10px;
  padding:11px 12px;
  border:1px solid var(--line);
  border-radius:var(--radius);
  margin-bottom:8px;
  font-size:14px;
  line-height:1.4;
  cursor:pointer;
  background:var(--bg-elev-2);
}
.opt .letter{
  font-family:var(--font-display);
  font-weight:600;
  color:var(--text-muted);
  flex-shrink:0;
}
.opt.selected{border-color:var(--accent); background:rgba(255,77,46,0.08);}
.opt.correct{border-color:var(--success); background:rgba(46,230,166,0.10);}
.opt.wrong{border-color:var(--danger); background:rgba(255,92,122,0.10);}
.opt.disabled{cursor:default;}
.qexp{
  font-size:13px;
  color:var(--text-muted);
  line-height:1.5;
  margin-top:8px;
  padding-top:8px;
  border-top:1px dashed var(--line);
  display:none;
}
.qexp.show{display:block;}

.score-hero{
  text-align:center;
  padding:30px 0 10px;
}
.score-hero .big{
  font-family:var(--font-display);
  font-size:56px;
  font-weight:700;
  line-height:1;
}
.score-hero .sub{color:var(--text-muted); font-size:13.5px; margin-top:8px;}

/* ---------- Progress bars ---------- */
.progress-track{
  width:100%; height:8px;
  background:var(--bg-elev-2);
  border:1px solid var(--line);
  border-radius:4px;
  overflow:hidden;
  margin:6px 0 2px;
}
.progress-fill{height:100%; background:var(--accent);}
.subject-row{margin-bottom:14px;}
.subject-row .srow-top{display:flex; justify-content:space-between; font-size:13px; margin-bottom:5px;}
.subject-row .srow-top .sname{display:flex; align-items:center; gap:7px;}
.subject-row .sw{width:9px;height:9px;border-radius:50%;flex-shrink:0;}

/* ---------- Route bar (40-day) ---------- */
.route-strip{
  display:flex; gap:2px; margin:4px 0 2px; height:7px;
}
.route-seg{flex:1; background:var(--bg-elev-2); border-radius:1px;}
.route-seg.done{background:var(--accent);}

/* ---------- Stat grid ---------- */
.stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;}
.stat-box{
  background:var(--bg-elev);
  border:1px solid var(--line);
  padding:14px;
  border-radius:var(--radius);
}
.stat-box .n{font-family:var(--font-display); font-size:26px; font-weight:600;}
.stat-box .l{font-size:11.5px; color:var(--text-muted); margin-top:3px;}

/* ---------- Calendar ---------- */
.cal-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:6px;
}
.cal-cell{
  aspect-ratio:1;
  border:1px solid var(--line);
  border-radius:var(--radius);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  font-family:var(--font-display);
  font-size:13px;
  position:relative;
  background:var(--bg-elev);
  cursor:pointer;
}
.cal-cell.today{border-color:var(--accent); border-width:2px;}
.cal-cell.done{background:var(--bg-elev-2);}
.cal-cell .cdot{width:6px;height:6px;border-radius:50%;position:absolute; top:5px; right:5px;}
.cal-cell .cchk{position:absolute; bottom:4px; font-size:9px; color:var(--success);}
.cal-legend{display:flex; flex-wrap:wrap; gap:10px; margin-top:14px; font-size:11.5px; color:var(--text-muted);}
.cal-legend span{display:flex; align-items:center; gap:5px;}
.cal-legend .sw{width:8px;height:8px;border-radius:50%;}

/* ---------- Bottom nav ---------- */
.bottomnav{
  position:fixed;
  bottom:0; left:50%; transform:translateX(-50%);
  width:100%; max-width:480px;
  background:var(--bg-elev);
  border-top:1px solid var(--line);
  display:flex;
  padding-bottom:env(safe-area-inset-bottom, 0);
  z-index:30;
}
.navbtn{
  flex:1;
  background:none; border:none;
  padding:11px 4px 9px;
  display:flex; flex-direction:column; align-items:center; gap:3px;
  color:var(--text-muted);
  font-size:10.5px;
  font-family:var(--font-body);
}
.navbtn .ic{font-size:18px;}
.navbtn.active{color:var(--accent);}

.empty-note{
  text-align:center;
  color:var(--text-muted);
  font-size:13.5px;
  padding:30px 10px;
  line-height:1.6;
}
.checklist{list-style:none; padding:0; margin:0;}
.checklist li{
  display:flex; gap:10px; align-items:flex-start;
  font-size:14px; line-height:1.5;
  padding:9px 0;
  border-bottom:1px solid var(--line);
}
.checklist li:last-child{border-bottom:none;}
.checklist li .ck{color:var(--success); flex-shrink:0;}
::selection{background:var(--accent); color:#fff;}
</style>

 analogy:"Yaş ve sayı problemleri bir hikâyeyi denklemle anlatmak gibidir; cümledeki her ilişkiyi bir harfle (x) ifade edip denklem kurarsın.",
 explain:"Ardışık sayı problemlerinde sayılar x, x+1, x+2... şeklinde ifade edilir. Yaş problemlerinde “kaç yıl sonra/önce” ifadelerinde her iki kişinin yaşına aynı sayı eklenir/çıkarılır. Kesir problemlerinde “bir sayının X’te biri Y kadardır” ifadeleri doğrudan denkleme çevrilir.",
 strategy:"Bilinmeyeni x koy, cümledeki her ilişkiyi ayrı bir denklem parçasına çevir, sonra çöz.",
 questions:[
   {q:"İki ardışık çift sayının toplamı 46 ise büyük sayı kaçtır?", options:["24","22","26","23"], answer:0, exp:"x ve x+2 ardışık çift sayılardır: x+(x+2)=46 → x=22, büyük sayı 24."},
   {q:"Bir baba bugün 40, oğlu 10 yaşındadır. Kaç yıl sonra babanın yaşı oğlunun yaşının 3 katı olur?", options:["5","4","6","10"], answer:0, exp:"40+t=3(10+t) denklemi çözülünce t=5 yıl bulunur."},
   {q:"Bir sayının 2/5’i 30 ise bu sayı kaçtır?", options:["75","60","50","90"], answer:0, exp:"(2/5)x=30 → x=75."},
   {q:"Üç ardışık tam sayının toplamı 84 ise en büyük sayı kaçtır?", options:["29","28","27","30"], answer:0, exp:"Ardışık üç sayı x-1, x, x+1 ile gösterilir: 3x=84 → x=28, en büyüğü 29."},
   {q:"Bir sayının 3 katının 7 fazlası 40 ise bu sayı kaçtır?", options:["11","10","33","13"], answer:0, exp:"3x+7=40 → 3x=33 → x=11."}
 ]},
{id:'mt7', subject:'matematik', title:'Problemler: Hareket, İşçi-Havuz, Yüzde-Kâr/Zarar',
 analogy:"Hareket problemleri bir yol filmi gibidir: Yol=Hız×Zaman formülü sahne sahne ilerler. Yüzde problemleri ise indirim etiketlerini okumaktır.",
 explain:"Yol=Hız×Zaman. Zıt yönde hareket edenlerin hızları toplanır, aynı yönde gidenlerin hız farkı kullanılır. İşçi-havuz sorularında birim zamandaki iş oranları toplanır (1/a+1/b=1/t). Yüzde X indirim sonrası fiyat = fiyat×(100-x)/100. Kâr-zarar: Satış fiyatı = Alış fiyatı + Kâr.",
 strategy:"Hareket sorularında önce yönü (aynı/zıt) belirle; işçi-havuz sorularında “1 günlük iş” oranı üzerinden düşün.",
 questions:[
   {q:"Aralarında 300 km olan iki şehirden aynı anda karşılıklı yola çıkan iki araç, biri 60 km/sa diğeri 40 km/sa hızla gidiyorsa kaç saat sonra karşılaşırlar?", options:["3","5","2","4"], answer:0, exp:"Zıt yönde hareket edenlerin hızları toplanır: 300/(60+40)=3 saat."},
   {q:"Bir işi Ali 6 günde, Veli 12 günde tek başına bitiriyor. Birlikte çalışırlarsa işi kaç günde bitirirler?", options:["4","3","9","18"], answer:0, exp:"Günlük iş oranları toplanır: 1/6+1/12=3/12=1/4 → iş 4 günde biter."},
   {q:"800 TL’ye alınan bir ürün %25 kârla satılırsa satış fiyatı kaç TL olur?", options:["1000","900","1050","1200"], answer:0, exp:"Kâr tutarı 800×0,25=200 TL; satış fiyatı 800+200=1000 TL."},
   {q:"120 km yolu 2 saatte alan bir aracın ortalama hızı kaç km/sa’dir?", options:["60","50","70","80"], answer:0, exp:"Hız=Yol/Zaman=120/2=60 km/sa."},
   {q:"1200 TL’ye alınan bir ürün %10 zararla satılırsa satış fiyatı kaç TL olur?", options:["1080","1100","1320","1000"], answer:0, exp:"Zarar tutarı 1200×0,10=120 TL; satış fiyatı 1200-120=1080 TL."}
 ]},
{id:'mt8', subject:'matematik', title:'Geometri: Temel Kavramlar ve Üçgenler',
 analogy:"Üçgenler geometri sorularının iskeletidir — üç kenar, bir masa ayağı gibi açılarla birbirine bağlanır.",
 explain:"Bir üçgenin iç açıları toplamı 180°’dir. Bir dış açı, kendisine komşu olmayan iki iç açının toplamına eşittir. Eşkenar üçgende tüm açılar 60°, ikizkenar üçgende taban açıları eşittir. Pisagor bağıntısı: dik üçgende a²+b²=c² (c hipotenüs).",
 strategy:"Şekilli sorularda önce bilinen açı/kenarları işaretle, sonra iç açılar toplamı ya da Pisagor bağıntısıyla eksik değeri bul.",
 questions:[
   {q:"Bir üçgenin iç açılarından ikisi 50° ve 70° ise üçüncü açı kaç derecedir?", options:["60°","50°","70°","65°"], answer:0, exp:"İç açılar toplamı 180°’dir: 180-(50+70)=60°."},
   {q:"Dik kenarları 6 cm ve 8 cm olan dik üçgenin hipotenüsü kaç cm’dir?", options:["10","14","7","12"], answer:0, exp:"Pisagor bağıntısı: 6²+8²=36+64=100, hipotenüs=√100=10 cm."},
   {q:"İkizkenar bir üçgende tepe açısı 40° ise taban açılarından biri kaç derecedir?", options:["70°","80°","60°","50°"], answer:0, exp:"Taban açıları eşittir: (180-40)/2=70°."},
   {q:"Bir üçgenin dış açılarından biri 110° ise bu dış açıya komşu olmayan iki iç açının toplamı kaç derecedir?", options:["110°","70°","55°","220°"], answer:0, exp:"Bir dış açı, kendisine komşu olmayan iki iç açının toplamına eşittir."},
   {q:"Kenar uzunlukları 5 cm, 5 cm ve 6 cm olan üçgen ne tür bir üçgendir?", options:["İkizkenar üçgen","Eşkenar üçgen","Çeşitkenar üçgen","Dik üçgen"], answer:0, exp:"İki kenarı eşit (5 cm, 5 cm) olduğu için ikizkenar üçgendir."}
 ]},
{id:'mt9', subject:'matematik', title:'Permütasyon, Kombinasyon ve Olasılık',
 analogy:"Permütasyon ve kombinasyon, bir grubu farklı şekillerde sıraya dizmenin ya da aralarından seçim yapmanın kaç yolu olduğunu sayan bir yöntemdir; olasılık ise bir olayın gerçekleşme şansını ölçer.",
 explain:"Permütasyonda sıralama önemlidir: n farklı elemanın n! (n faktöriyel) farklı dizilişi vardır; n elemandan r tanesinin sıralı seçimi nPr=n!/(n-r)! ile bulunur. Kombinasyonda sıralama önemli değildir: n elemandan r tanesinin seçimi nCr=n!/(r!(n-r)!) ile bulunur. Olasılık = istenen durum sayısı / mümkün tüm durum sayısı.",
 strategy:"Soruda sıralamanın (kimin önce, hangi görevde) önemli olup olmadığına bak: önemliyse permütasyon, önemsizse kombinasyon kullan.",
 questions:[
   {q:"5 farklı kitap bir rafa yan yana kaç farklı şekilde dizilebilir?", options:["120","20","25","60"], answer:0, exp:"5 farklı nesnenin sıralanışı 5!=120’dir."},
   {q:"8 kişilik bir gruptan başkan ve yardımcısı (2 farklı görev) kaç farklı şekilde seçilebilir?", options:["56","28","64","16"], answer:0, exp:"Görevler farklı olduğu için sıralama önemlidir: 8P2=8×7=56."},
   {q:"10 kişilik bir gruptan 3 kişilik bir komite (görev ayrımı yok) kaç farklı şekilde seçilebilir?", options:["120","720","30","1000"], answer:0, exp:"Komite üyeleri arasında görev farkı olmadığı için sıralama önemsizdir: 10C3=10!/(3!×7!)=120."},
   {q:"Bir zar bir kez atıldığında üste 4’ten büyük bir sayı gelme olasılığı kaçtır?", options:["1/3","1/2","2/3","1/6"], answer:0, exp:"Mümkün 6 durumdan 2 tanesi (5,6) istenen durumdur: 2/6=1/3."},
   {q:"Bir torbada 4 kırmızı, 6 mavi top vardır. Rastgele çekilen bir topun kırmızı olma olasılığı kaçtır?", options:["2/5","3/5","1/4","4/6"], answer:0, exp:"Toplam top sayısı 10, kırmızı top sayısı 4: 4/10=2/5."}
 ]},

{id:'tr1', subject:'turkce', title:'Ses Bilgisi',
 analogy:"Türkçedeki ünlüler bir orkestra gibi çalışır: kalın sesler (a,ı,o,u) ile ince sesler (e,i,ö,ü) bir kelime içinde karışmaz.",
 explain:"Büyük ünlü uyumuna göre bir kelimenin ilk hecesinde kalın ünlü varsa sonraki hecelerde de kalın, ince ünlü varsa ince ünlü bulunur. Kaynaştırma harfleri (y, ş, s, n) ünlüyle biten kelime ünlüyle başlayan ek aldığında araya girer (kapı-y-a, araba-s-ı). Sert ünsüzle (p,ç,t,k) biten kelimeler ünlüyle başlayan ek aldığında yumuşar: kitap-ı değil kitab-ı.",
 strategy:"Kelimeyi hecelere ayırıp ünlüleri tek tek kontrol et; yabancı kökenli bazı kelimeler (kalem gibi) kurala aykırı istisnadır.",
 questions:[
   {q:"Aşağıdakilerden hangisi büyük ünlü uyumuna aykırıdır?", options:["kitaplık","radyo","hediye","kalemlik"], answer:3, exp:"“Kalem” Arapça kökenlidir ve tek başına büyük ünlü uyumuna aykırıdır (a kalın, e ince); aldığı ekler kurala uysa da kelime bütünüyle aykırı sayılır."},
   {q:"“Arabasını çok sever.” cümlesinde “araba” sözcüğüne getirilen iyelik ekinde hangi kaynaştırma harfi kullanılmıştır?", options:["y","ş","s","n"], answer:2, exp:"“Araba” ünlüyle bitiyor, iyelik eki “-ı” ünlüyle başladığı için araya kaynaştırma harfi “s” girer: araba-s-ı."},
   {q:"“Kitap” sözcüğüne ünlüyle başlayan bir ek getirildiğinde sondaki “p” sesinde nasıl bir değişiklik olur?", options:["p, ç’ye dönüşür","p, b’ye dönüşür","değişmez","p, f’ye dönüşür"], answer:1, exp:"Sert ünsüzle biten kelimeler ünlüyle başlayan ek aldığında yumuşar: kitap-ı değil kitab-ı."},
   {q:"Küçük ünlü uyumuna göre, bir hecede düz ünlü (a, e, ı, i) varsa sonraki hecede hangi tür ünlü gelemez?", options:["Yuvarlak ünlü (o, ö, u, ü)","Düz ünlü (a, e, ı, i)","Kalın ünlü","İnce ünlü"], answer:0, exp:"Küçük ünlü uyumunda bir hecedeki düz ünlüden sonra yuvarlak ünlü gelmez."},
   {q:"“Kitap” sözcüğüne “-cı” meslek eki getirildiğinde neden “kitapçı” biçiminde yazılır (c, ç’ye dönüşür)?", options:["Sert ünsüzden (p) sonra yumuşak ünsüz (c) sertleşerek ç’ye dönüşür (ünsüz benzeşmesi)","Büyük ünlü uyumu gereği","Kaynaştırma harfi kullanıldığı için","Ünlü daralması olduğu için"], answer:0, exp:"Ünsüz benzeşmesi (sertleşme) kuralına göre sert ünsüzle biten kelimelere c,d,g ile başlayan ek gelirse bu sesler sertleşerek ç,t,k’ye dönüşür: kitap+cı → kitapçı."}
 ]},
{id:'tr2', subject:'turkce', title:'Yapı Bilgisi (Ekler)',
 analogy:"Ekler, bir kelimeye takılan lego parçaları gibidir; yapım ekleri kelimenin türünü değiştirir, çekim ekleri sadece cümledeki görevini belirtir.",
 explain:"Yapım ekleri kelimenin türünü değiştirebilir ve yeni bir kelime oluşturur: göz-lük, oku-ma. Çekim ekleri kelimenin anlamını temelden değiştirmez, sadece görevini/durumunu belirtir: hâl ekleri, çoğul eki (-ler/-lar), iyelik ekleri, fiil çekim ekleri.",
 strategy:"“Yeni bir kelime mi oluştu yoksa sadece görev mi değişti” diye sor — yeni kelime oluştuysa yapım eki, sadece görev değiştiyse çekim ekidir.",
 questions:[
   {q:"“Göz-lük-çü-lük” kelimesinde kaç tane yapım eki vardır?", options:["3","2","1","4"], answer:0, exp:"göz+lük, +çü, +lük eklerinin üçü de yeni kelime/tür oluşturduğu için yapım ekidir."},
   {q:"Aşağıdaki eklerden hangisi bir çekim ekidir?", options:["Çoğul eki (-ler/-lar)","Meslek adı yapan “-çı/-ci”","Küçültme eki “-cik”","İsimden fiil yapan “-le”"], answer:0, exp:"Çoğul eki kelimenin türünü değiştirmez, sadece sayı bilgisi ekler; bu yüzden çekim ekidir."},
   {q:"“Oku-ma” kelimesinde “-ma” eki hangi tür ektir?", options:["Yapım eki (fiilden isim yapar)","Çekim eki (zaman eki)","Çekim eki (çoğul eki)","Yapım eki (isimden fiil yapar)"], answer:0, exp:"“-ma/-me” eki fiile eklenerek isim yapar (okuma, yazma); bu yüzden yapım ekidir."},
   {q:"“Sevgi-li” kelimesindeki “-li” eki hangi tür ektir?", options:["Yapım eki (isimden isim/sıfat yapar)","Çekim eki (hâl eki)","Çekim eki (iyelik eki)","Çekim eki (çoğul eki)"], answer:0, exp:"“-li” eki isme eklenerek yeni bir sıfat/isim oluşturur (sevgi→sevgili), bu yüzden yapım ekidir."},
   {q:"Aşağıdaki kelimelerden hangisinde bir zaman eki (çekim eki) vardır?", options:["Gel-di","Gel-mek","Gel-en","Gel-iş"], answer:0, exp:"“-di” görülen geçmiş zaman ekidir ve bir çekim ekidir; “-mek, -en, -iş” ekleri fiilden isim yapan yapım ekleridir."}
 ]},
{id:'tr3', subject:'turkce', title:'Sözcükte Anlam',
 analogy:"Kelimeler bazen tek anlamlı bir valizle, bazen çok gözlü bir çantayla gezer; bağlama göre hangi gözünü açtığını anlarsın.",
 explain:"Gerçek (temel) anlam, kelimenin sözlük anlamıdır. Mecaz anlam, kelimenin gerçek anlamından uzaklaşarak kazandığı yeni anlamdır. Deyimler, en az iki kelimeden oluşan, kalıplaşmış ve çoğunlukla mecazlı anlatımlardır. Eş anlamlı kelimeler aynı, zıt anlamlı kelimeler karşıt anlam taşır.",
 strategy:"Cümledeki kelimenin somut/nesnel bir durumu mu yoksa soyutlaşmış bir durumu mu anlattığına bak.",
 questions:[
   {q:"“Bu haberi duyunca yüreği dağlandı.” cümlesindeki altı çizili söz için ne söylenebilir?", options:["Mecaz anlamda kullanılmıştır","Gerçek anlamda kullanılmıştır","Terim anlamda kullanılmıştır","Yan anlamda kullanılmıştır"], answer:0, exp:"“Yürek dağlanmak” gerçek bir yanma değil, üzüntü duymayı ifade eden mecazlı bir deyimdir."},
   {q:"Aşağıdaki kelime çiftlerinden hangisi zıt (karşıt) anlamlıdır?", options:["Karanlık - Aydınlık","Güzel - Hoş","Akıllı - Zeki","Ev - Konut"], answer:0, exp:"Diğer çiftler eş/yakın anlamlıyken karanlık-aydınlık birbirinin karşıtıdır."},
   {q:"“Ağzı kulaklarına varmak” deyiminin anlamı nedir?", options:["Çok sevinmek","Çok üzülmek","Çok konuşmak","Çok şaşırmak"], answer:0},
   {q:"“Bardağın suyu taştı.” cümlesindeki “su” sözcüğü hangi anlamda kullanılmıştır?", options:["Gerçek anlamda","Mecaz anlamda","Terim anlamda","Yan anlamda"], answer:0},
   {q:"“Eli açık” deyiminin anlamı nedir?", options:["Cömert","Cimri","Çalışkan","Tembel"], answer:0}
 ]},
{id:'tr4', subject:'turkce', title:'Cümlede Anlam',
 analogy:"Bir cümle, bir haber sunucusu (nesnel: sadece olguyu aktarır) ya da bir yorumcu (öznel: kendi görüşünü katar) gibi konuşabilir.",
 explain:"Nesnel (objektif) yargı, kişiden kişiye değişmeyen, kanıtlanabilir bilgi içerir. Öznel (sübjektif) yargı kişinin kendi görüş/beğenisini yansıtır ve kanıtlanamaz. Cümlede ayrıca koşul, karşılaştırma, amaç-sonuç, neden-sonuç ilişkileri de sorulur.",
 strategy:"Cümlede “bence, göre, en güzel, bana kalırsa” gibi ifadeler varsa öznel; sayı, tarih, somut olgu varsa nesneldir.",
 questions:[
   {q:"“Roman, 300 sayfadan oluşmaktadır.” cümlesi için ne söylenebilir?", options:["Nesnel bir yargıdır","Öznel bir yargıdır","Hem nesnel hem öznel bir yargıdır","Varsayıma dayalı bir yargıdır"], answer:0},
   {q:"“Bence bu romanın en etkileyici yanı sonundaki sürpriz bitiştir.” cümlesi için ne söylenebilir?", options:["Öznel bir yargıdır","Nesnel bir yargıdır","Kanıtlanabilir bir yargıdır","Sayısal veri içeren bir yargıdır"], answer:0},
   {q:"“Yağmur yağdığı için maç ertelendi.” cümlesinde hangi anlam ilişkisi vardır?", options:["Neden-sonuç","Amaç-sonuç","Karşılaştırma","Koşul"], answer:0},
   {q:"“Eğer erken kalkarsan trene yetişirsin.” cümlesinde hangi anlam ilişkisi vardır?", options:["Koşul (şart)","Neden-sonuç","Amaç-sonuç","Karşılaştırma"], answer:0},
   {q:"“Bu elbise şu elbiseden daha güzel.” cümlesinde hangi anlam ilişkisi vardır?", options:["Karşılaştırma","Koşul","Neden-sonuç","Amaç-sonuç"], answer:0}
 ]},
{id:'tr5', subject:'turkce', title:'Paragraf',
 analogy:"Bir paragraf, bir ana yolun etrafında ilerleyen yan sokaklar gibidir — ana düşünce, tüm cümlelerin birleştiği yerdir.",
 explain:"Ana düşünce, paragrafın anlatmak istediği temel fikirdir; genelde yardımcı düşüncelerin (örnek, açıklama, kanıt) toplamından çıkarılır. Paragraf sorularında sıkça “bu parçadan çıkarılabilecek en kapsamlı yargı” ya da “neye değinilmemiştir” tarzı sorular gelir.",
 strategy:"Paragrafı hızlıca oku, ilk ve son cümlelere özellikle dikkat et, sonra soruyu tekrar okuyup parçaya dön.",
 questions:[
   {q:"Bir paragrafta anlatılmak istenen temel fikre ne ad verilir?", options:["Ana düşünce","Yardımcı düşünce","Konu","Bakış açısı"], answer:0},
   {q:"Paragraf sorularında “Bu parçada aşağıdakilerden hangisine değinilmemiştir?” tarzı bir soruda nasıl bir strateji izlenmelidir?", options:["Şıklar parçayla tek tek karşılaştırılıp parçada geçmeyen bulunmalıdır","Sadece ilk cümleye bakılmalıdır","Paragrafın konusu tahmin edilip şıklara bakılmadan cevaplanmalıdır","Sadece son cümleye bakılmalıdır"], answer:0},
   {q:"“Konu” ile “ana düşünce” arasındaki temel fark nedir?", options:["Konu neyden bahsedildiğidir, ana düşünce yazarın bu konu hakkında söylemek istediğidir","Konu ve ana düşünce her zaman aynı şeydir","Ana düşünce paragrafın ilk cümlesidir, konu son cümlesidir","Konu sadece başlıkta bulunur"], answer:0},
   {q:"Bir paragrafın giriş cümlesi genellikle neyi tanıtır?", options:["Paragrafın konusunu","Yazarın kişisel bilgilerini","Paragrafın kaynakçasını","Yardımcı düşüncelerin sırasını"], answer:0},
   {q:"Paragraf tamamlama sorularında en önemli ölçüt nedir?", options:["Anlam ve anlatım akışının bozulmaması","Cümlenin en uzun şık olması","Şıkta özel isim geçmesi","Cümlenin soru cümlesi olması"], answer:0}
 ]},
{id:'tr6', subject:'turkce', title:'Yazım Kuralları ve Noktalama',
 analogy:"Yazım kuralları ve noktalama işaretleri, bir metnin trafik işaretleri gibidir — nerede duracağını, nerede vurgu yapacağını gösterir.",
 explain:"“de/da” bağlacı her zaman ayrı yazılır (Ali de geldi); bulunma hâli eki “-de/-da” bitişik yazılır (Evde kaldı). “ki” bağlacı genelde ayrı yazılır, ilgi eki “-ki” bitişik yazılır (Benimki, sabahki). İki nokta, açıklama yapılacağı zaman kullanılır.",
 strategy:"“de/da” ve “ki” sorularında kelimeyi cümleden çıkar; anlam bozulmuyorsa bağlaçtır (ayrı), bozuluyorsa ektir (bitişik).",
 questions:[
   {q:"“Ali de sınava girecek.” cümlesindeki “de” neden ayrı yazılmıştır?", options:["Bağlaç olduğu ve cümleden çıkarılabildiği için","Bulunma hâli eki olduğu için","Özel isimden sonra geldiği için","Cümlenin sonunda olduğu için"], answer:0, exp:"“de” çıkarılınca anlam bozulmaz (Ali sınava girecek), bu yüzden ayrı yazılır."},
   {q:"Açıklama yapılacağı zaman hangi noktalama işareti kullanılır?", options:["İki nokta (:)","Noktalı virgül (;)","Ünlem (!)","Kesme işareti (')"], answer:0},
   {q:"“Sabahki” kelimesinde “ki” neden bitişik yazılmıştır?", options:["İlgi eki olduğu için","Bağlaç olduğu için","Cümleden çıkarılabildiği için","Özel isim olduğu için"], answer:0},
   {q:"Sıralı cümleleri veya eş görevli sözcükleri birbirinden ayırmak için hangi noktalama işareti kullanılır?", options:["Virgül (,)","Nokta (.)","Ünlem (!)","Soru işareti (?)"], answer:0},
   {q:"“Öğretmenimiz, ‘Yarın sınav var.’ dedi.” cümlesinde tırnak içindeki ifade neden büyük harfle başlamıştır?", options:["Tırnak içinde aktarılan söz bir cümle olduğu ve cümleler büyük harfle başladığı için","Her tırnak içi ifade büyük harfle başlar kuralı olduğu için","Özel isim olduğu için","Yazım hatası, küçük harfle başlamalıydı"], answer:0}
 ]},

{id:'ta1', subject:'tarih', title:'İslamiyet Öncesi Türk Tarihi',
 analogy:"İlk Türk devletlerini bir aile soyağacı gibi düşün — her biri bir öncekinden gelen gelenekleri (kurultay, ordu-millet anlayışı) miras almıştır.",
 explain:"Bilinen ilk Türk devleti Asya Hun Devleti’dir (Mete Han döneminde en güçlü dönemini yaşamıştır). Göktürkler, Türk adını taşıyan ve alfabesi (Orhun Yazıtları) olan ilk devlettir. Uygurlar yerleşik hayata geçen, matbaayı kullanan ilk Türk devletidir. Eski Türklerde “kurultay” devlet işlerinin görüşüldüğü danışma meclisiydi.",
 strategy:"“İlk” ifadesi geçen sorularda hangi devletin hangi konuda öncü olduğunu eşleştir.",
 questions:[
   {q:"Orhun Yazıtları hangi Türk devletine aittir?", options:["Göktürkler","Uygurlar","Asya Hun Devleti","Avarlar"], answer:0, exp:"Türk adının geçtiği ilk yazılı belge olan Orhun Yazıtları, Göktürkler dönemine aittir."},
   {q:"Yerleşik hayata geçen ve matbaayı kullanan ilk Türk devleti hangisidir?", options:["Uygurlar","Göktürkler","Hazarlar","Kırgızlar"], answer:0},
   {q:"Eski Türk devletlerinde hükümdarın önemli kararları görüştüğü danışma meclisine ne ad verilir?", options:["Kurultay","Divan","Meclis-i Mebusan","Şura"], answer:0},
   {q:"Mete Han hangi Türk devletinin hükümdarıdır ve bu devleti en güçlü dönemine taşımıştır?", options:["Asya Hun Devleti","Göktürk Devleti","Uygur Devleti","Avar Devleti"], answer:0},
   {q:"Eski Türklerde hükümdarlık yetkisinin Gök Tanrı tarafından verildiğine inanılan, hükümdara yönetme hakkı tanıyan anlayışa ne ad verilir?", options:["Kut","Töre","Yarlığ","Turan"], answer:0, exp:"Eski Türklerde hükümdarlık yetkisinin Gök Tanrı tarafından verildiğine inanılırdı; bu anlayışa “kut” denir."}
 ]},
{id:'ta2', subject:'tarih', title:'İlk Türk-İslam Devletleri',
 analogy:"Türklerin İslamiyet’i kabulü, eski alışkanlıkların yeni bir kültürle harmanlanması gibidir — devlet gelenekleri korunurken İslami kurumlar da benimsenmiştir.",
 explain:"Karahanlılar, İslamiyet’i kabul eden ilk Türk devletidir. Gazneliler, Türk-İslam dünyasında “sultan” unvanını ilk kullanan devlettir. Büyük Selçuklu Devleti, Malazgirt Zaferi (1071) ile Anadolu’nun kapılarını Türklere açmıştır; bu zaferi Sultan Alparslan kazanmıştır.",
 strategy:"Bu dönemde hangi devletin “ilk” olduğuna dikkat et; dönüm noktası olayların tarih ve sonuçlarını eşleştir.",
 questions:[
   {q:"İslamiyet’i kabul eden ilk Türk devleti hangisidir?", options:["Karahanlılar","Gazneliler","Büyük Selçuklu","Harzemşahlar"], answer:0},
   {q:"Malazgirt Savaşı hangi yıl ve kimin komutasında kazanılmıştır?", options:["1071, Alparslan","1176, I. Kılıçarslan","1243, Kösedağ","1048, Tuğrul Bey"], answer:0, exp:"1071 Malazgirt Zaferi, Sultan Alparslan komutasında kazanılmış ve Anadolu’nun Türk yurdu olmasının önünü açmıştır."},
   {q:"Türk-İslam devletleri arasında “sultan” unvanını ilk kullanan hükümdar kimdir?", options:["Gazneli Mahmut","Alparslan","Tuğrul Bey","Melikşah"], answer:0},
   {q:"751 yılında yapılan ve Türklerin Müslüman Araplara yardım ederek Çinlilere karşı savaştığı, Türklerin İslamiyet’e yakınlaşmasında önemli bir dönüm noktası olan savaş hangisidir?", options:["Talas Savaşı","Malazgirt Savaşı","Kösedağ Savaşı","Ankara Savaşı"], answer:0, exp:"751 Talas Savaşı’nda Türkler, Çinlilere karşı Müslüman Araplarla iş birliği yapmış; bu olay Türklerin İslamiyet’e yakınlaşmasında önemli bir dönüm noktası olmuştur."},
   {q:"Büyük Selçuklu Devleti’nin kurucusu kimdir?", options:["Tuğrul Bey","Alparslan","Melikşah","Çağrı Bey"], answer:0}
 ]},
{id:'ta3', subject:'tarih', title:'Osmanlı Kuruluş ve Yükselme Dönemi',
 analogy:"Osmanlı’nın kuruluşu küçük bir beylikten imparatorluğa uzanan bir büyüme hikâyesidir — her padişah devlete yeni bir toprak katmıştır.",
 explain:"Osmanlı Devleti 1299’da Osman Bey tarafından kurulmuştur. İstanbul’un fethi (1453) II. Mehmet (Fatih) tarafından gerçekleştirilmiş, Orta Çağ’ın kapanıp Yeni Çağ’ın açıldığı kabul edilir. Yükselme döneminin zirvesi Kanuni Sultan Süleyman dönemidir (en geniş sınırlar).",
 strategy:"Padişah-olay eşleştirmelerine odaklan; fetih tarihlerini kronolojik sırayla akılda tut.",
 questions:[
   {q:"İstanbul’un fethi hangi padişah döneminde gerçekleşmiştir?", options:["II. Mehmet (Fatih)","I. Bayezid","II. Bayezid","Yavuz Sultan Selim"], answer:0},
   {q:"Osmanlı Devleti’nin sınırlarının en geniş olduğu dönem hangi padişaha aittir?", options:["Kanuni Sultan Süleyman","Fatih Sultan Mehmet","Yavuz Sultan Selim","I. Ahmet"], answer:0},
   {q:"Osmanlı Devleti hangi yılda ve kim tarafından kurulmuştur?", options:["1299, Osman Bey","1326, Orhan Bey","1453, Fatih Sultan Mehmet","1071, Alparslan"], answer:0},
   {q:"Halifelik unvanı hangi padişah döneminde Osmanlı hanedanına geçmiştir?", options:["Yavuz Sultan Selim","Kanuni Sultan Süleyman","Fatih Sultan Mehmet","II. Bayezid"], answer:0, exp:"1517’de Mısır’ın fethiyle halifelik unvanı Yavuz Sultan Selim ile Osmanlı hanedanına geçmiştir."},
   {q:"Barbaros Hayreddin Paşa’nın kazandığı ve Osmanlı’yı Akdeniz’de güçlü bir deniz gücü hâline getiren savaş hangisidir?", options:["Preveze Deniz Savaşı","İnebahtı Deniz Savaşı","Çeşme Deniz Savaşı","Navarin Deniz Savaşı"], answer:0}
 ]},
{id:'ta4', subject:'tarih', title:'Osmanlı Duraklama-Gerileme-Dağılma',
 analogy:"Bu dönem, büyümüş bir kurumun rakiplerine karşı avantajını kaybetmesi gibidir — Avrupa ilerlerken Osmanlı eski yöntemlerde ısrar etmiştir.",
 explain:"Karlofça Antlaşması (1699), Osmanlı’nın toprak kaybettiği ilk büyük antlaşmadır ve gerileme döneminin başlangıcı kabul edilir. III. Selim döneminde başlayan Nizam-ı Cedit hareketleri, Osmanlı’nın ilk ciddi yenileşme adımlarındandır. Islahat Fermanı (1856), gayrimüslim azınlıklara Müslümanlarla eşit haklar tanımıştır.",
 strategy:"“İlk toprak kaybı”, “gerilemenin başlangıcı” gibi dönüm noktası olayları birbirine karıştırma.",
 questions:[
   {q:"Osmanlı Devleti’nin toprak kaybettiği ilk antlaşma olarak kabul edilen ve gerileme döneminin başlangıcı sayılan antlaşma hangisidir?", options:["Karlofça Antlaşması (1699)","Küçük Kaynarca Antlaşması (1774)","Kasr-ı Şirin Antlaşması","Zitvatorok Antlaşması"], answer:0},
   {q:"Nizam-ı Cedit yenileşme hareketleri hangi padişah döneminde başlamıştır?", options:["III. Selim","II. Mahmut","I. Abdülhamit","III. Ahmet"], answer:0},
   {q:"Gayrimüslim azınlıklara Müslümanlarla eşit haklar tanıyan ferman hangisidir?", options:["Islahat Fermanı (1856)","Tanzimat Fermanı (1839)","Kanun-i Esasi (1876)","Sened-i İttifak (1808)"], answer:0},
   {q:"Osmanlı Devleti’nin Avrupa karşısında büyük bir yenilgi aldığı ve gerileme sürecini hızlandıran 1683 tarihli kuşatma hangisidir?", options:["II. Viyana Kuşatması","I. Viyana Kuşatması (1529)","Belgrad Kuşatması","Estergon Kuşatması"], answer:0, exp:"1683 II. Viyana Kuşatması’nın başarısızlıkla sonuçlanması, Karlofça Antlaşması’na giden süreci başlatan dönüm noktalarından biridir."},
   {q:"Osmanlı’da ilk kez daimi elçiliklerin açılması ve Batı’yı tanıma çabalarının yoğunlaştığı dönem hangisidir?", options:["Lale Devri","Tanzimat Dönemi","Meşrutiyet Dönemi","Fetret Devri"], answer:0}
 ]},
{id:'ta5', subject:'tarih', title:'Milli Mücadele ve TBMM',
 analogy:"Milli Mücadele, dağınık direniş ateşlerinin (Kuvâ-yi Milliye) tek bir meşaleye — düzenli ordu ve TBMM’ye — dönüşme hikâyesidir.",
 explain:"Milli Mücadele’nin başlangıcı Mustafa Kemal’in 19 Mayıs 1919’da Samsun’a çıkışı kabul edilir. TBMM 23 Nisan 1920’de Ankara’da açılmıştır. Büyük Taarruz (1922) ile Anadolu işgalden kurtarılmış, Lozan Antlaşması (1923) ile Kurtuluş Savaşı diplomatik olarak sonuçlandırılmıştır.",
 strategy:"Genelge-kongre-antlaşma sıralamasını kronolojik olarak ezberle; her birinin “ilk kez” özelliğine dikkat et.",
 questions:[
   {q:"Mustafa Kemal, Milli Mücadele’yi başlatmak amacıyla hangi tarihte Samsun’a çıkmıştır?", options:["19 Mayıs 1919","23 Nisan 1920","22 Haziran 1919","30 Ağustos 1922"], answer:0},
   {q:"TBMM hangi tarihte açılmıştır?", options:["23 Nisan 1920","19 Mayıs 1919","29 Ekim 1923","24 Temmuz 1923"], answer:0},
   {q:"Kurtuluş Savaşı’nı diplomatik olarak sonuçlandıran ve yeni Türk devletinin tanındığı antlaşma hangisidir?", options:["Lozan Antlaşması (1923)","Mudanya Ateşkesi (1922)","Sevr Antlaşması (1920)","Moskova Antlaşması (1921)"], answer:0},
   {q:"Kurtuluş Savaşı’nda Doğu Cephesi’nde Ermenilere karşı mücadele eden ve Gümrü Antlaşması ile sonuçlanan cepheyi kim yönetmiştir?", options:["Kâzım Karabekir Paşa","İsmet Paşa","Refet Bele","Fahrettin Altay"], answer:0},
   {q:"Sevr Antlaşması hangi yıl imzalanmış, ancak TBMM tarafından tanınmadığı için yürürlüğe girmemiştir?", options:["1920","1918","1923","1922"], answer:0}
 ]},
{id:'ta6', subject:'tarih', title:'Cumhuriyet Dönemi İnkılapları ve Atatürk İlkeleri',
 analogy:"İnkılaplar, eski bir evi yıkıp yerine modern bir ev inşa etmek gibidir — siyasi, hukuki, eğitim ve toplumsal alanlarda yeni bir yapı kurulmuştur.",
 explain:"Cumhuriyet 29 Ekim 1923’te ilan edilmiştir. Tevhid-i Tedrisat Kanunu (1924) eğitimi birleştirmiştir. Atatürk’ün altı ilkesi: Cumhuriyetçilik, Milliyetçilik, Halkçılık, Devletçilik, Laiklik, İnkılapçılık.",
 strategy:"İnkılapların hangi alanda ve hangi yılda gerçekleştiğini eşleştirerek çalış.",
 questions:[
   {q:"Türkiye Cumhuriyeti hangi tarihte ilan edilmiştir?", options:["29 Ekim 1923","23 Nisan 1920","3 Mart 1924","30 Ağustos 1922"], answer:0},
   {q:"Öğretimi millileştiren ve dinî-laik eğitim ikiliğine son veren kanun hangisidir?", options:["Tevhid-i Tedrisat Kanunu (1924)","Medeni Kanun (1926)","Harf İnkılabı (1928)","Kabotaj Kanunu (1926)"], answer:0},
   {q:"Aşağıdakilerden hangisi Atatürk ilkelerinden biri değildir?", options:["Meşrutiyetçilik","Halkçılık","Laiklik","Devletçilik"], answer:0, exp:"Atatürk’ün altı ilkesi Cumhuriyetçilik, Milliyetçilik, Halkçılık, Devletçilik, Laiklik ve İnkılapçılık’tır; “Meşrutiyetçilik” bu ilkeler arasında yer almaz."},
   {q:"Kadınlara milletvekili seçme ve seçilme hakkı hangi yıl tanınmıştır?", options:["1934","1930","1926","1923"], answer:0, exp:"1930’da kadınlara belediye seçimlerinde, 1934’te ise milletvekili seçme-seçilme hakkı tanınmıştır."},
   {q:"Harf İnkılabı (Latin alfabesine geçiş) hangi yıl gerçekleştirilmiştir?", options:["1928","1924","1930","1934"], answer:0}
 ]},
{id:'ta7', subject:'tarih', title:'Çağdaş Türk ve Dünya Tarihi',
 analogy:"Bu dönem, genç Türkiye Cumhuriyeti’nin dünyadaki büyük fırtınalar (dünya savaşları, Soğuk Savaş) arasında ayakta kalma ve yerini sağlamlaştırma hikâyesidir.",
 explain:"Türkiye, II. Dünya Savaşı (1939-1945) boyunca fiilen savaşa girmeyip tarafsız kalmayı tercih etmiştir. 1945’te Birleşmiş Milletler’e kurucu üye olarak katılmıştır. Soğuk Savaş döneminde Sovyet tehdidine karşı Batı bloğuna yakınlaşan Türkiye, 1952’de NATO’ya üye olmuştur. Kıbrıs Barış Harekâtı 1974’te gerçekleştirilmiştir.",
 strategy:"Türkiye’nin uluslararası kuruluşlara üyelik tarihlerini (BM 1945, NATO 1952) ve II. Dünya Savaşı’ndaki tarafsızlık politikasını net biçimde ayırt et.",
 questions:[
   {q:"Türkiye, II. Dünya Savaşı’nda nasıl bir politika izlemiştir?", options:["Savaşın sonuna kadar büyük ölçüde tarafsız kalmıştır","Almanya’nın yanında savaşa girmiştir","Müttefiklerin yanında baştan itibaren savaşmıştır","Savaşın başından itibaren fiilen çatışmaya girmiştir"], answer:0},
   {q:"Türkiye, Birleşmiş Milletler’e hangi yıl kurucu üye olarak katılmıştır?", options:["1945","1952","1923","1960"], answer:0},
   {q:"Türkiye NATO’ya hangi yıl üye olmuştur?", options:["1952","1945","1960","1974"], answer:0},
   {q:"Kıbrıs Barış Harekâtı hangi yıl gerçekleştirilmiştir?", options:["1974","1960","1980","1964"], answer:0},
   {q:"Soğuk Savaş döneminde Türkiye, Sovyet tehdidine karşı hangi blokla yakınlaşmıştır?", options:["Batı bloğu (ABD ve müttefikleri)","Doğu bloğu (Sovyetler Birliği)","Bağlantısızlar Hareketi","Üçüncü Dünya ülkeleri"], answer:0}
 ]},

{id:'cg1', subject:'cografya', title:"Türkiye'nin Coğrafi Konumu",
 analogy:"Türkiye’nin konumu, üç kıtanın kesiştiği bir kavşakta duran bir şehir merkezi gibidir — bu kavşak konumu hem avantaj hem çeşitlilik getirir.",
 explain:"Türkiye, matematik konum olarak 36-42° kuzey paralelleri ile 26-45° doğu meridyenleri arasında yer alır. Özel konumu; Asya-Avrupa arasında köprü olması, üç tarafının denizlerle çevrili olması, önemli boğazlara sahip olması gibi sonuçlar doğurur.",
 strategy:"Bir sonucun matematik konum mu yoksa özel konum mu kaynaklı olduğunu ayırt et: enlem/boylamla ilgiliyse matematik, komşuluk/denizlerle ilgiliyse özel konumdur.",
 questions:[
   {q:"Türkiye’nin doğusu ile batısı arasında yerel saat farkının olması hangi konumun sonucudur?", options:["Matematik konum","Özel konum","Coğrafi bölge konumu","İklim konumu"], answer:0},
   {q:"Türkiye’nin üç kıtanın kesişim noktasında yer alması ve önemli ticaret yolları üzerinde bulunması hangi konumun sonucudur?", options:["Özel konum","Matematik konum","Astronomik konum","Yerel konum"], answer:0},
   {q:"Türkiye hangi enlemler arasında yer alır?", options:["36°-42° kuzey","26°-45° kuzey","0°-23° kuzey","42°-50° kuzey"], answer:0},
   {q:"Türkiye’nin batısı ile doğusu arasındaki yerel saat farkı yaklaşık ne kadardır?", options:["Yaklaşık 76 dakika (1 saat 16 dk)","Yaklaşık 30 dakika","Yaklaşık 2 saat","Fark yoktur"], answer:0},
   {q:"Türkiye’nin kara komşusu sayısı kaçtır?", options:["8","6","10","7"], answer:0, exp:"Türkiye’nin Yunanistan, Bulgaristan, Gürcistan, Ermenistan, Nahçıvan (Azerbaycan), İran, Irak ve Suriye olmak üzere 8 komşusu vardır."}
 ]},
{id:'cg2', subject:'cografya', title:"Türkiye'nin İklimi",
 analogy:"Türkiye’nin iklim çeşitliliği, aynı anda farklı gardıraplardan kıyafet seçmek zorunda kalmak gibidir — kıyıda mayo, İç Anadolu’da kalın mont gerekebilir.",
 explain:"Karadeniz İklimi: her mevsim yağışlı, yazı serin kışı ılık. Akdeniz/Ege İklimi: yazlar sıcak-kurak, kışlar ılık-yağışlı. İç Anadolu (karasal) iklimi: yazlar sıcak-kurak, kışlar soğuk ve kar yağışlı, yıllık yağış azdır. Denize uzaklık ve yükselti arttıkça karasallık artar.",
 strategy:"Tarif edilen sıcaklık-yağış özelliklerinden hangi bölgenin iklimi olduğunu çıkar; “her mevsim yağışlı” ifadesi hep Karadeniz’i işaret eder.",
 questions:[
   {q:"Her mevsim yağışlı, yazı serin kışı ılık geçen iklim tipi hangi bölgemizde görülür?", options:["Karadeniz","İç Anadolu","Akdeniz","Doğu Anadolu"], answer:0},
   {q:"Yazları sıcak-kurak, kışları soğuk-kar yağışlı geçen, yıllık yağışı düşük iklim tipi nerede görülür?", options:["İç Anadolu","Karadeniz","Ege","Marmara"], answer:0, exp:"Bu özellikler karasal iklimin tanımıdır ve en belirgin biçimde İç Anadolu’da görülür."},
   {q:"Bir yerin denizden uzaklaşması ve yükseltisinin artması genellikle neye yol açar?", options:["Karasallığın artmasına","Yağışın artmasına","Nemin artmasına","Kışların ılımanlaşmasına"], answer:0},
   {q:"Akdeniz iklimine sahip bir bölgede yetişen tipik doğal bitki örtüsü hangisidir?", options:["Maki","Bozkır (step)","Tundra","İğne yapraklı orman (tayga)"], answer:0},
   {q:"İç Anadolu’da doğal bitki örtüsü olarak hangisi görülür?", options:["Bozkır (step)","Maki","Gür ormanlar","Tayga"], answer:0}
 ]},
{id:'cg3', subject:'cografya', title:'Yerşekilleri',
 analogy:"Türkiye’nin yerşekilleri farklı jeolojik dönemlerin izlerini taşıyan bir maket gibidir — genç kıvrım dağlar, geniş platolar, derin vadiler.",
 explain:"Türkiye, Alp-Himalaya kıvrım kuşağında yer aldığı için dağları genç ve diktir (deprem riski yüksektir). Kuzey Anadolu Dağları ve Toros Dağları kıyıya paralel uzanır. Akarsuların çoğu Karadeniz ve Akdeniz’e dökülür, boyları kısa, akış hızları fazladır (enerji potansiyeli yüksek, ulaşıma elverişsiz).",
 strategy:"“Genç-diri, deprem riski” ifadeleri hep Alp-Himalaya kuşağıyla, “kısa boylu hızlı akarsu” ifadesi hidroelektrik potansiyeliyle ilişkilendirilir.",
 questions:[
   {q:"Türkiye’de dağların genç ve diri olmasının, deprem riskinin yüksek olmasının temel nedeni nedir?", options:["Alp-Himalaya kıvrım kuşağında yer alması","Üç tarafının denizlerle çevrili olması","Ilıman iklim kuşağında bulunması","Yüzölçümünün büyük olması"], answer:0},
   {q:"Türkiye’de akarsuların boylarının kısa, akış hızlarının fazla olmasının temel sonucu nedir?", options:["Hidroelektrik enerji potansiyelinin yüksek, ulaşıma elverişsiz olması","Ulaşıma çok elverişli olmaları","Taşımacılıkta yoğun kullanılmaları","Tuzluluk oranlarının artması"], answer:0},
   {q:"Türkiye’nin ortalama yükseltisi hangi yönde artış gösterir?", options:["Batıdan doğuya","Kuzeyden güneye","Doğudan batıya","Güneyden kuzeye"], answer:0},
   {q:"Türkiye’nin en yüksek dağı hangisidir?", options:["Ağrı Dağı","Erciyes Dağı","Uludağ","Kaçkar Dağı"], answer:0, exp:"5137 m yüksekliğiyle Ağrı Dağı, Türkiye’nin en yüksek dağıdır."},
   {q:"Türkiye’nin en uzun akarsuyu hangisidir?", options:["Kızılırmak","Fırat","Sakarya Nehri","Yeşilırmak"], answer:0}
 ]},

/* ---------- Plan üretimi ---------- */
function buildDayTypes(){
  const flexDays = 37; // gün 2-38 arası (gün 1=tespit, 39=deneme, 40=final sabit)
  const lessonSlotsTarget = Math.min(TOPICS.length, flexDays - 3); // en az 3 tekrar günü kalsın
  const reviewDays = flexDays - lessonSlotsTarget;
  const interval = Math.max(2, Math.floor(flexDays / (reviewDays + 1)));
  const types = [{day:1, type:'diagnostic'}];
  let contentIndex = 0, reviewsPlaced = 0;
  for(let d=2; d<=40; d++){
    if(d===40){ types.push({day:d, type:'final'}); continue; }
    if(d===39){ types.push({day:d, type:'deneme'}); continue; }
    contentIndex++;
    const isReviewSlot = (contentIndex % interval === 0) && reviewsPlaced < reviewDays;
    if(isReviewSlot){ types.push({day:d, type:'review'}); reviewsPlaced++; }
    else { types.push({day:d, type:'lesson'}); }
  }
  return types;
}

function assignTopicsToSlots(slotCount){
  const bySubject = {};
  SUBJECTS.forEach(s=> bySubject[s.id] = TOPICS.filter(t=>t.subject===s.id));
  const order = SUBJECTS.map(s=>s.id);
  const ptr = {}; order.forEach(id=> ptr[id]=0);
  const result = [];
  let idx = 0, guard = 0;
  while(result.length < slotCount && guard < 2000){
    guard++;
    const sid = order[idx % order.length]; idx++;
    if(ptr[sid] < bySubject[sid].length){
      result.push({topic: bySubject[sid][ptr[sid]], isReview:false});
      ptr[sid]++;
    }
    if(order.every(id => ptr[id] >= bySubject[id].length)) break;
  }
  if(result.length < slotCount){
    const weightOrder = SUBJECTS.slice().sort((a,b)=>b.weight-a.weight).map(s=>s.id);
    const extraPtr = {}; weightOrder.forEach(id=> extraPtr[id]=0);
    let wi = 0, g2 = 0;
    while(result.length < slotCount && g2 < 2000){
      g2++;
      const sid = weightOrder[wi % weightOrder.length]; wi++;
      const arr = bySubject[sid];
      if(!arr.length) continue;
      result.push({topic: arr[extraPtr[sid] % arr.length], isReview:true});
      extraPtr[sid]++;
    }
  }
  return result;
}

function buildFullPlan(){
  const dayTypes = buildDayTypes();
  const lessonSlots = dayTypes.filter(d=>d.type==='lesson');
  const assignments = assignTopicsToSlots(lessonSlots.length);
  let ai = 0;
  const plan = [];
  let sinceReview = [];
  dayTypes.forEach(d=>{
    if(d.type==='diagnostic'){
      plan.push({day:d.day, type:'diagnostic'});
    } else if(d.type==='lesson'){
      const a = assignments[ai++];
      plan.push({day:d.day, type:'lesson', topicId:a.topic.id, isReview:a.isReview});
      sinceReview.push(a.topic.id);
    } else if(d.type==='review'){
      plan.push({day:d.day, type:'review', topicIds: sinceReview.slice()});
      sinceReview = [];
    } else if(d.type==='deneme'){
      plan.push({day:d.day, type:'deneme', topicIds: TOPICS.map(t=>t.id)});
    } else if(d.type==='final'){
      plan.push({day:d.day, type:'final'});
    }
  });
  return plan;
}

/* ---------- Depolama ---------- */
const LS_PLAN='rota40_plan', LS_START='rota40_start', LS_PROGRESS='rota40_progress';

function loadOrCreatePlan(){
  let plan = localStorage.getItem(LS_PLAN);
  if(plan){ try{ return JSON.parse(plan); }catch(e){} }
  const fresh = buildFullPlan();
  localStorage.setItem(LS_PLAN, JSON.stringify(fresh));
  return fresh;
}
function getStartDate(){
  let s = localStorage.getItem(LS_START);
  if(!s){ s = new Date().toISOString(); localStorage.setItem(LS_START, s); }
  return new Date(s);
}
function loadProgress(){
  let p = localStorage.getItem(LS_PROGRESS);
  if(p){ try{ return JSON.parse(p); }catch(e){} }
  return {days:{}, bySubject:{}};
}
function saveProgress(p){ localStorage.setItem(LS_PROGRESS, JSON.stringify(p)); }

let PLAN = loadOrCreatePlan();
let PROGRESS = loadProgress();
const START_DATE = getStartDate();

function todayIndex(){
  const diff = Math.floor((Date.now() - START_DATE.getTime()) / 86400000);
  return Math.min(Math.max(diff+1, 1), 40);
}
function daysUntilExam(){
  const diff = Math.ceil((EXAM_DATE.getTime() - Date.now()) / 86400000);
  return Math.max(diff, 0);
}
function planFor(day){ return PLAN.find(p=>p.day===day); }
function coachLine(day){ return COACH_LINES[day % COACH_LINES.length]; }

function recordResult(day, correct, total, subjectTally, elapsedSeconds){
  PROGRESS.days[day] = {done:true, correct, total, ts: Date.now(), elapsed: elapsedSeconds||0};
  Object.keys(subjectTally).forEach(sid=>{
    if(!PROGRESS.bySubject[sid]) PROGRESS.bySubject[sid] = {correct:0, total:0};
    PROGRESS.bySubject[sid].correct += subjectTally[sid].correct;
    PROGRESS.bySubject[sid].total += subjectTally[sid].total;
  });
  saveProgress(PROGRESS);
}

function streakCount(){
  let s = 0;
  let d = todayIndex();
  // bugün henüz yapılmadıysa dünden say
  if(!PROGRESS.days[d] || !PROGRESS.days[d].done) d -= 1;
  while(d >= 1 && PROGRESS.days[d] && PROGRESS.days[d].done){ s++; d--; }
  return s;
}

/* ---------- Soru havuzu yardımcıları ---------- */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function questionsFromTopics(topicIds, cap){
  let pool = [];
  topicIds.forEach(tid=>{
    const t = topicOf(tid);
    if(!t) return;
    t.questions.forEach(q=> pool.push(Object.assign({}, q, {subject:t.subject, topicTitle:t.title})));
  });
  pool = shuffle(pool);
  return cap ? pool.slice(0, cap) : pool;
}
function diagnosticQuestions(){
  let pool = [];
  SUBJECTS.forEach(s=>{
    const topics = TOPICS.filter(t=>t.subject===s.id);
    const picks = shuffle(topics).slice(0,2);
    picks.forEach(t=>{
      const q = t.questions[0];
      pool.push(Object.assign({}, q, {subject:s.id, topicTitle:t.title}));
    });
  });
  return shuffle(pool);
}

  const c = document.getElementById(containerId);
  let html = '<div class="quiz-timer" id="quizTimer">00:00</div>';
  questions.forEach((q, i)=>{
    html += '<div class="qblock" data-qi="'+i+'">';
    html += '<div class="qnum">SORU '+(i+1)+' / '+questions.length+ (q.topicTitle? ' · '+esc(q.topicTitle):'') +'</div>';
    html += '<div class="qtext">'+esc(q.q)+'</div>';
    const letters=['A','B','C','D'];
    q.options.forEach((opt, oi)=>{
      html += '<div class="opt" data-oi="'+oi+'"><span class="letter">'+letters[oi]+'</span><span>'+esc(opt)+'</span></div>';
    });
    if(q.exp) html += '<div class="qexp">'+esc(q.exp)+'</div>';
    html += '</div>';
  });
  html += '<button class="btn btn-primary" id="quizSubmitBtn" disabled>Önce tüm soruları cevapla</button>';
  c.innerHTML = html;

  const quizStart = Date.now();
  const timerEl = document.getElementById('quizTimer');
  const timerInterval = setInterval(()=>{
    const s = Math.floor((Date.now()-quizStart)/1000);
    const mm = String(Math.floor(s/60)).padStart(2,'0');
    const ss = String(s%60).padStart(2,'0');
    if(timerEl) timerEl.textContent = mm+':'+ss;
  }, 1000);

  const answers = new Array(questions.length).fill(null);
  c.querySelectorAll('.qblock').forEach(block=>{
    const qi = parseInt(block.getAttribute('data-qi'),10);
    block.querySelectorAll('.opt').forEach(optEl=>{
      optEl.addEventListener('click', ()=>{
        if(answers[qi] !== null) return;
        const oi = parseInt(optEl.getAttribute('data-oi'),10);
        answers[qi] = oi;
        block.querySelectorAll('.opt').forEach(o=>o.classList.add('selected-lock'));
        optEl.classList.add('selected');
        const allAnswered = answers.every(a=>a!==null);
        const btn = document.getElementById('quizSubmitBtn');
        if(allAnswered){ btn.disabled=false; btn.textContent='Sonuçları Gör'; }
        else { btn.disabled=true; btn.textContent='Kalan soru: '+answers.filter(a=>a===null).length; }
      });
    });
  });

  document.getElementById('quizSubmitBtn').addEventListener('click', ()=>{
    let correct = 0;
    const subjectTally = {};
    questions.forEach((q,qi)=>{
      const block = c.querySelector('.qblock[data-qi="'+qi+'"]');
      const opts = block.querySelectorAll('.opt');
      opts.forEach((optEl,oi)=>{
        optEl.classList.add('disabled');
        if(oi===q.answer) optEl.classList.add('correct');
        else if(oi===answers[qi]) optEl.classList.add('wrong');
      });
      const exp = block.querySelector('.qexp');
      if(exp) exp.classList.add('show');
      if(answers[qi]===q.answer) correct++;
      if(!subjectTally[q.subject]) subjectTally[q.subject]={correct:0,total:0};
      subjectTally[q.subject].total++;
      if(answers[qi]===q.answer) subjectTally[q.subject].correct++;
    });
    clearInterval(timerInterval);
    const elapsedSeconds = Math.floor((Date.now()-quizStart)/1000);
    document.getElementById('quizSubmitBtn').style.display='none';
    const doneBtn = document.createElement('button');
    doneBtn.className='btn btn-secondary';
    doneBtn.textContent='Bitir ve Kaydet';
    doneBtn.style.marginTop='16px';
    c.appendChild(doneBtn);
    doneBtn.addEventListener('click', ()=> onFinish(correct, questions.length, subjectTally, elapsedSeconds));
    c.scrollIntoView({behavior:'smooth', block:'start'});
  });
}

function renderScoreScreen(container, day, correct, total, elapsedSeconds){
  const pct = Math.round((correct/total)*100);
  let msg;
  if(pct>=80) msg='Tam bir maraton koşucususun. Bu tempoyla devam.';
  else if(pct>=50) msg='İşe yarıyor ama daha sert çalışmalısın. Yarın üstüne git.';
  else msg='Bu konuyu bugün tekrar oku, boşluk bırakma — 40 gün az.';
  let timeStr = '';
  if(elapsedSeconds){
    const mm = String(Math.floor(elapsedSeconds/60)).padStart(2,'0');
    const ss = String(elapsedSeconds%60).padStart(2,'0');
    timeStr = ' · '+mm+':'+ss+' sürede';
  }
  container.innerHTML =
    '<div class="score-hero">'+
      '<div class="big">'+correct+'/'+total+'</div>'+
      '<div class="sub">%'+pct+' doğru — Gün '+day+' tamamlandı'+timeStr+'</div>'+
    '</div>'+
    '<div class="card"><p>'+esc(msg)+'</p></div>'+
    '<button class="btn btn-secondary" id="backTodayBtn">Bugüne Dön</button>';
  document.getElementById('backTodayBtn').addEventListener('click', ()=> showDay(day));
}

function showDay(day){
  const plan = planFor(day);
  const container = document.getElementById('screen-today');
  const isTodayReal = (day === todayIndex());
  const done = PROGRESS.days[day] && PROGRESS.days[day].done;

  let headerHtml = '<div class="hero-row"><div class="hero-day">'+(isTodayReal? 'BUGÜN · ':'')+'Gün <b>'+day+'</b> / 40</div>';
  if(plan.type==='lesson'){
    headerHtml += '<div class="subject-chip">'+subjectDotHtml(topicOf(plan.topicId).subject)+esc(subjectOf(topicOf(plan.topicId).subject).name)+'</div>';
  } else {
    headerHtml += '<div class="subject-chip">'+esc(DAY_TYPE_LABEL[plan.type])+'</div>';
  }
  headerHtml += '</div>';

  if(day!==todayIndex()){
    headerHtml += '<div style="margin-bottom:10px;"><button class="btn btn-secondary" id="jumpTodayBtn" style="padding:9px;font-size:12.5px;">← Bugüne dön (Gün '+todayIndex()+')</button></div>';
  }

  headerHtml += '<div class="coach-line">'+esc(coachLine(day))+'<span class="accent">.</span></div>';

  container.innerHTML = headerHtml + '<div id="dayBody"></div>';
  const jt = document.getElementById('jumpTodayBtn');
  if(jt) jt.addEventListener('click', ()=> showDay(todayIndex()));

  const body = document.getElementById('dayBody');

  if(done && plan.type!=='final'){
    const r = PROGRESS.days[day];
    body.innerHTML =
      '<div class="card">'+
        '<div class="kicker">BUGÜNÜ TAMAMLADIN ✅</div>'+
        '<h3>Skor: '+r.correct+'/'+r.total+'</h3>'+
        '<p>Tekrar çözmek istersen aşağıdan başlayabilirsin — istatistiklerin güncellenir.</p>'+
      '</div>'+
      '<button class="btn btn-secondary" id="redoBtn">Tekrar Çöz</button>';
    document.getElementById('redoBtn').addEventListener('click', ()=> startDaySession(day, plan, body));
    return;
  }

  if(plan.type==='final'){
    body.innerHTML =
      '<div class="card">'+
        '<h3>Maraton bitti, sıra sende.</h3>'+
        '<p>Bugün yeni konu yok. Tek işin: dinlenmek ve son kontrolleri yapmak. Yorgun bir kafayla değil, dinlenmiş bir kafayla gir.</p>'+
      '</div>'+
      '<div class="card">'+
        '<h3>Sınav Günü Kontrol Listesi</h3>'+
        '<ul class="checklist">'+
          '<li><span class="ck">✓</span> Sınav giriş belgesi ve kimlik (nüfus cüzdanı/pasaport/ehliyet) hazır mı?</li>'+
          '<li><span class="ck">✓</span> Sınav merkezine erken çıkmayı planla, saat 10.00’dan sonra binaya alınmıyorsun.</li>'+
          '<li><span class="ck">✓</span> Kurşun kalem, silgi, kalemtıraş yanında olsun.</li>'+
          '<li><span class="ck">✓</span> Zorlandığın soruda takılma, işaretleyip geç; sonda dön.</li>'+
          '<li><span class="ck">✓</span> Optik formu işaretlemeyi soru çözerken değil, düzenli aralıklarla yap.</li>'+
          '<li><span class="ck">✓</span> Bu gece erken yat — son gece çalışmak yerine dinlenmek daha fazla puan getirir.</li>'+
        '</ul>'+
      '</div>';
    renderWeakestTip(body);
    return;
  }

  if(plan.type==='diagnostic'){
    body.innerHTML =
      '<div class="card">'+
        '<div class="kicker">1. GÜN</div>'+
        '<h3>Nerede olduğunu görelim.</h3>'+
        '<p>5 dersten 2\'şer soruluk kısa bir tur. Doğru-yanlış sonucun 40 günlük rotanı etkilemeyecek, sadece nereden başladığını gösterecek.</p>'+
      '</div>'+
      '<button class="btn btn-primary" id="startBtn">Teste Başla</button>';
    document.getElementById('startBtn').addEventListener('click', ()=> startDaySession(day, plan, body));
    return;
  }

  if(plan.type==='lesson'){
    const t = topicOf(plan.topicId);
    body.innerHTML =
      '<div class="topic-title">'+esc(t.title)+'</div>'+
      '<div class="card"><div class="kicker">GÜNLÜK HAYATTAN</div><p>'+esc(t.analogy)+'</p></div>'+
      '<div class="card"><div class="kicker">KONU ANLATIMI</div><p>'+esc(t.explain)+'</p></div>'+
      '<div class="card"><div class="kicker">SORUYA YAKLAŞIM</div><p>'+esc(t.strategy)+'</p></div>'+
      (plan.isReview? '<div class="card"><p style="color:var(--text-muted);font-size:13px;">Bu, önceki bir konunun ek pratik turu — özet üstünden hızlıca geçip sorulara geç.</p></div>':'')+
      '<button class="btn btn-primary" id="startBtn">Soruları Çöz ('+t.questions.length+' soru)</button>';
    document.getElementById('startBtn').addEventListener('click', ()=> startDaySession(day, plan, body));
    return;
  }

  if(plan.type==='review'){
    const titles = plan.topicIds.map(id=>topicOf(id)?.title).filter(Boolean);
    body.innerHTML =
      '<div class="card">'+
        '<div class="kicker">TEKRAR & PRATİK</div>'+
        '<h3>Bu haftanın konuları</h3>'+
        '<p>'+esc(titles.join(' · '))+'</p>'+
        '<p style="color:var(--text-muted);">Karışık bir set halinde bu konulardan sorular geliyor. Hız değil, kalıcılık hedefin.</p>'+
      '</div>'+
      '<button class="btn btn-primary" id="startBtn">Tekrar Setine Başla</button>';
    document.getElementById('startBtn').addEventListener('click', ()=> startDaySession(day, plan, body));
    return;
  }

  if(plan.type==='deneme'){
    body.innerHTML =
      '<div class="card">'+
        '<div class="kicker">39. GÜN</div>'+
        '<h3>Genel Deneme Sınavı</h3>'+
        '<p>40 günde işlediğin tüm konulardan karışık 20 soru. Gerçek sınav gibi düşün: sakin ama kararlı.</p>'+
      '</div>'+
      '<button class="btn btn-primary" id="startBtn">Denemeye Başla (20 soru)</button>';
    document.getElementById('startBtn').addEventListener('click', ()=> startDaySession(day, plan, body));
    return;
  }
}

function startDaySession(day, plan, body){
  let questions;
  if(plan.type==='diagnostic') questions = diagnosticQuestions();
  else if(plan.type==='lesson') questions = questionsFromTopics([plan.topicId]);
  else if(plan.type==='review') questions = questionsFromTopics(plan.topicIds, 8);
  else if(plan.type==='deneme') questions = questionsFromTopics(plan.topicIds, 20);
  body.innerHTML = '<div id="quizArea"></div>';
  renderQuizList(questions, 'quizArea', (correct, total, subjectTally, elapsedSeconds)=>{
    recordResult(day, correct, total, subjectTally, elapsedSeconds);
    renderScoreScreen(body, day, correct, total, elapsedSeconds);
    renderTopBar();
  });
}

function renderWeakestTip(container){
  const entries = Object.keys(PROGRESS.bySubject)
    .filter(sid=> PROGRESS.bySubject[sid].total >= 6)
    .map(sid=>({ sid, acc: PROGRESS.bySubject[sid].correct/PROGRESS.bySubject[sid].total }));
  if(!entries.length) return;
  entries.sort((a,b)=>a.acc-b.acc);
  const weakest = entries[0];
  const el = document.createElement('div');
  el.className='card';
  el.innerHTML = '<div class="kicker">SON DAKİKA ODAK</div><p>En düşük başarı oranın <b>'+esc(subjectOf(weakest.sid).name)+'</b> konusunda (%'+Math.round(weakest.acc*100)+'). Sınav öncesi son taramanı bu dersten yap.</p>';
  container.appendChild(el);
}

/* ---------- Takvim ---------- */
function renderCalendar(){
  const c = document.getElementById('screen-cal');
  const ti = todayIndex();
  let html = '<div class="hero-row"><div class="hero-day"><b>40 Günlük Rota</b></div></div>';
  html += '<div class="cal-grid">';
  for(let d=1; d<=40; d++){
    const plan = planFor(d);
    const done = PROGRESS.days[d] && PROGRESS.days[d].done;
    let cls='cal-cell'+(d===ti? ' today':'')+(done? ' done':'');
    let dotColor = 'var(--text-muted)';
    if(plan.type==='lesson') dotColor = subjectColor(topicOf(plan.topicId).subject);
    else if(plan.type==='review') dotColor = 'var(--accent)';
    else if(plan.type==='deneme') dotColor = 'var(--danger)';
    else if(plan.type==='diagnostic') dotColor = 'var(--text-muted)';
    else if(plan.type==='final') dotColor = 'var(--success)';
    html += '<div class="'+cls+'" data-day="'+d+'"><span class="cdot" style="background:'+dotColor+'"></span>'+d+(done?'<span class="cchk">✓</span>':'')+'</div>';
  }
  html += '</div>';
  html += '<div class="cal-legend">';
  SUBJECTS.forEach(s=>{ html += '<span><span class="sw" style="background:'+subjectColor(s.id)+'"></span>'+esc(s.name)+'</span>'; });
  html += '<span><span class="sw" style="background:var(--accent)"></span>Tekrar</span>';
  html += '<span><span class="sw" style="background:var(--danger)"></span>Deneme</span>';
  html += '<span><span class="sw" style="background:var(--success)"></span>Final</span>';
  html += '</div>';
  c.innerHTML = html;
  c.querySelectorAll('.cal-cell').forEach(cell=>{
    cell.addEventListener('click', ()=>{
      const d = parseInt(cell.getAttribute('data-day'),10);
      switchTab('today');
      showDay(d);
    });
  });
}

/* ---------- İlerleme ---------- */
function renderProgress(){
  const c = document.getElementById('screen-progress');
  const doneDays = Object.values(PROGRESS.days).filter(x=>x.done).length;
  let totalQ=0, totalCorrect=0;
  Object.values(PROGRESS.days).forEach(d=>{ totalQ+=d.total||0; totalCorrect+=d.correct||0; });
  const overallPct = totalQ? Math.round((totalCorrect/totalQ)*100) : 0;

  let html = '<div class="hero-row"><div class="hero-day"><b>İlerleme</b></div></div>';
  html += '<div class="stat-grid">';
  html += '<div class="stat-box"><div class="n">'+doneDays+'/40</div><div class="l">TAMAMLANAN GÜN</div></div>';
  html += '<div class="stat-box"><div class="n">'+streakCount()+'</div><div class="l">GÜNLÜK SERİ</div></div>';
  html += '<div class="stat-box"><div class="n">'+totalQ+'</div><div class="l">ÇÖZÜLEN SORU</div></div>';
  html += '<div class="stat-box"><div class="n">%'+overallPct+'</div><div class="l">GENEL BAŞARI</div></div>';
  html += '</div>';

  html += '<div class="route-strip">';
  for(let d=1; d<=40; d++){
    html += '<div class="route-seg'+((PROGRESS.days[d]&&PROGRESS.days[d].done)?' done':'')+'"></div>';
  }
  html += '</div><div style="font-size:11px;color:var(--text-muted);margin-bottom:20px;">Gün 1 → Gün 40</div>';

  html += '<div class="card"><h3>Konu Bazlı Başarı</h3>';
  SUBJECTS.forEach(s=>{
    const st = PROGRESS.bySubject[s.id];
    const pct = st && st.total ? Math.round((st.correct/st.total)*100) : 0;
    html += '<div class="subject-row"><div class="srow-top"><span class="sname">'+subjectDotHtml(s.id)+esc(s.name)+'</span><span>'+(st?('%'+pct):'—')+'</span></div>';
    html += '<div class="progress-track"><div class="progress-fill" style="width:'+pct+'%;background:'+subjectColor(s.id)+'"></div></div></div>';
  });
  html += '</div>';

  c.innerHTML = html;
  renderWeakestTip(c);
}

/* ---------- Ayarlar ---------- */
function renderSettings(){
  const c = document.getElementById('screen-settings');
  c.innerHTML =
    '<div class="hero-row"><div class="hero-day"><b>Ayarlar</b></div></div>'+
    '<div class="card"><h3>Rota nasıl kuruldu?</h3>'+
    '<p>40 gün; Türkçe ve Matematik en yüksek soru ağırlığına sahip olduğu için en sık, Tarih-Coğrafya-Vatandaşlık dengeli aralıklarla programa yerleştirildi. Konu sayısı arttıkça tekrar günleri arasındaki aralık kendini otomatik ayarlar; 39. gün genel deneme, 40. gün dinlenme ve strateji günüdür.</p></div>'+
    '<div class="card"><h3>Sınav</h3><p>2026-KPSS Ortaöğretim — 25 Ekim 2026 Pazar, 10.15</p></div>'+
    '<button class="btn btn-secondary" id="resetBtn">Rotayı Sıfırla</button>'+
    '<p style="color:var(--text-muted);font-size:11.5px;text-align:center;margin-top:24px;">Rota40 — tüm verilerin sadece bu cihazda saklanır.</p>';
  document.getElementById('resetBtn').addEventListener('click', ()=>{
    if(confirm('Tüm ilerlemen ve plan sıfırlanacak. Emin misin?')){
      localStorage.removeItem(LS_PLAN);
      localStorage.removeItem(LS_START);
      localStorage.removeItem(LS_PROGRESS);
      location.reload();
    }
  });
}

/* ---------- Sekme geçişi ---------- */
function switchTab(tab){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.navbtn').forEach(b=>b.classList.remove('active'));
  document.getElementById('screen-'+tab).classList.add('active');
  document.querySelector('.navbtn[data-tab="'+tab+'"]').classList.add('active');
  if(tab==='today') showDay(todayIndex());
  if(tab==='cal') renderCalendar();
  if(tab==='progress') renderProgress();
  if(tab==='settings') renderSettings();
}

document.querySelectorAll('.navbtn').forEach(btn=>{
  btn.addEventListener('click', ()=> switchTab(btn.getAttribute('data-tab')));
});

renderTopBar();
switchTab('today');
</script>
